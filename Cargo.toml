[package]
name = "ride-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "ride_engine"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "ride-engine"
path = "src/bin/ride_engine/main.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
pulldown-cmark = "0.13"
quick-xml = { version = "=0.38.4", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sha2 = "0.10"
shlex = "2.0.1"
tantivy = "0.24"
thiserror = "2.0.20"
toml = "0.9.5"
tree-sitter = "=0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-cmake = "0.7.4"
tree-sitter-cpp = "0.23.4"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.3"
tree-sitter-rust = "=0.23.3"
tree-sitter-toml-ng = "0.7.0"
uniffi = "0.29.4"

[dev-dependencies]
tempfile = "3.23.0"
