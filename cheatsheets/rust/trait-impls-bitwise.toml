[[entries]]
name = "impl Iterator with state"
keys = ["impl", "iterator", "next", "state", "counter", "struct", "custom", "generator"]
doc = "Iterator over a struct's own counter, ending when a limit is reached."
snippet = '''
struct ${1:Counter} {
    ${2:n}: ${3:u32},
}

impl Iterator for ${1:Counter} {
    type Item = ${3:u32};

    fn next(&mut self) -> Option<Self::Item> {
        if self.${2:n} < ${4:5} {
            self.${2:n} += 1;
            Some(self.${2:n})
        } else {
            None
        }$0
    }
}'''

