title = "Standard trait impls: bitwise, shift and iteration"
contexts = ["item"]

[[entries]]
name = "impl Not"
keys = ["impl", "not", "bang", "invert", "unary", "operator", "flags", "bool"]
doc = "Overload unary ! for the type."
snippet = '''
impl std::ops::Not for ${1:Flags} {
    type Output = Self;

    fn not(self) -> Self {
        Self(!self.0)$0
    }
}'''

