[[entries]]
name = "bit flags newtype with derives"
keys = ["flags", "newtype", "bits", "derive", "copy", "eq", "mask", "set"]
doc = "Newtype over an integer that the bitwise operator impls build on."
snippet = '''
#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
pub struct ${1:Flags}(pub ${2:u32});

impl ${1:Flags} {
    pub const ${3:READ}: Self = Self(1);
    pub const ${4:WRITE}: Self = Self(2);

    pub fn contains(self, other: Self) -> bool {
        self.0 & other.0 == other.0
    }$0
}'''

