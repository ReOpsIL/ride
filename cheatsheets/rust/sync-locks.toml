title = "Mutex, RwLock and once-init"
contexts = ["statement", "expression"]

[[entries]]
name = "Mutex::new"
keys = ["mutex", "new", "lock", "create", "protect", "wrap", "shared"]
doc = "Wrap a value in a mutex so one thread at a time can access it."
snippet = '''
let ${1:m} = std::sync::Mutex::new(${2:0});$0'''

[[entries]]
name = "Arc<Mutex> shared state"
keys = ["arc", "mutex", "shared", "state", "counter", "thread", "clone"]
doc = "Create state that several threads can lock and mutate."
snippet = '''
let ${1:state} = Arc::new(Mutex::new(${2:0}));$0'''

[[entries]]
name = "use std::sync"
keys = ["use", "sync", "arc", "mutex", "import", "rwlock"]
doc = "Import the common sync types."
snippet = '''
use std::sync::{Arc, Mutex${1:, RwLock}};$0'''

[[entries]]
name = "lock mutex"
keys = ["lock", "mutex", "guard", "unwrap", "acquire", "mutate"]
doc = "Acquire a mutex, getting a guard that unlocks when dropped."
snippet = '''
let mut ${1:guard} = ${2:state}.lock().unwrap();
*${1:guard} ${3:+= 1};$0'''

[[entries]]
name = "lock in a scope"
keys = ["lock", "scope", "guard", "drop", "release", "block", "short"]
doc = "Hold the lock only inside a block so it is released early."
snippet = '''
{
    let mut ${1:guard} = ${2:state}.lock().unwrap();
    $0
}'''

[[entries]]
name = "lock inline expression"
keys = ["lock", "inline", "expression", "temporary", "read", "one", "line"]
doc = "Lock, use and release in one expression."
snippet = '''
${1:state}.lock().unwrap().${2:push}(${3:value});$0'''

[[entries]]
name = "drop guard explicitly"
keys = ["drop", "guard", "unlock", "release", "early", "mutex"]
doc = "Release a lock before the end of scope."
snippet = '''
drop(${1:guard});$0'''

[[entries]]
name = "try_lock"
keys = ["try_lock", "mutex", "nonblocking", "busy", "would_block", "poll"]
doc = "Take the lock only if it is free right now."
snippet = '''
if let Ok(mut ${1:guard}) = ${2:state}.try_lock() {
    $0
}'''

[[entries]]
name = "poisoned lock recovery"
keys = ["poison", "poisoned", "lock", "unwrap_or_else", "into_inner", "panic", "recover"]
doc = "Keep using a mutex after another thread panicked while holding it."
snippet = '''
let mut ${1:guard} = ${2:state}.lock().unwrap_or_else(|e| e.into_inner());$0'''

[[entries]]
name = "Mutex into_inner"
keys = ["into_inner", "mutex", "unwrap", "consume", "take", "value", "arc"]
doc = "Take the value back out of a mutex once no other owner remains."
snippet = '''
let ${1:value} = Arc::try_unwrap(${2:state}).unwrap().into_inner().unwrap();$0'''

[[entries]]
name = "Mutex get_mut"
keys = ["get_mut", "mutex", "exclusive", "no", "lock", "mut"]
doc = "Access the value without locking when you hold the mutex mutably."
snippet = '''
*${1:m}.get_mut().unwrap() = ${2:value};$0'''

[[entries]]
name = "RwLock::new"
keys = ["rwlock", "new", "readers", "writer", "create", "shared"]
doc = "Wrap a value in a lock allowing many readers or one writer."
snippet = '''
let ${1:lock} = std::sync::RwLock::new(${2:value});$0'''

[[entries]]
name = "RwLock read"
keys = ["rwlock", "read", "lock", "guard", "shared", "readers"]
doc = "Acquire a shared read lock."
snippet = '''
let ${1:guard} = ${2:lock}.read().unwrap();$0'''

[[entries]]
name = "RwLock write"
keys = ["rwlock", "write", "lock", "guard", "exclusive", "mutate"]
doc = "Acquire an exclusive write lock."
snippet = '''
let mut ${1:guard} = ${2:lock}.write().unwrap();
*${1:guard} = ${3:value};$0'''

[[entries]]
name = "Mutex field in struct"
keys = ["mutex", "field", "struct", "interior", "mutability", "shared", "self"]
doc = "Store a mutex inside a struct so &self methods can mutate it."
snippet = '''
struct ${1:Name} {
    ${2:inner}: std::sync::Mutex<${3:Vec<u32>}>,
}$0'''

[[entries]]
name = "Condvar pair"
keys = ["condvar", "condition", "variable", "new", "pair", "mutex", "arc"]
doc = "Create a mutex and condition variable shared through an Arc."
snippet = '''
let ${1:pair} = Arc::new((Mutex::new(${2:false}), std::sync::Condvar::new()));$0'''

[[entries]]
name = "Condvar wait"
keys = ["condvar", "condition", "variable", "wait", "notify", "block", "until"]
doc = "Block until another thread signals a condition guarded by a mutex."
snippet = '''
let (${1:lock}, ${2:cvar}) = &*${3:pair};
let mut ${4:ready} = ${1:lock}.lock().unwrap();
while !*${4:ready} {
    ${4:ready} = ${2:cvar}.wait(${4:ready}).unwrap();
}$0'''

[[entries]]
name = "Condvar wait_while"
keys = ["condvar", "wait_while", "condition", "predicate", "block", "until"]
doc = "Wait until a predicate on the guarded value becomes false."
snippet = '''
let ${1:guard} = ${2:cvar}.wait_while(${3:lock}.lock().unwrap(), |${4:v}| ${5:!*v}).unwrap();$0'''

[[entries]]
name = "Condvar notify"
keys = ["condvar", "notify", "one", "all", "signal", "wake"]
doc = "Set the condition and wake waiting threads."
snippet = '''
*${1:lock}.lock().unwrap() = ${2:true};
${3:cvar}.notify_${4:one}();$0'''

[[entries]]
name = "Barrier"
keys = ["barrier", "sync", "rendezvous", "wait", "threads", "meet"]
doc = "Make n threads wait for each other at a point."
snippet = '''
let ${1:barrier} = Arc::new(std::sync::Barrier::new(${2:n}));
${1:barrier}.wait();$0'''

[[entries]]
name = "Once"
keys = ["once", "call_once", "init", "setup", "single", "global"]
doc = "Run initialization code exactly once across threads."
snippet = '''
static ${1:INIT}: std::sync::Once = std::sync::Once::new();
${1:INIT}.call_once(|| {
    $0
});'''

[[entries]]
name = "OnceLock"
keys = ["oncelock", "once", "lazy", "static", "init", "global", "config"]
doc = "Global initialized exactly once on first access."
snippet = '''
static ${1:CONFIG}: std::sync::OnceLock<${2:String}> = std::sync::OnceLock::new();
${1:CONFIG}.get_or_init(|| ${3:value})$0'''

[[entries]]
name = "OnceLock set / get"
keys = ["oncelock", "set", "get", "init", "explicit", "global"]
doc = "Initialize a OnceLock explicitly and read it later."
snippet = '''
${1:CONFIG}.set(${2:value}).${3:ok()};
let ${4:v} = ${1:CONFIG}.get().expect("${5:not initialized}");$0'''

[[entries]]
name = "LazyLock"
keys = ["lazylock", "lazy", "static", "init", "global", "regex", "hashmap"]
doc = "Global initialized lazily by a closure the first time it is dereferenced."
snippet = '''
static ${1:NAME}: std::sync::LazyLock<${2:Type}> = std::sync::LazyLock::new(|| ${3:value});$0'''

[[entries]]
name = "OnceCell single-threaded"
keys = ["oncecell", "cell", "lazy", "once", "local", "cache"]
doc = "Lazily initialize a value in a non-thread-safe cell."
snippet = '''
let ${1:cell}: std::cell::OnceCell<${2:T}> = std::cell::OnceCell::new();
let ${3:v} = ${1:cell}.get_or_init(|| ${4:value});$0'''
