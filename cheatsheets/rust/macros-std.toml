title = "More std macros"
contexts = ["statement", "expression"]

[[entries]]
name = "debug_assert_eq! / debug_assert_ne!"
keys = ["debug", "assert", "eq", "ne", "equal", "release", "check"]
doc = "Compare two values only in debug builds."
snippet = '''
debug_assert_eq!(${1:actual}, ${2:expected});$0'''

[[entries]]
name = "assert! with message args"
keys = ["assert", "message", "format", "args", "check", "explain"]
doc = "Assert with a formatted message that names the offending values."
snippet = '''
assert!(${1:condition}, "${2:expected {expected\}, got {actual\}}");$0'''

[[entries]]
name = "assert!(matches!)"
keys = ["assert", "matches", "pattern", "variant", "test", "check"]
doc = "Assert that a value matches a pattern, for enums without PartialEq."
snippet = '''
assert!(matches!(${1:value}, ${2:Pattern}));$0'''

[[entries]]
name = "panic! with format"
keys = ["panic", "format", "message", "args", "crash", "abort"]
doc = "Panic with a formatted message capturing variables."
snippet = '''
panic!("${1:unexpected value {value\}}");$0'''

[[entries]]
name = "unreachable! with format"
keys = ["unreachable", "format", "message", "impossible", "panic"]
doc = "Panic with a formatted message on a path that should never run."
snippet = '''
unreachable!("${1:invalid state {state:?\}}")$0'''

[[entries]]
name = "matches! with guard"
keys = ["matches", "guard", "if", "pattern", "bool", "condition"]
doc = "Test a pattern together with a guard condition."
snippet = '''
matches!(${1:value}, ${2:Some(n)} if ${3:n > 0})$0'''

[[entries]]
name = "dbg! several values"
keys = ["dbg", "debug", "print", "several", "multiple", "inspect"]
doc = "Print several expressions with their values to stderr and get them back as a tuple."
snippet = '''
dbg!(${1:a}, ${2:b});$0'''

[[entries]]
name = "vec! typed empty"
keys = ["vec", "empty", "typed", "new", "list", "vector"]
doc = "Create an empty vector with an explicit element type."
snippet = '''
let ${1:items}: Vec<${2:i32}> = vec![];$0'''

[[entries]]
name = "cfg! branch"
keys = ["cfg", "if", "platform", "target", "runtime", "branch", "windows"]
doc = "Branch at runtime on a compile-time configuration flag."
snippet = '''
if cfg!(${1:target_os = "windows"}) {
    $0
} else {
    ${2:}
}'''

[[entries]]
name = "write! to String"
keys = ["write", "string", "fmt", "buffer", "append", "push"]
doc = "Append formatted text to a String, which needs the fmt::Write trait in scope."
snippet = '''
use std::fmt::Write;
write!(${1:buf}, "${2:{value\}}").${3:unwrap()};$0'''

[[entries]]
name = "print! then flush"
keys = ["print", "flush", "prompt", "stdout", "input", "no", "newline"]
doc = "Print a prompt without a newline and flush so it appears before reading input."
snippet = '''
print!("${1:> }");
std::io::Write::flush(&mut std::io::stdout())?;$0'''

[[entries]]
name = "format_args!"
keys = ["format_args", "arguments", "fmt", "lazy", "log", "forward"]
doc = "Build formatting arguments without allocating, to forward to a writer or logger."
snippet = '''
format_args!("${1:{value\}}")$0'''

[[entries]]
name = "compile_error!"
keys = ["compile_error", "error", "build", "fail", "cfg", "feature", "macro"]
doc = "Fail the build with a message, typically under a cfg for unsupported configurations."
snippet = '''
compile_error!("${1:unsupported configuration}");$0'''

[[entries]]
name = "thread_local!"
keys = ["thread_local", "thread", "local", "static", "cell", "refcell", "per"]
doc = "Declare a per-thread static accessed through with."
snippet = '''
thread_local! {
    static ${1:COUNTER}: std::cell::${2:Cell<u32>} = ${2:Cell<u32>}::new(${3:0});
}
${1:COUNTER}.with(|${4:c}| $0);'''

[[entries]]
name = "include!"
keys = ["include", "file", "generated", "build", "code", "embed"]
doc = "Paste a Rust source file in place, typically one generated by build.rs."
snippet = '''
include!(concat!(env!("OUT_DIR"), "/${1:generated.rs}"));$0'''

[[entries]]
name = "std::hint::black_box"
keys = ["black_box", "hint", "benchmark", "optimize", "prevent"]
doc = "Keep a value opaque to the optimizer in benchmarks."
snippet = '''
std::hint::black_box(${1:value})$0'''

[[entries]]
name = "todo! with message"
keys = ["todo", "message", "stub", "later", "reason"]
doc = "Placeholder panic with a note about what is missing."
snippet = '''
todo!("${1:handle this case}")$0'''

[[entries]]
name = "assert_eq! with message"
keys = ["assert", "eq", "message", "format", "test", "explain"]
doc = "Compare two values and print a formatted message when they differ."
snippet = '''
assert_eq!(${1:actual}, ${2:expected}, "${3:case {name\}}");$0'''
