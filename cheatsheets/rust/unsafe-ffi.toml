title = "Unsafe and raw pointers"
contexts = ["statement", "expression", "item"]

[[entries]]
name = "unsafe block"
keys = ["unsafe", "block", "raw", "ffi", "safety", "call"]
doc = "Enter unsafe code with a comment explaining why it is sound."
snippet = '''
// SAFETY: ${1:why this is sound}
unsafe {
    $0
}'''

[[entries]]
name = "unsafe fn"
keys = ["unsafe", "fn", "function", "contract", "invariant", "caller"]
doc = "Define a function whose caller must uphold documented invariants."
snippet = '''
/// # Safety
/// ${1:invariant}
pub unsafe fn ${2:name}(${3:args}) -> ${4:ReturnType} {
    $0
}'''

[[entries]]
name = "unsafe trait / impl"
keys = ["unsafe", "trait", "impl", "marker", "contract", "implement"]
doc = "Declare a trait whose implementations promise an invariant, and implement it."
snippet = '''
unsafe trait ${1:Name} {}
unsafe impl ${1:Name} for ${2:Type} {}$0'''

[[entries]]
name = "unsafe impl Send / Sync"
keys = ["unsafe", "impl", "send", "sync", "thread", "pointer", "marker"]
doc = "Assert a type holding raw pointers is safe to move or share across threads."
snippet = '''
unsafe impl Send for ${1:Type} {}
unsafe impl Sync for ${1:Type} {}$0'''

[[entries]]
name = "raw pointer from ref"
keys = ["raw", "pointer", "ptr", "const", "mut", "cast", "reference", "create"]
doc = "Create a raw pointer from a reference, which is safe."
snippet = '''
let ${1:p}: *${2:const} ${3:T} = &${4:value};$0'''

[[entries]]
name = "as *const cast"
keys = ["as", "cast", "raw", "pointer", "const", "mut", "ptr"]
doc = "Cast a reference or pointer to a raw pointer type with as."
snippet = '''
${1:value_ref} as *${2:const} ${3:T}$0'''

[[entries]]
name = "&raw const / mut"
keys = ["raw", "addr_of", "pointer", "field", "packed", "place", "address"]
doc = "Take a raw pointer to a place without creating an intermediate reference."
snippet = '''
&raw ${1:const} ${2:place}$0'''

[[entries]]
name = "deref raw pointer"
keys = ["deref", "raw", "pointer", "unsafe", "read", "star", "value"]
doc = "Read through a raw pointer, which requires unsafe."
snippet = '''
unsafe { *${1:ptr} }$0'''

[[entries]]
name = "write through raw pointer"
keys = ["write", "raw", "pointer", "assign", "mut", "unsafe", "star"]
doc = "Assign through a mutable raw pointer."
snippet = '''
unsafe { *${1:ptr} = ${2:value}; }$0'''

[[entries]]
name = "ptr::null / null_mut"
keys = ["null", "ptr", "pointer", "null_mut", "create", "empty"]
doc = "Create a null raw pointer."
snippet = '''
std::ptr::null${1:_mut}::<${2:T}>()$0'''

[[entries]]
name = "is_null check"
keys = ["is_null", "null", "check", "pointer", "if", "guard"]
doc = "Bail out when a pointer from C is null."
snippet = '''
if ${1:ptr}.is_null() {
    return ${2:None};
}$0'''

[[entries]]
name = "ptr as_ref / as_mut"
keys = ["as_ref", "as_mut", "pointer", "option", "reference", "null", "convert"]
doc = "Turn a raw pointer into an Option of a reference, None when null."
snippet = '''
let ${1:r} = unsafe { ${2:ptr}.as_${3:ref}() };$0'''

[[entries]]
name = "ptr add / offset / sub"
keys = ["ptr", "add", "offset", "sub", "arithmetic", "pointer", "index", "element"]
doc = "Advance a raw pointer by n elements."
snippet = '''
unsafe { ${1:ptr}.${2:add}(${3:n}) }$0'''

[[entries]]
name = "ptr::read / write"
keys = ["ptr", "read", "write", "unaligned", "move", "bitwise", "copy"]
doc = "Read or write a value through a raw pointer without dropping."
snippet = '''
unsafe { std::ptr::${1:write}(${2:ptr}${3:, value}) }$0'''

[[entries]]
name = "ptr::copy / copy_nonoverlapping"
keys = ["ptr", "copy", "copy_nonoverlapping", "memcpy", "memmove", "bytes", "count"]
doc = "Copy n elements between raw pointers like memcpy or memmove."
snippet = '''
unsafe { std::ptr::copy${1:_nonoverlapping}(${2:src}, ${3:dst}, ${4:count}) }$0'''

[[entries]]
name = "ptr::write_bytes"
keys = ["write_bytes", "memset", "zero", "fill", "ptr", "bytes"]
doc = "Fill memory with a byte value like memset."
snippet = '''
unsafe { std::ptr::write_bytes(${1:ptr}, ${2:0}, ${3:count}) }$0'''

[[entries]]
name = "ptr::drop_in_place"
keys = ["drop_in_place", "drop", "destructor", "ptr", "manual", "run"]
doc = "Run a value's destructor in place through a pointer."
snippet = '''
unsafe { std::ptr::drop_in_place(${1:ptr}) }$0'''

[[entries]]
name = "ptr cast"
keys = ["cast", "ptr", "pointer", "type", "u8", "void", "convert"]
doc = "Change the pointee type of a raw pointer."
snippet = '''
${1:ptr}.cast::<${2:u8}>()$0'''

[[entries]]
name = "NonNull"
keys = ["nonnull", "pointer", "non", "null", "new", "dangling", "covariant"]
doc = "A raw pointer type known to be non-null, used inside data structures."
snippet = '''
let ${1:p} = std::ptr::NonNull::new(${2:ptr}).${3:expect("null")};$0'''

[[entries]]
name = "slice::from_raw_parts"
keys = ["slice", "raw", "parts", "pointer", "len", "ffi", "buffer"]
doc = "Build a slice from a pointer and a length."
snippet = '''
unsafe { std::slice::from_raw_parts${1:_mut}(${2:ptr}, ${3:len}) }$0'''

[[entries]]
name = "as_ptr / as_mut_ptr"
keys = ["as_ptr", "as_mut_ptr", "slice", "vec", "pointer", "buffer", "ffi"]
doc = "Get a raw pointer to the first element of a slice or Vec."
snippet = '''
${1:buf}.as_${2:mut_}ptr()$0'''

[[entries]]
name = "get_unchecked"
keys = ["get_unchecked", "index", "no", "bounds", "check", "slice", "fast"]
doc = "Index a slice without bounds checking."
snippet = '''
unsafe { ${1:slice}.get_unchecked${2:_mut}(${3:i}) }$0'''

[[entries]]
name = "Box into_raw / from_raw"
keys = ["box", "into_raw", "from_raw", "leak", "ffi", "handle", "heap"]
doc = "Hand a heap object to C as a pointer and reclaim it later."
snippet = '''
let ${1:ptr} = Box::into_raw(Box::new(${2:value}));
let ${3:boxed} = unsafe { Box::from_raw(${1:ptr}) };$0'''

[[entries]]
name = "Vec::from_raw_parts"
keys = ["vec", "from_raw_parts", "pointer", "len", "capacity", "reclaim", "into_raw_parts"]
doc = "Rebuild a Vec from a pointer, length and capacity it was split into."
snippet = '''
let ${1:v} = unsafe { Vec::from_raw_parts(${2:ptr}, ${3:len}, ${4:cap}) };$0'''
