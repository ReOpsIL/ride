title = "Format arguments and Display"
contexts = []

[[entries]]
name = "named {name}"
keys = ["named", "inline", "capture", "format", "variable", "interpolate"]
doc = "Capture a variable from scope by name inside the braces."
snippet = '''
{${1:name}}$0'''

[[entries]]
name = "named argument"
keys = ["named", "argument", "format", "explicit", "keyword", "label"]
doc = "Pass a named argument after the template and refer to it by name."
snippet = '''
format!("${1:{name\}}", ${2:name} = ${3:expr})$0'''

[[entries]]
name = "positional {0}"
keys = ["positional", "index", "format", "argument", "reuse", "number"]
doc = "Refer to an argument by position, reusable in the template."
snippet = '''
format!("{0} ${1:{1\} {0\}}", ${2:a}, ${3:b})$0'''

[[entries]]
name = "sequential {}"
keys = ["sequential", "arguments", "format", "order", "placeholders", "list"]
doc = "Fill placeholders from the arguments in order."
snippet = '''
format!("${1:{\} {\}}", ${2:a}, ${3:b})$0'''

[[entries]]
name = "field expression {x.y}"
keys = ["field", "expression", "format", "argument", "inline", "method", "call"]
doc = "Only plain identifiers can be captured inline, so pass expressions as arguments."
snippet = '''
format!("{}", ${1:point.x})$0'''

[[entries]]
name = "dynamic width {:>width$}"
keys = ["dynamic", "width", "variable", "runtime", "format", "pad", "argument"]
doc = "Take the width from a named argument or captured variable."
snippet = '''
{${1:value}:>${2:width}$}$0'''

[[entries]]
name = "dynamic precision {:.prec$}"
keys = ["dynamic", "precision", "variable", "runtime", "format", "decimals", "argument"]
doc = "Take the precision from a named argument or captured variable."
snippet = '''
{${1:value}:.${2:prec}$}$0'''

[[entries]]
name = "positional width {:>1$}"
keys = ["positional", "width", "index", "argument", "format", "pad"]
doc = "Take the width from the argument at a position."
snippet = '''
format!("{:>1$}", ${1:value}, ${2:width})$0'''

[[entries]]
name = "precision from next arg {:.*}"
keys = ["precision", "star", "next", "argument", "format", "decimals"]
doc = "Take the precision from the next argument, then the value."
snippet = '''
format!("{:.*}", ${1:decimals}, ${2:value})$0'''

[[entries]]
name = "dynamic width and precision"
keys = ["dynamic", "width", "precision", "table", "column", "format", "both"]
doc = "Combine a runtime width and precision for aligned tables."
snippet = '''
{${1:value}:>${2:width}$.${3:prec}$}$0'''

[[entries]]
name = "table row"
keys = ["table", "row", "columns", "align", "println", "report", "aligned"]
doc = "Print an aligned row with fixed column widths."
snippet = '''
println!("{:<${1:12}} {:>${2:8}} {:>${3:8}.2}", ${4:name}, ${5:count}, ${6:total});$0'''

[[entries]]
name = "write! to String"
keys = ["write", "string", "fmt", "append", "format", "builder", "buffer"]
doc = "Append formatted text to a String with the fmt::Write trait in scope."
snippet = '''
use std::fmt::Write as _;
write!(${1:out}, "${2:{value\}}")?;$0'''

[[entries]]
name = "writeln! to String"
keys = ["writeln", "string", "line", "append", "fmt", "builder", "newline"]
doc = "Append a formatted line to a String."
snippet = '''
writeln!(${1:out}, "${2:{value\}}")?;$0'''

[[entries]]
name = "format_args!"
keys = ["format_args", "arguments", "fmt", "zero", "copy", "no", "alloc"]
doc = "Build formatting Arguments without allocating, to pass to a writer."
snippet = '''
format_args!("${1:{value\}}")$0'''

[[entries]]
name = "impl Display"
keys = ["display", "impl", "fmt", "to_string", "print", "custom", "trait"]
doc = "Implement Display so a type can be printed with {} and to_string."
snippet = '''
impl std::fmt::Display for ${1:Type} {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "${2:{\}}", ${3:self.value})$0
    }
}'''

[[entries]]
name = "Display with padding (f.pad)"
keys = ["display", "pad", "width", "align", "custom", "fmt", "respect", "formatter"]
doc = "Honor width and alignment in a custom Display by handing the text to f.pad."
snippet = '''
impl std::fmt::Display for ${1:Type} {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        f.pad(${2:&self.name})$0
    }
}'''

[[entries]]
name = "Display delegating to inner"
keys = ["display", "delegate", "inner", "fmt", "forward", "wrapper", "newtype"]
doc = "Forward all format flags to an inner value's Display."
snippet = '''
impl std::fmt::Display for ${1:Type} {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        std::fmt::Display::fmt(&self.${2:0}, f)$0
    }
}'''

[[entries]]
name = "alternate flag f.alternate()"
keys = ["alternate", "flag", "hash", "fmt", "formatter", "width", "precision", "query"]
doc = "Read the # flag, width or precision requested by the caller inside fmt."
snippet = '''
if f.alternate() {
    $0
}'''

[[entries]]
name = "Debug for str shows quotes"
keys = ["debug", "str", "quotes", "string", "escape", "format", "print"]
doc = "Debug-format a string to show it quoted and escaped."
snippet = '''
println!("{:?}", ${1:text});$0'''

[[entries]]
name = "print Vec"
keys = ["print", "vec", "debug", "list", "array", "slice", "format", "println"]
doc = "Print a collection with Debug, since Vec has no Display."
snippet = '''
println!("{${1:items}:?}");$0'''

[[entries]]
name = "print Option / Result"
keys = ["print", "option", "result", "debug", "some", "none", "format"]
doc = "Print an Option or Result with Debug."
snippet = '''
println!("{${1:value}:?}");$0'''

[[entries]]
name = "join with separator"
keys = ["join", "separator", "print", "list", "comma", "strings", "format", "vec"]
doc = "Print a list of values separated by commas."
snippet = '''
${1:items}.iter().map(|${2:x}| ${2:x}.to_string()).collect::<Vec<_>>().join("${3:, }")$0'''
