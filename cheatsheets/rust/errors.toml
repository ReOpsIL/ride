title = "Error handling"
contexts = ["statement", "expression"]

[[entries]]
name = "? operator"
keys = ["question", "try", "propagate", "unwrap", "error", "return", "early"]
doc = "Return early with the error or None, converting the error type with From."
snippet = '''
${1:expr}?$0'''

[[entries]]
name = "let ? bind"
keys = ["let", "question", "try", "propagate", "bind", "fallible", "call"]
doc = "Bind the success value or return the error to the caller."
snippet = '''
let ${1:value} = ${2:fallible()}?;$0'''

[[entries]]
name = "? with From conversion"
keys = ["question", "from", "convert", "into", "error", "type", "parse", "propagate"]
doc = "The ? operator calls From to convert a library error into the function's error type."
snippet = '''
let ${1:n}: ${2:i32} = ${3:text}.parse()?;$0'''

[[entries]]
name = "? on Option"
keys = ["question", "option", "none", "return", "early", "propagate", "some"]
doc = "Return None early from a function that itself returns Option."
snippet = '''
let ${1:value} = ${2:map.get(&key)}?;$0'''

[[entries]]
name = "Ok"
keys = ["ok", "result", "success", "return", "wrap", "value"]
doc = "Wrap a success value in Result."
snippet = '''
Ok(${1:value})$0'''

[[entries]]
name = "Err"
keys = ["err", "result", "error", "return", "fail", "bail", "early"]
doc = "Return an error value from a Result-returning function."
snippet = '''
return Err(${1:error}.into());$0'''

[[entries]]
name = "early return on condition"
keys = ["early", "return", "guard", "validate", "check", "if", "err", "bail"]
doc = "Validate input up front and return an error before doing work."
snippet = '''
if ${1:input.is_empty()} {
    return Err(${2:Error::Empty});
}$0'''

[[entries]]
name = "Err with String"
keys = ["err", "string", "message", "result", "text", "format", "return"]
doc = "Return a message as the error of a Result<T, String>."
snippet = '''
return Err(format!("${1:invalid value {value\}}"));$0'''

[[entries]]
name = "match Result"
keys = ["result", "ok", "err", "handle", "match", "both", "cases"]
doc = "Handle both outcomes of a Result explicitly."
snippet = '''
match ${1:result} {
    Ok(${2:value}) => $0,
    Err(${3:e}) => ${4:eprintln!("error: {e\}")},
}'''

[[entries]]
name = "if let Ok"
keys = ["if", "let", "ok", "result", "success", "only"]
doc = "Run a block only when a Result is Ok."
snippet = '''
if let Ok(${1:value}) = ${2:result} {
    $0
}'''

[[entries]]
name = "if let Err"
keys = ["if", "let", "err", "result", "log", "print", "failure"]
doc = "Inspect the error of a Result without stopping."
snippet = '''
if let Err(${1:e}) = ${2:result} {
    ${3:eprintln!("{e\}")};$0
}'''

[[entries]]
name = "let else Ok"
keys = ["let", "else", "ok", "result", "return", "early", "continue", "diverge"]
doc = "Bind the Ok value or leave with a diverging else block."
snippet = '''
let Ok(${1:value}) = ${2:result} else {
    ${3:return};
};$0'''

[[entries]]
name = "unwrap_or"
keys = ["unwrap", "or", "default", "fallback", "option", "result", "value"]
doc = "Take the contained value or an eagerly evaluated fallback."
snippet = '''
.unwrap_or(${1:default})$0'''

[[entries]]
name = "unwrap_or_else"
keys = ["unwrap", "or", "else", "fallback", "lazy", "closure", "compute"]
doc = "Take the contained value or compute a fallback from a closure."
snippet = '''
.unwrap_or_else(|${1:e}| ${2:expr})$0'''

[[entries]]
name = "unwrap_or_else exit"
keys = ["unwrap", "exit", "eprintln", "fatal", "process", "cli", "die", "abort"]
doc = "Print the error and exit the process on failure, common in command-line tools."
snippet = '''
.unwrap_or_else(|e| {
    eprintln!("${1:error}: {e}");
    std::process::exit(1);
})$0'''

[[entries]]
name = "expect"
keys = ["expect", "unwrap", "panic", "message", "must", "reason"]
doc = "Take the contained value or panic with a message explaining why it should exist."
snippet = '''
.expect("${1:reason it cannot fail}")$0'''

[[entries]]
name = "unwrap"
keys = ["unwrap", "panic", "force", "get", "value", "prototype"]
doc = "Take the contained value or panic, acceptable in tests and prototypes."
snippet = '''
.unwrap()$0'''

[[entries]]
name = "map_err"
keys = ["map", "err", "error", "convert", "wrap", "change", "type"]
doc = "Convert the error variant with a closure, leaving Ok untouched."
snippet = '''
.map_err(|${1:e}| ${2:MyError::Io(e)})?$0'''

[[entries]]
name = "map_err to_string"
keys = ["map", "err", "to_string", "string", "error", "message", "convert"]
doc = "Turn any error into its message, for Result<T, String> functions."
snippet = '''
.map_err(|e| e.to_string())?$0'''

[[entries]]
name = "with context (map_err format)"
keys = ["context", "map", "err", "format", "wrap", "message", "anyhow", "describe"]
doc = "Attach a message to an error while converting it to a string error."
snippet = '''
.map_err(|e| format!("${1:failed to read {path\}}: {e}"))?$0'''

[[entries]]
name = "Box<dyn Error> from string"
keys = ["box", "error", "string", "into", "from", "message", "dyn"]
doc = "Build a boxed error from a message using its From impl for strings."
snippet = '''
return Err(format!("${1:message}").into());$0'''

[[entries]]
name = "ok_or"
keys = ["ok", "or", "option", "result", "convert", "none", "error"]
doc = "Turn an Option into a Result with a given error for None."
snippet = '''
.ok_or(${1:error})?$0'''

[[entries]]
name = "ok_or_else"
keys = ["ok", "or", "else", "option", "result", "lazy", "closure"]
doc = "Turn an Option into a Result, building the error lazily."
snippet = '''
.ok_or_else(|| ${1:error})?$0'''

[[entries]]
name = "and_then"
keys = ["and", "then", "chain", "flatmap", "bind", "next", "step"]
doc = "Chain another fallible step on the success value."
snippet = '''
.and_then(|${1:value}| ${2:next(value)})$0'''

[[entries]]
name = "or_else"
keys = ["or", "else", "fallback", "retry", "recover", "alternative", "error"]
doc = "Recover from an error or None by trying another fallible computation."
snippet = '''
.or_else(|${1:e}| ${2:fallback()})$0'''

[[entries]]
name = "print error chain"
keys = ["error", "chain", "source", "cause", "print", "report", "while", "loop"]
doc = "Print an error followed by each underlying cause."
snippet = '''
eprintln!("error: {${1:e}}");
let mut ${2:source} = ${1:e}.source();
while let Some(${3:cause}) = ${2:source} {
    eprintln!("  caused by: {${3:cause}}");
    ${2:source} = ${3:cause}.source();
}$0'''

[[entries]]
name = "downcast_ref error"
keys = ["downcast", "error", "dyn", "concrete", "type", "check", "io", "kind"]
doc = "Test whether a boxed error is a specific concrete type."
snippet = '''
if let Some(${1:io}) = ${2:e}.downcast_ref::<${3:std::io::Error}>() {
    $0
}'''

[[entries]]
name = "catch_unwind"
keys = ["catch", "unwind", "panic", "recover", "try", "catch", "exception"]
doc = "Run a closure and turn a panic inside it into an Err."
snippet = '''
let ${1:outcome} = std::panic::catch_unwind(|| {
    $0
});'''
