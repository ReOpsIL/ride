title = "Structs"
contexts = ["item"]

[[entries]]
name = "struct"
keys = ["struct", "record", "class", "type", "data", "define", "declare"]
doc = "Define a struct with named fields."
snippet = '''
struct ${1:Name} {
    ${2:field}: ${3:Type},$0
}'''

[[entries]]
name = "pub struct"
keys = ["pub", "struct", "public", "export", "visible"]
doc = "Define a public struct with public named fields."
snippet = '''
pub struct ${1:Name} {
    pub ${2:field}: ${3:Type},$0
}'''

[[entries]]
name = "pub(crate) struct"
keys = ["pub", "crate", "struct", "internal", "visibility"]
doc = "Define a struct visible everywhere inside the crate but not to users of the crate."
snippet = '''
pub(crate) struct ${1:Name} {
    pub(crate) ${2:field}: ${3:Type},$0
}'''

[[entries]]
name = "struct mixed visibility"
keys = ["struct", "pub", "private", "crate", "fields", "visibility", "encapsulate"]
doc = "Define a public struct mixing public, crate-visible and private fields."
snippet = '''
pub struct ${1:Name} {
    pub ${2:id}: ${3:u32},
    pub(crate) ${4:internal}: ${5:String},
    ${6:hidden}: ${7:Vec<u8>},$0
}'''

[[entries]]
name = "struct with collection fields"
keys = ["struct", "vec", "hashmap", "option", "fields", "collection", "nested"]
doc = "Define a struct whose fields hold owned collections and optional values."
snippet = '''
struct ${1:Name} {
    ${2:items}: Vec<${3:Item}>,
    ${4:index}: std::collections::HashMap<${5:String}, ${6:usize}>,
    ${7:parent}: Option<${8:Box<Self>}>,$0
}'''

[[entries]]
name = "struct with impl"
keys = ["struct", "impl", "new", "constructor", "method", "class", "object"]
doc = "Define a struct together with a constructor and a method in its impl block."
snippet = '''
struct ${1:Name} {
    ${2:field}: ${3:Type},
}

impl ${1:Name} {
    fn new(${2:field}: ${3:Type}) -> Self {
        Self { ${2:field} }
    }

    fn ${4:method}(&self) -> &${3:Type} {
        &self.${2:field}$0
    }
}'''

[[entries]]
name = "tuple struct"
keys = ["struct", "tuple", "newtype", "wrapper", "positional", "unnamed"]
doc = "Define a struct with positional fields, the newtype pattern when it has one."
snippet = '''
struct ${1:Name}(${2:pub }${3:Type});$0'''

[[entries]]
name = "unit struct"
keys = ["struct", "unit", "marker", "zst", "empty", "fieldless"]
doc = "Define a zero-sized struct with no fields."
snippet = '''
struct ${1:Name};$0'''

[[entries]]
name = "generic struct"
keys = ["struct", "generic", "template", "t", "parameter", "bound"]
doc = "Define a struct parameterized over a type."
snippet = '''
struct ${1:Name}<T${2:: Clone}> {
    ${3:value}: T,$0
}'''

[[entries]]
name = "struct two type parameters"
keys = ["struct", "generic", "pair", "key", "value", "k", "v", "multiple"]
doc = "Define a struct parameterized over two independent types."
snippet = '''
struct ${1:Pair}<${2:K}, ${3:V}> {
    ${4:key}: ${2:K},
    ${5:value}: ${3:V},$0
}'''

[[entries]]
name = "struct const generic"
keys = ["struct", "const", "generic", "n", "array", "size", "fixed"]
doc = "Define a struct whose array length is a compile-time parameter."
snippet = '''
struct ${1:Buffer}<T, const ${2:N}: usize> {
    ${3:data}: [T; ${2:N}],$0
}'''

[[entries]]
name = "struct with lifetime"
keys = ["struct", "lifetime", "borrow", "reference", "str", "view"]
doc = "Define a struct that holds a reference and so carries a lifetime parameter."
snippet = '''
struct ${1:Name}<'a> {
    ${2:text}: &'a ${3:str},$0
}'''

[[entries]]
name = "struct lifetime and generic"
keys = ["struct", "lifetime", "generic", "borrow", "slice", "t"]
doc = "Define a struct that borrows a slice of a generic element type."
snippet = '''
struct ${1:Name}<'a, T> {
    ${2:items}: &'a [T],$0
}'''

[[entries]]
name = "derive struct"
keys = ["struct", "derive", "debug", "clone", "eq", "hash", "default"]
doc = "Define a struct with commonly derived traits."
snippet = '''
#[derive(Debug, Clone, PartialEq${2:, Eq, Hash})]
pub struct ${1:Name} {
    $0
}'''
