title = "Strings: split, search and trim"
contexts = ["statement", "expression"]

[[entries]]
name = "split"
keys = ["split", "separator", "tokens", "string", "delimiter", "comma", "parts"]
doc = "Iterate over substrings separated by a char, str or closure pattern."
snippet = '''
${1:text}.split(${2:','})$0'''

[[entries]]
name = "split collect"
keys = ["split", "collect", "vec", "parts", "fields", "tokens", "list"]
doc = "Split a string and gather the parts into a vector."
snippet = '''
let ${1:parts}: Vec<&str> = ${2:text}.split(${3:','}).collect();$0'''

[[entries]]
name = "splitn / rsplitn"
keys = ["split", "splitn", "rsplitn", "limit", "n", "at", "most", "parts"]
doc = "Split into at most n parts from the left or the right."
snippet = '''
${1:text}.splitn(${2:2}, ${3:' '})$0'''

[[entries]]
name = "rsplit"
keys = ["rsplit", "split", "reverse", "right", "end", "last", "extension"]
doc = "Split from the end, yielding the last part first."
snippet = '''
${1:text}.rsplit(${2:'/'})$0'''

[[entries]]
name = "split by closure"
keys = ["split", "closure", "predicate", "chars", "multiple", "any", "punctuation"]
doc = "Split at any char matching a predicate."
snippet = '''
${1:text}.split(|${2:c}: char| ${3:!c.is_alphanumeric()})$0'''

[[entries]]
name = "split_whitespace"
keys = ["split", "whitespace", "words", "tokens", "spaces", "fields"]
doc = "Iterate over words separated by any whitespace."
snippet = '''
${1:text}.split_whitespace()$0'''

[[entries]]
name = "split_once / rsplit_once"
keys = ["split", "once", "pair", "key", "value", "first", "last", "tuple"]
doc = "Split into the parts before and after the first or last occurrence of a pattern."
snippet = '''
let Some((${1:key}, ${2:value})) = ${3:text}.split_once(${4:'='}) else {
    ${5:return None};
};$0'''

[[entries]]
name = "split_terminator"
keys = ["split", "terminator", "trailing", "lines", "semicolon", "end"]
doc = "Split like split but skip a trailing empty part."
snippet = '''
${1:text}.split_terminator(${2:';'})$0'''

[[entries]]
name = "lines"
keys = ["lines", "newline", "split", "string", "rows", "each"]
doc = "Iterate over the lines of a string without their line endings."
snippet = '''
${1:text}.lines()$0'''

[[entries]]
name = "trim"
keys = ["trim", "strip", "whitespace", "start", "end", "spaces", "clean"]
doc = "Remove leading and trailing whitespace, or only one side with trim_start or trim_end."
snippet = '''
${1:text}.${2:trim}()$0'''

[[entries]]
name = "trim_matches"
keys = ["trim", "matches", "char", "strip", "remove", "quotes", "start", "end"]
doc = "Remove leading and trailing chars matching a pattern, or one side with trim_start_matches."
snippet = '''
${1:text}.${2:trim_matches}(${3:'"'})$0'''

[[entries]]
name = "strip_prefix / strip_suffix"
keys = ["strip", "prefix", "suffix", "remove", "option", "start", "end"]
doc = "Remove a prefix or suffix, giving None if it is absent."
snippet = '''
${1:text}.strip_prefix(${2:"prefix"})$0'''

[[entries]]
name = "contains"
keys = ["contains", "find", "substring", "includes", "has", "search", "in"]
doc = "Test whether a string contains a substring, char or predicate."
snippet = '''
${1:text}.contains(${2:"needle"})$0'''

[[entries]]
name = "starts_with / ends_with"
keys = ["starts", "ends", "with", "prefix", "suffix", "begins", "check"]
doc = "Test for a prefix or suffix."
snippet = '''
${1:text}.${2:starts_with}(${3:"prefix"})$0'''

[[entries]]
name = "find / rfind"
keys = ["find", "rfind", "index", "position", "substring", "search", "offset"]
doc = "Find the byte index of the first or last match."
snippet = '''
${1:text}.find(${2:'x'})$0'''

[[entries]]
name = "matches count"
keys = ["matches", "count", "occurrences", "how", "many", "substring", "times"]
doc = "Count non-overlapping occurrences of a pattern."
snippet = '''
${1:text}.matches(${2:"ab"}).count()$0'''

[[entries]]
name = "match_indices"
keys = ["match", "indices", "positions", "all", "find", "occurrences", "offsets"]
doc = "Iterate over every match with its byte index."
snippet = '''
${1:text}.match_indices(${2:"ab"})$0'''

[[entries]]
name = "len / is_empty"
keys = ["len", "length", "empty", "size", "bytes", "check"]
doc = "Byte length of a string, which is not its char count."
snippet = '''
${1:text}.${2:len}()$0'''

[[entries]]
name = "char count"
keys = ["count", "chars", "length", "characters", "unicode", "len"]
doc = "Number of chars, which differs from len for non-ASCII text."
snippet = '''
${1:text}.chars().count()$0'''

[[entries]]
name = "string slice"
keys = ["slice", "substring", "range", "index", "bytes", "part"]
doc = "Take a substring by byte range, which must fall on char boundaries."
snippet = '''
&${1:text}[${2:start}..${3:end}]$0'''

[[entries]]
name = "get slice safely"
keys = ["get", "slice", "substring", "safe", "option", "boundary", "range"]
doc = "Take a substring by byte range, giving None on an invalid boundary."
snippet = '''
${1:text}.get(${2:start}..${3:end})$0'''

[[entries]]
name = "substring by chars"
keys = ["substring", "chars", "skip", "take", "unicode", "safe", "part"]
doc = "Take a substring by char positions instead of bytes."
snippet = '''
${1:text}.chars().skip(${2:start}).take(${3:len}).collect::<String>()$0'''

[[entries]]
name = "nth char"
keys = ["nth", "char", "index", "character", "at", "position", "chars"]
doc = "Get the char at a position, as an Option."
snippet = '''
${1:text}.chars().nth(${2:i})$0'''

[[entries]]
name = "is_char_boundary"
keys = ["char", "boundary", "utf8", "safe", "slice", "index", "check"]
doc = "Test whether a byte index sits on a char boundary before slicing."
snippet = '''
${1:text}.is_char_boundary(${2:i})$0'''

[[entries]]
name = "match on &str"
keys = ["match", "str", "string", "literal", "compare", "cases", "command"]
doc = "Match a string against literals by borrowing it as str."
snippet = '''
match ${1:s}.as_str() {
    "${2:start}" => $0,
    "${3:stop}" => ${4:todo!()},
    _ => ${5:todo!()},
}'''

[[entries]]
name = "string equality"
keys = ["equal", "compare", "eq", "same", "string", "str", "cmp", "order"]
doc = "Compare strings with == or by ordering with cmp."
snippet = '''
${1:a} == ${2:b}$0'''

[[entries]]
name = "eq_ignore_ascii_case"
keys = ["equal", "ignore", "case", "insensitive", "compare", "ascii", "string"]
doc = "Compare two strings ignoring ASCII case."
snippet = '''
${1:a}.eq_ignore_ascii_case(${2:b})$0'''

[[entries]]
name = "multi-line string"
keys = ["multiline", "string", "lines", "raw", "text", "block", "heredoc"]
doc = "Write a multi-line literal and trim each line's indentation."
snippet = '''
let ${1:text} = "\
    ${2:first line}
    ${3:second line}
";$0'''
