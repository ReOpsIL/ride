title = "Time and durations"
contexts = ["statement", "expression"]

[[entries]]
name = "use std::time"
keys = ["use", "time", "duration", "instant", "import"]
doc = "Import the time types."
snippet = '''
use std::time::{Duration, Instant${1:, SystemTime, UNIX_EPOCH}};$0'''

[[entries]]
name = "Duration::from_secs"
keys = ["duration", "from_secs", "seconds", "time", "span", "create", "new"]
doc = "Create a duration from whole seconds."
snippet = '''
std::time::Duration::from_secs(${1:5})$0'''

