title = "Stdin, stdout and stderr"
contexts = ["statement", "expression"]

[[entries]]
name = "stdin read_line"
keys = ["stdin", "read_line", "input", "line", "prompt", "user", "keyboard"]
doc = "Read one line from standard input."
snippet = '''
let mut ${1:input} = String::new();
std::io::stdin().read_line(&mut ${1:input})?;
let ${1:input} = ${1:input}.trim();$0'''

[[entries]]
name = "prompt and read"
keys = ["prompt", "print", "flush", "read_line", "input", "ask", "question"]
doc = "Print a prompt without newline, flush, then read the answer."
snippet = '''
print!("${1:name}: ");
std::io::stdout().flush()?;
let mut ${2:answer} = String::new();
std::io::stdin().read_line(&mut ${2:answer})?;$0'''

[[entries]]
name = "stdin parse number"
keys = ["stdin", "parse", "number", "int", "input", "read", "trim", "i32"]
doc = "Read a line and parse it as a number."
snippet = '''
let mut ${1:input} = String::new();
std::io::stdin().read_line(&mut ${1:input})?;
let ${2:n}: ${3:i32} = ${1:input}.trim().parse()?;$0'''

[[entries]]
name = "stdin parse numbers on line"
keys = ["stdin", "numbers", "split", "whitespace", "parse", "vec", "line", "many"]
doc = "Read a line of space-separated numbers into a vector."
snippet = '''
let mut ${1:input} = String::new();
std::io::stdin().read_line(&mut ${1:input})?;
let ${2:nums}: Vec<${3:i64}> = ${1:input}
    .split_whitespace()
    .map(|s| s.parse())
    .collect::<Result<_, _>>()?;$0'''

[[entries]]
name = "stdin lines"
keys = ["stdin", "lines", "input", "loop", "for", "each", "pipe"]
doc = "Process standard input line by line."
snippet = '''
for line in std::io::stdin().lock().lines() {
    let line = line?;
    $0
}'''

[[entries]]
name = "stdin lines until empty"
keys = ["stdin", "loop", "until", "empty", "quit", "repl", "break", "read_line"]
doc = "Read lines until an empty line or EOF, a simple REPL loop."
snippet = '''
let mut ${1:line} = String::new();
loop {
    ${1:line}.clear();
    if std::io::stdin().read_line(&mut ${1:line})? == 0 || ${1:line}.trim().is_empty() {
        break;
    }
    $0
}'''

[[entries]]
name = "stdin read all"
keys = ["stdin", "read", "all", "string", "pipe", "whole", "to_string"]
doc = "Read all of standard input into a String."
snippet = '''
let mut ${1:input} = String::new();
std::io::stdin().read_to_string(&mut ${1:input})?;$0'''

[[entries]]
name = "stdin read all bytes"
keys = ["stdin", "bytes", "binary", "read_to_end", "vec", "pipe"]
doc = "Read all of standard input as raw bytes."
snippet = '''
let mut ${1:bytes} = Vec::new();
std::io::stdin().read_to_end(&mut ${1:bytes})?;$0'''

[[entries]]
name = "stdin BufReader"
keys = ["stdin", "bufreader", "lock", "buffered", "reader", "handle", "fast"]
doc = "Take a locked, buffered handle to stdin for many reads."
snippet = '''
let ${1:stdin} = std::io::stdin();
let mut ${2:reader} = ${1:stdin}.lock();$0'''

[[entries]]
name = "stdout lock"
keys = ["stdout", "lock", "write", "fast", "output", "many", "lines"]
doc = "Lock stdout once for many writes to avoid per-line locking."
snippet = '''
let mut ${1:out} = std::io::stdout().lock();
writeln!(${1:out}, "${2:text}")?;$0'''

[[entries]]
name = "stdout BufWriter"
keys = ["stdout", "bufwriter", "buffered", "fast", "output", "flush", "print"]
doc = "Buffer stdout for bulk output and flush at the end."
snippet = '''
let mut ${1:out} = std::io::BufWriter::new(std::io::stdout().lock());
writeln!(${1:out}, "${2:text}")?;
${1:out}.flush()?;$0'''

[[entries]]
name = "stdout flush"
keys = ["stdout", "flush", "print", "no", "newline", "prompt"]
doc = "Flush stdout so a print without newline appears immediately."
snippet = '''
std::io::stdout().flush()?;$0'''

[[entries]]
name = "stdout write bytes"
keys = ["stdout", "write_all", "bytes", "binary", "raw", "output"]
doc = "Write raw bytes to stdout."
snippet = '''
std::io::stdout().write_all(${1:bytes})?;$0'''

[[entries]]
name = "eprintln! to stderr"
keys = ["stderr", "eprintln", "error", "print", "log", "warn", "message"]
doc = "Print a line to standard error."
snippet = '''
eprintln!("${1:error: {\}}", ${2:err});$0'''

[[entries]]
name = "stderr lock"
keys = ["stderr", "lock", "write", "writeln", "error", "handle"]
doc = "Write to stderr through a locked handle."
snippet = '''
let mut ${1:err} = std::io::stderr().lock();
writeln!(${1:err}, "${2:text}")?;$0'''

[[entries]]
name = "print without newline"
keys = ["print", "no", "newline", "inline", "progress", "flush", "same", "line"]
doc = "Print in place and flush, for progress output on one line."
snippet = '''
print!("\r${1:{\}%}", ${2:percent});
std::io::stdout().flush()?;$0'''

[[entries]]
name = "Box<dyn Write> stdout or file"
keys = ["box", "dyn", "write", "stdout", "file", "either", "output", "choose"]
doc = "Choose stdout or a file at runtime behind one writer type."
snippet = '''
let mut ${1:out}: Box<dyn std::io::Write> = match ${2:path} {
    Some(p) => Box::new(std::fs::File::create(p)?),
    None => Box::new(std::io::stdout()),
};$0'''

[[entries]]
name = "handle broken pipe"
keys = ["broken", "pipe", "errorkind", "stdout", "head", "exit", "ignore"]
doc = "Exit quietly when stdout is closed early, as by piping into head."
snippet = '''
if let Err(e) = writeln!(${1:out}, "${2:{\}}", ${3:value}) {
    if e.kind() == std::io::ErrorKind::BrokenPipe {
        std::process::exit(0);
    }
    return Err(e.into());
}$0'''

[[entries]]
name = "is terminal"
keys = ["terminal", "tty", "isatty", "is_terminal", "interactive", "pipe", "detect"]
doc = "Check whether stdout is a terminal rather than a pipe."
snippet = '''
use std::io::IsTerminal;
if std::io::stdout().is_terminal() {
    $0
}'''
