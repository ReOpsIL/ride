title = "Files and I/O"
contexts = ["statement", "expression"]

[[entries]]
name = "use std::io prelude"
keys = ["use", "io", "read", "write", "bufread", "import", "traits", "prelude"]
doc = "Import the I/O traits needed for read, write and lines methods."
snippet = '''
use std::io::{self, BufRead, Read, Write};$0'''

[[entries]]
name = "fs::read_to_string"
keys = ["fs", "read", "file", "string", "load", "text", "whole", "contents"]
doc = "Read a whole file into a String."
snippet = '''
let ${1:text} = std::fs::read_to_string(${2:path})?;$0'''

[[entries]]
name = "fs::read"
keys = ["fs", "read", "bytes", "file", "binary", "vec", "u8"]
doc = "Read a whole file into a byte vector."
snippet = '''
let ${1:bytes} = std::fs::read(${2:path})?;$0'''

[[entries]]
name = "read file lines"
keys = ["read", "lines", "file", "string", "for", "each", "split", "iterate"]
doc = "Read a small file and iterate its lines from memory."
snippet = '''
for ${1:line} in std::fs::read_to_string(${2:path})?.lines() {
    $0
}'''

[[entries]]
name = "read lines into Vec"
keys = ["read", "lines", "vec", "collect", "file", "strings", "list"]
doc = "Collect the lines of a file into a vector of owned strings."
snippet = '''
let ${1:lines}: Vec<String> = std::fs::read_to_string(${2:path})?.lines().map(String::from).collect();$0'''

[[entries]]
name = "fs::write"
keys = ["fs", "write", "file", "save", "create", "text", "overwrite", "whole"]
doc = "Write bytes or text to a file, creating or truncating it."
snippet = '''
std::fs::write(${1:path}, ${2:contents})?;$0'''

[[entries]]
name = "File::open"
keys = ["file", "open", "read", "handle", "existing"]
doc = "Open an existing file for reading."
snippet = '''
let ${1:file} = std::fs::File::open(${2:path})?;$0'''

[[entries]]
name = "File::create"
keys = ["file", "create", "write", "truncate", "new", "handle"]
doc = "Create or truncate a file for writing."
snippet = '''
let mut ${1:file} = std::fs::File::create(${2:path})?;$0'''

[[entries]]
name = "OpenOptions append"
keys = ["openoptions", "append", "open", "file", "options", "log", "add"]
doc = "Open a file for appending, creating it when missing."
snippet = '''
let mut ${1:file} = std::fs::OpenOptions::new().append(true).create(true).open(${2:path})?;$0'''

[[entries]]
name = "OpenOptions read write"
keys = ["openoptions", "read", "write", "truncate", "create_new", "flags", "mode", "open"]
doc = "Open with explicit read, write, create and truncate flags."
snippet = '''
let mut ${1:file} = std::fs::OpenOptions::new()
    .read(true)
    .write(true)
    .create(${2:true})
    .truncate(${3:false})
    .open(${4:path})?;$0'''

[[entries]]
name = "write! to file"
keys = ["write", "writeln", "file", "format", "text", "line", "macro"]
doc = "Write formatted text to a file handle."
snippet = '''
writeln!(${1:file}, "${2:{\}}", ${3:value})?;$0'''

[[entries]]
name = "write_all"
keys = ["write", "all", "bytes", "writer", "raw", "buffer"]
doc = "Write an entire byte slice to a writer."
snippet = '''
${1:writer}.write_all(${2:bytes})?;$0'''

[[entries]]
name = "BufReader lines"
keys = ["bufreader", "lines", "read", "file", "buffered", "for", "large", "stream"]
doc = "Read a file line by line through a buffered reader."
snippet = '''
let ${1:reader} = std::io::BufReader::new(${2:file});
for line in ${1:reader}.lines() {
    let line = line?;
    $0
}'''

[[entries]]
name = "BufReader read_line loop"
keys = ["read_line", "loop", "bufreader", "eof", "zero", "reuse", "buffer"]
doc = "Read lines into a reused buffer until read_line returns zero at EOF."
snippet = '''
let mut ${1:reader} = std::io::BufReader::new(${2:file});
let mut ${3:line} = String::new();
while ${1:reader}.read_line(&mut ${3:line})? > 0 {
    $0
    ${3:line}.clear();
}'''

[[entries]]
name = "read_to_end"
keys = ["read", "to_end", "bytes", "reader", "all", "vec", "drain"]
doc = "Read every remaining byte from a reader into a vector."
snippet = '''
let mut ${1:buf} = Vec::new();
${2:reader}.read_to_end(&mut ${1:buf})?;$0'''

[[entries]]
name = "read_to_string from reader"
keys = ["read", "to_string", "reader", "string", "all", "text"]
doc = "Read a reader to the end into a String."
snippet = '''
let mut ${1:text} = String::new();
${2:reader}.read_to_string(&mut ${1:text})?;$0'''

[[entries]]
name = "read exact buffer"
keys = ["read", "exact", "buffer", "bytes", "fixed", "header", "fill"]
doc = "Fill a fixed-size buffer completely from a reader."
snippet = '''
let mut ${1:buf} = [0u8; ${2:N}];
${3:reader}.read_exact(&mut ${1:buf})?;$0'''

[[entries]]
name = "read chunk loop"
keys = ["read", "chunk", "loop", "buffer", "n", "zero", "eof", "stream"]
doc = "Read a stream in chunks until read returns zero bytes."
snippet = '''
let mut ${1:buf} = [0u8; ${2:8192}];
loop {
    let n = ${3:reader}.read(&mut ${1:buf})?;
    if n == 0 {
        break;
    }
    let ${4:chunk} = &${1:buf}[..n];
    $0
}'''

[[entries]]
name = "BufWriter"
keys = ["bufwriter", "write", "buffered", "file", "flush", "fast", "many"]
doc = "Wrap a writer to batch small writes, flushing at the end."
snippet = '''
let mut ${1:writer} = std::io::BufWriter::new(${2:file});
writeln!(${1:writer}, "${3:text}")?;
${1:writer}.flush()?;$0'''

[[entries]]
name = "flush"
keys = ["flush", "write", "buffer", "sync", "force", "output"]
