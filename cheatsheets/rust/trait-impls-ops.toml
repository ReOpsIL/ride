title = "Standard trait impls: ops and iteration"
contexts = ["item"]

[[entries]]
name = "impl Deref"
keys = ["impl", "deref", "wrapper", "newtype", "smart"]
doc = "Let a wrapper auto-dereference to its inner type."
snippet = '''
impl std::ops::Deref for ${1:Type} {
    type Target = ${2:Inner};

    fn deref(&self) -> &Self::Target {
        &self.${3:0}
    }
}$0'''

[[entries]]
name = "impl DerefMut"
keys = ["impl", "derefmut", "deref", "mut", "wrapper"]
doc = "Let a wrapper auto-dereference mutably to its inner type."
snippet = '''
impl std::ops::DerefMut for ${1:Type} {
    fn deref_mut(&mut self) -> &mut Self::Target {
        &mut self.${2:0}
    }
}$0'''

