[[entries]]
name = "impl IntoIterator"
keys = ["impl", "intoiterator", "for", "loop", "iter"]
doc = "Let a borrowed collection type be used directly in a for loop."
snippet = '''
impl<'a> IntoIterator for &'a ${1:Type} {
    type Item = &'a ${2:Elem};
    type IntoIter = std::slice::Iter<'a, ${2:Elem}>;

    fn into_iter(self) -> Self::IntoIter {
        self.${3:items}.iter()
    }
}$0'''

[[entries]]
name = "impl Extend"
keys = ["impl", "extend", "collection", "push"]
doc = "Let a collection type absorb any iterator of items."
snippet = '''
impl Extend<${1:T}> for ${2:Type} {
    fn extend<I: IntoIterator<Item = ${1:T}>>(&mut self, iter: I) {
        for ${3:item} in iter {
            $0
        }
    }
}'''

