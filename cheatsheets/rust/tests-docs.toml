title = "Tests"
contexts = ["item", "body"]

[[entries]]
name = "test fn"
keys = ["test", "fn", "unit", "assert", "case", "define"]
doc = "Define a unit test."
snippet = '''
#[test]
fn ${1:name}() {
    $0
}'''

[[entries]]
name = "tests module"
keys = ["test", "mod", "cfg", "tests", "module", "unit", "super"]
doc = "Define the conventional test module compiled only under cargo test."
snippet = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn ${1:name}() {
        $0
    }
}'''

[[entries]]
name = "test should_panic"
keys = ["test", "should_panic", "panic", "expected", "fails", "message"]
doc = "Define a test that passes only when it panics with a matching message."
snippet = '''
#[test]
#[should_panic(expected = "${1:message}")]
fn ${2:name}() {
    $0
}'''

[[entries]]
name = "test should_panic any"
keys = ["test", "should_panic", "panic", "any", "fails", "crash"]
doc = "Define a test that passes when it panics for any reason."
snippet = '''
#[test]
#[should_panic]
fn ${1:name}() {
    $0
}'''

[[entries]]
name = "test ignore"
keys = ["test", "ignore", "skip", "slow", "disabled", "reason"]
doc = "Define a test skipped by default and run with --ignored."
snippet = '''
#[test]
#[ignore = "${1:reason}"]
fn ${2:name}() {
    $0
}'''

[[entries]]
name = "test returning Result"
keys = ["test", "result", "question", "error", "fallible", "ok"]
doc = "Define a test that can use the question-mark operator."
snippet = '''
#[test]
fn ${1:name}() -> Result<(), Box<dyn std::error::Error>> {
    $0
    Ok(())
}'''

[[entries]]
name = "async test (tokio)"
keys = ["test", "async", "tokio", "await", "runtime"]
doc = "Define an async test run on the tokio runtime."
snippet = '''
#[tokio::test]
async fn ${1:name}() {
    $0
}'''

[[entries]]
name = "table-driven test"
keys = ["test", "table", "cases", "loop", "parametrized", "inputs", "expected"]
doc = "Run one assertion over a table of input and expected pairs."
snippet = '''
#[test]
fn ${1:name}() {
    let cases = [(${2:input}, ${3:expected})];
    for (input, expected) in cases {
        assert_eq!(${4:f}(input), expected, "input {input:?}");$0
    }
}'''

[[entries]]
name = "property-style test loop"
keys = ["property", "random", "loop", "many", "inputs", "fuzz", "invariant", "roundtrip"]
doc = "Check an invariant over many generated inputs with a plain loop."
snippet = '''
#[test]
fn ${1:roundtrip}() {
    for ${2:i} in 0..${3:1000} {
        let ${4:input} = ${5:i * 7919 % 1013};
        assert_eq!(${6:decode(encode(input))}, ${4:input}, "case {${2:i}}");$0
    }
}'''

[[entries]]
name = "test helper fn"
keys = ["test", "helper", "fixture", "setup", "builder", "make"]
doc = "Define a fixture builder shared by tests in the module."
snippet = '''
fn ${1:fixture}() -> ${2:Type} {
    $0
}'''

[[entries]]
name = "setup with cleanup guard"
keys = ["setup", "teardown", "cleanup", "drop", "guard", "fixture", "after"]
doc = "Run teardown automatically by dropping a guard at the end of the test."
snippet = '''
struct ${1:Guard}(${2:std::path::PathBuf});

impl Drop for ${1:Guard} {
    fn drop(&mut self) {
        ${3:let _ = std::fs::remove_dir_all(&self.0);}$0
    }
}'''

[[entries]]
name = "cfg(test) item"
keys = ["cfg", "test", "only", "item", "helper", "compile", "conditional"]
doc = "Compile an item only when running tests."
snippet = '''
#[cfg(test)]
${1:fn helper() {\}}$0'''

[[entries]]
name = "integration test file"
keys = ["test", "integration", "tests", "dir", "file", "crate", "external"]
doc = "Skeleton for a file under tests/ that uses the crate as a dependency."
snippet = '''
use ${1:crate_name}::*;

#[test]
fn ${2:name}() {
    $0
}'''

[[entries]]
name = "tests/common module"
keys = ["common", "shared", "helpers", "integration", "mod", "tests", "dir"]
doc = "Share helpers between integration tests through tests/common/mod.rs."
snippet = '''
mod common;

#[test]
fn ${1:name}() {
    let ${2:ctx} = common::${3:setup}();
    $0
}'''

[[entries]]
name = "bench (criterion)"
keys = ["bench", "benchmark", "criterion", "perf", "measure"]
doc = "Skeleton for a criterion benchmark under benches/."
snippet = '''
use criterion::{criterion_group, criterion_main, Criterion};

fn ${1:bench}(c: &mut Criterion) {
    c.bench_function("${2:name}", |b| b.iter(|| ${3:work()}));$0
}

criterion_group!(benches, ${1:bench});
criterion_main!(benches);'''

[[entries]]
name = "timing test with Instant"
keys = ["timing", "instant", "elapsed", "benchmark", "slow", "duration", "assert", "perf"]
doc = "Time a block inside a test and fail when it exceeds a budget."
snippet = '''
#[test]
fn ${1:is_fast_enough}() {
    let start = std::time::Instant::now();
    $0
    assert!(start.elapsed() < std::time::Duration::from_millis(${2:100}), "took {:?}", start.elapsed());
}'''

[[entries]]
name = "test with std temp dir"
keys = ["test", "temp", "dir", "temp_dir", "fixture", "fs", "std", "scratch"]
doc = "Create a unique scratch directory under the system temp dir without a crate."
snippet = '''
let ${1:dir} = std::env::temp_dir().join(format!("${2:test}-{}", std::process::id()));
std::fs::create_dir_all(&${1:dir})?;
$0
std::fs::remove_dir_all(&${1:dir})?;'''

[[entries]]
name = "test with tempfile crate"
keys = ["test", "tempdir", "tempfile", "fs", "fixture", "crate"]
doc = "Create a temporary directory cleaned up when the test ends."
snippet = '''
let ${1:dir} = tempfile::tempdir()?;
let ${2:path} = ${1:dir}.path().join("${3:file.txt}");$0'''

[[entries]]
name = "cargo test cheat"
keys = ["cargo", "test", "run", "filter", "nocapture", "command", "threads"]
doc = "Common cargo test invocations, as a comment to keep nearby."
snippet = '''
// cargo test ${1:name} -- --nocapture --test-threads=1 --ignored$0'''
