title = "Process and child commands"
contexts = ["statement", "expression"]

[[entries]]
name = "Command output"
keys = ["command", "output", "process", "run", "spawn", "exec", "capture", "stdout"]
doc = "Run a program, wait for it and capture its output."
snippet = '''
let ${1:output} = std::process::Command::new("${2:ls}")
    .args([${3:"-l"}])
    .output()?;
let ${4:stdout} = String::from_utf8_lossy(&${1:output}.stdout);$0'''

[[entries]]
name = "Command status"
keys = ["command", "status", "process", "run", "inherit", "exec", "success", "exit"]
doc = "Run a program with inherited stdio and check its exit status."
snippet = '''
let ${1:status} = std::process::Command::new("${2:cargo}")
    .arg("${3:build}")
    .status()?;
if !${1:status}.success() {
    $0
}'''

[[entries]]
name = "Command with args vec"
keys = ["command", "args", "vec", "dynamic", "list", "arguments", "iter"]
doc = "Pass a dynamic list of arguments."
snippet = '''
std::process::Command::new(${1:program}).args(&${2:args}).status()?$0'''

[[entries]]
name = "Command env / current_dir"
keys = ["command", "env", "current_dir", "cwd", "environment", "variable", "directory"]
doc = "Run a program with an extra environment variable in a directory."
snippet = '''
std::process::Command::new("${1:prog}")
    .env("${2:KEY}", ${3:"value"})
    .current_dir(${4:dir})
    .status()?$0'''

[[entries]]
name = "Command env_clear / env_remove"
keys = ["command", "env_clear", "env_remove", "environment", "clean", "isolate"]
doc = "Start the child with a clean or reduced environment."
snippet = '''
std::process::Command::new("${1:prog}").env_clear().envs(${2:vars})$0'''

[[entries]]
name = "Command spawn and wait"
keys = ["command", "spawn", "wait", "child", "process", "background", "later"]
doc = "Start a child process and wait for it later."
snippet = '''
let mut ${1:child} = std::process::Command::new("${2:prog}")
    .spawn()?;
$0
let ${3:status} = ${1:child}.wait()?;'''

[[entries]]
name = "Command piped stdin"
keys = ["command", "stdin", "pipe", "stdio", "write", "child", "feed", "input"]
doc = "Feed data to a child process through its standard input."
snippet = '''
let mut ${1:child} = std::process::Command::new("${2:prog}")
    .stdin(std::process::Stdio::piped())
    .stdout(std::process::Stdio::piped())
    .spawn()?;
${1:child}.stdin.take().unwrap().write_all(${3:input})?;
let ${4:output} = ${1:child}.wait_with_output()?;$0'''

[[entries]]
name = "stream child stdout lines"
keys = ["child", "stdout", "lines", "stream", "bufreader", "live", "read", "pipe"]
doc = "Read a child's output line by line while it runs."
snippet = '''
let mut ${1:child} = std::process::Command::new("${2:prog}")
    .stdout(std::process::Stdio::piped())
    .spawn()?;
let ${3:stdout} = ${1:child}.stdout.take().unwrap();
for line in std::io::BufReader::new(${3:stdout}).lines() {
    let line = line?;
    $0
}
${1:child}.wait()?;'''

[[entries]]
name = "Stdio null / inherit"
keys = ["stdio", "null", "inherit", "silence", "stderr", "quiet", "discard"]
doc = "Silence or pass through a child's stream."
snippet = '''
.stderr(std::process::Stdio::${1:null}())$0'''

[[entries]]
name = "exit code"
keys = ["exit", "code", "status", "code", "int", "child", "returned", "number"]
doc = "Read the numeric exit code of a finished process, None if killed by a signal."
snippet = '''
let ${1:code} = ${2:status}.code().unwrap_or(${3:-1});$0'''

[[entries]]
name = "output stderr on failure"
keys = ["output", "stderr", "failure", "error", "message", "bail", "success", "check"]
doc = "Turn a failed command into an error carrying its stderr."
snippet = '''
if !${1:output}.status.success() {
    return Err(format!("${2:command failed}: {}", String::from_utf8_lossy(&${1:output}.stderr)).into());
}$0'''

[[entries]]
name = "stdout to String"
keys = ["stdout", "string", "from_utf8", "output", "convert", "text", "trim"]
doc = "Convert captured output into an owned trimmed String."
snippet = '''
let ${1:text} = String::from_utf8(${2:output}.stdout)?.trim().to_string();$0'''

[[entries]]
name = "try_wait poll"
keys = ["try_wait", "poll", "child", "running", "finished", "nonblocking", "check"]
doc = "Check whether a child has exited without blocking."
snippet = '''
match ${1:child}.try_wait()? {
    Some(${2:status}) => $0,
    None => {}
}'''

[[entries]]
name = "kill child"
keys = ["kill", "child", "terminate", "stop", "process", "signal"]
doc = "Terminate a child process."
snippet = '''
${1:child}.kill()?;
${1:child}.wait()?;$0'''

[[entries]]
name = "shell command sh -c"
keys = ["shell", "sh", "bash", "pipe", "command", "string", "glob", "script"]
doc = "Run a shell command line through sh."
snippet = '''
std::process::Command::new("sh").arg("-c").arg("${1:ls | wc -l}").output()?$0'''

[[entries]]
name = "process::exit"
keys = ["process", "exit", "quit", "code", "status", "terminate", "stop"]
doc = "Terminate the process immediately with an exit code, skipping destructors."
snippet = '''
std::process::exit(${1:1});$0'''

[[entries]]
name = "process::abort"
keys = ["abort", "process", "crash", "immediate", "no", "unwind", "core"]
doc = "Abort the process at once without unwinding or running hooks."
snippet = '''
std::process::abort();$0'''

[[entries]]
name = "process::id"
keys = ["process", "id", "pid", "current", "self"]
doc = "Get the current process id."
snippet = '''
std::process::id()$0'''

[[entries]]
name = "ExitCode main"
keys = ["exitcode", "main", "exit", "status", "return", "failure", "success"]
doc = "Return an exit status from main without skipping destructors."
snippet = '''
fn main() -> std::process::ExitCode {
    $0
    std::process::ExitCode::${1:SUCCESS}
}'''

[[entries]]
name = "usage error and exit"
keys = ["usage", "error", "exit", "eprintln", "cli", "help", "message", "wrong"]
doc = "Print a usage message to stderr and exit non-zero."
snippet = '''
eprintln!("usage: ${1:prog <file>}");
std::process::exit(${2:2});$0'''

[[entries]]
name = "panic hook"
keys = ["panic", "hook", "set_hook", "handler", "crash", "custom", "report"]
doc = "Install a custom handler run on every panic."
snippet = '''
std::panic::set_hook(Box::new(|${1:info}| {
    eprintln!("panic: {$1}");$0
}));'''

[[entries]]
name = "catch_unwind"
keys = ["panic", "catch_unwind", "recover", "unwind", "isolate", "plugin"]
doc = "Run a closure and turn a panic into an Err."
snippet = '''
let ${1:result} = std::panic::catch_unwind(|| {
    $0
});'''

[[entries]]
name = "ctrl-c handler (ctrlc crate)"
keys = ["signal", "ctrl", "sigint", "shutdown", "ctrlc", "handler", "flag", "graceful"]
doc = "Set a flag on Ctrl-C so the main loop can stop cleanly."
snippet = '''
let ${1:running} = Arc::new(std::sync::atomic::AtomicBool::new(true));
let ${2:r} = ${1:running}.clone();
ctrlc::set_handler(move || ${2:r}.store(false, std::sync::atomic::Ordering::SeqCst))?;
while ${1:running}.load(std::sync::atomic::Ordering::SeqCst) {
    $0
}'''

[[entries]]
name = "ctrl-c / signal (tokio)"
keys = ["signal", "ctrl", "sigint", "shutdown", "tokio", "async", "await"]
doc = "Wait for Ctrl-C to trigger a graceful shutdown in an async program."
snippet = '''
tokio::signal::ctrl_c().await?;
$0'''
