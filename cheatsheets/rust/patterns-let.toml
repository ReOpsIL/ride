title = "Typed and nested bindings"
contexts = ["statement", "pattern"]

[[entries]]
name = "let integer typed"
keys = ["let", "int", "i32", "u64", "usize", "typed", "number", "declare"]
doc = "Bind an integer with an explicit width instead of the default i32."
snippet = '''
let ${1:count}: ${2:usize} = ${3:0};$0'''

[[entries]]
name = "let float typed"
keys = ["let", "float", "f64", "f32", "typed", "decimal", "declare"]
doc = "Bind a floating point value with an explicit precision."
snippet = '''
let ${1:ratio}: ${2:f64} = ${3:0.5};$0'''

[[entries]]
name = "let bool / char typed"
keys = ["let", "bool", "char", "typed", "flag", "true", "false", "declare"]
doc = "Bind a boolean or character with an explicit type."
snippet = '''
let ${1:done}: ${2:bool} = ${3:false};$0'''

[[entries]]
name = "let mut typed"
keys = ["let", "mut", "type", "typed", "mutable", "declare", "annotate"]
doc = "Bind a mutable variable with an explicit type."
snippet = '''
let mut ${1:name}: ${2:Type} = ${3:value};$0'''

[[entries]]
name = "let array typed"
keys = ["let", "array", "typed", "fixed", "size", "stack", "brackets", "declare"]
doc = "Bind a fixed-size array with its element type and length spelled out."
snippet = '''
let ${1:arr}: [${2:i32}; ${3:4}] = [${4:10, 20, 30, 40}];$0'''

[[entries]]
name = "let 2d array typed"
keys = ["let", "array", "2d", "grid", "matrix", "nested", "typed", "zeros"]
doc = "Bind a two-dimensional array of fixed rows and columns."
snippet = '''
let ${1:grid}: [[${2:u8}; ${3:COLS}]; ${4:ROWS}] = [[${5:0}; ${3:COLS}]; ${4:ROWS}];$0'''

[[entries]]
name = "let slice from array"
keys = ["let", "slice", "array", "view", "borrow", "range", "typed"]
doc = "Bind a borrowed slice viewing part or all of an array or Vec."
snippet = '''
let ${1:part}: &[${2:i32}] = &${3:arr}[${4:1..3}];$0'''

[[entries]]
name = "let vec typed"
keys = ["let", "vec", "vector", "list", "typed", "new", "empty", "declare"]
doc = "Bind a Vec with an explicit element type, needed when it starts empty."
snippet = '''
let mut ${1:items}: Vec<${2:i32}> = Vec::new();$0'''

[[entries]]
name = "let string typed"
keys = ["let", "string", "str", "typed", "text", "owned", "borrowed"]
doc = "Bind an owned String or a borrowed string slice explicitly."
snippet = '''
let ${1:name}: ${2:String} = ${3:String::from("text")};$0'''

[[entries]]
name = "let map typed"
keys = ["let", "hashmap", "map", "dictionary", "typed", "new", "empty"]
doc = "Bind an empty HashMap with explicit key and value types."
snippet = '''
let mut ${1:map}: std::collections::HashMap<${2:String}, ${3:i32}> = std::collections::HashMap::new();$0'''

[[entries]]
name = "let option typed"
keys = ["let", "option", "none", "typed", "maybe", "nullable", "later"]
doc = "Bind an Option that starts as None, giving its type so inference succeeds."
snippet = '''
let mut ${1:found}: Option<${2:usize}> = None;$0'''

[[entries]]
name = "let tuple typed"
keys = ["let", "tuple", "typed", "pair", "annotate", "declare"]
doc = "Bind a tuple with its element types spelled out."
snippet = '''
let ${1:pair}: (${2:i32}, ${3:&str}) = (${4:1}, ${5:"one"});$0'''

[[entries]]
name = "let reference typed"
keys = ["let", "reference", "borrow", "typed", "ampersand", "pointer"]
doc = "Bind a shared reference to an existing value with an explicit type."
snippet = '''
let ${1:r}: &${2:i32} = &${3:value};$0'''

[[entries]]
name = "let box typed"
keys = ["let", "box", "heap", "typed", "allocate", "pointer"]
doc = "Bind a heap-allocated value behind a Box."
snippet = '''
let ${1:boxed}: Box<${2:i32}> = Box::new(${3:5});$0'''

[[entries]]
name = "let with turbofish"
keys = ["let", "turbofish", "parse", "collect", "generic", "infer", "type"]
doc = "Fix the type of a generic call at the call site instead of on the binding."
snippet = '''
let ${1:n} = ${2:text}.parse::<${3:i32}>()${4:?};$0'''

[[entries]]
name = "let tuple mut element"
keys = ["let", "tuple", "mut", "destructure", "partial", "mutable"]
doc = "Destructure a tuple making only some bindings mutable."
snippet = '''
let (mut ${1:count}, ${2:name}) = ${3:pair};$0'''

[[entries]]
name = "let ignore element"
keys = ["let", "underscore", "ignore", "tuple", "destructure", "skip", "unused"]
doc = "Destructure a tuple while discarding an element with an underscore."
snippet = '''
let (${1:_}, ${2:value}) = ${3:pair};$0'''

[[entries]]
name = "let tuple rest"
keys = ["let", "tuple", "rest", "dotdot", "destructure", "first", "skip"]
doc = "Destructure only the leading elements of a tuple, ignoring the rest."
snippet = '''
let (${1:first}, ..) = ${2:tuple};$0'''

[[entries]]
name = "let nested tuple"
keys = ["let", "tuple", "nested", "destructure", "deep", "pair"]
doc = "Destructure a tuple containing tuples in one binding."
snippet = '''
let ((${1:a}, ${2:b}), ${3:c}) = ${4:nested};$0'''

[[entries]]
name = "let tuple struct"
keys = ["let", "tuple", "struct", "newtype", "destructure", "unwrap", "inner"]
doc = "Destructure a tuple struct or newtype to reach its fields."
snippet = '''
let ${1:Meters}(${2:value}) = ${3:distance};$0'''

[[entries]]
name = "let array fixed"
keys = ["let", "array", "destructure", "three", "fixed", "elements", "unpack"]
doc = "Destructure an array of known length into one binding per element."
snippet = '''
let [${1:x}, ${2:y}, ${3:z}] = ${4:coords};$0'''

[[entries]]
name = "destructuring assignment"
keys = ["assign", "tuple", "swap", "destructure", "reassign", "multiple"]
doc = "Assign several existing variables at once, such as swapping two values."
snippet = '''
(${1:a}, ${2:b}) = (${2:b}, ${1:a});$0'''

[[entries]]
name = "local const"
keys = ["const", "local", "fn", "inside", "constant", "scope"]
doc = "Define a constant scoped to the current block."
snippet = '''
const ${1:LIMIT}: ${2:usize} = ${3:10};$0'''

[[entries]]
name = "let from block"
keys = ["let", "block", "init", "compute", "scope", "temporary"]
doc = "Initialize a binding from a block so temporaries stay scoped."
snippet = '''
let ${1:value} = {
    ${2:let tmp = compute();}
    ${3:tmp * 2}$0
};'''
