title = "Trait patterns and dispatch"
contexts = ["item", "body"]

[[entries]]
name = "trait definition"
keys = ["trait", "interface", "define", "abstract", "contract", "protocol"]
doc = "Define a trait with one required method."
snippet = '''
trait ${1:Name} {
    fn ${2:method}(&self) -> ${3:String};$0
}'''

[[entries]]
name = "pub trait"
keys = ["pub", "trait", "public", "export", "interface"]
doc = "Define a trait visible outside the module."
snippet = '''
pub trait ${1:Name} {
    fn ${2:method}(&self);$0
}'''

[[entries]]
name = "trait with lifetime parameter"
keys = ["trait", "lifetime", "generic", "borrow", "parse"]
doc = "Define a trait parameterized by a lifetime, for methods returning borrowed data."
snippet = '''
trait ${1:Parse}<'${2:a}> {
    fn ${3:parse}(input: &'${2:a} str) -> Self;$0
}'''

[[entries]]
name = "trait default calling required"
keys = ["trait", "default", "provided", "required", "template", "method"]
doc = "Default method built on top of a required one, the template-method pattern."
snippet = '''
trait ${1:Shape} {
    fn ${2:area}(&self) -> ${3:f64};

    fn ${4:describe}(&self) -> String {
        format!("area {}", self.${2:area}())$0
    }
}'''

[[entries]]
name = "trait with async fn"
keys = ["trait", "async", "fn", "await", "future"]
doc = "Define a trait with an async method, usable with static dispatch."
snippet = '''
trait ${1:Fetch} {
    async fn ${2:fetch}(&self, ${3:url}: &str) -> ${4:String};$0
}'''

[[entries]]
name = "impl Trait for &T"
keys = ["impl", "trait", "for", "reference", "ref", "borrowed", "lifetime"]
doc = "Implement a trait for references so borrowed values qualify too."
snippet = '''
impl<'a, T: ${1:Trait}> ${1:Trait} for &'a T {
    fn ${2:method}(&self) -> ${3:String} {
        (**self).${2:method}()$0
    }
}'''

[[entries]]
name = "impl Trait for Vec<T>"
keys = ["impl", "trait", "for", "vec", "std", "extension", "collection"]
doc = "Implement your own trait for a std type."
snippet = '''
impl<T: ${1:Display}> ${2:Trait} for Vec<T> {
    fn ${3:method}(&self) -> ${4:String} {
        $0
    }
}'''

[[entries]]
name = "impl Trait for specific instantiation"
keys = ["impl", "specific", "instantiation", "concrete", "specialize", "generic"]
doc = "Add methods only to one concrete instantiation of a generic type."
snippet = '''
impl ${1:Wrapper}<${2:i32}> {
    fn ${3:method}(&self) -> ${4:i32} {
        $0
    }
}'''

[[entries]]
name = "conditional impl"
keys = ["impl", "conditional", "bound", "where", "only", "generic", "when"]
doc = "Implement a trait for a generic type only when its parameter meets a bound."
snippet = '''
impl<T: ${1:Display}> ${2:Trait} for ${3:Wrapper}<T> {
    fn ${4:method}(&self) -> ${5:String} {
        $0
    }
}'''

[[entries]]
name = "impl Trait for closures"
keys = ["impl", "trait", "closure", "fn", "blanket", "callback", "generic"]
doc = "Make every matching closure implement your trait through a blanket impl."
snippet = '''
impl<F: Fn(${1:&str}) -> ${2:bool}> ${3:Trait} for F {
    fn ${4:method}(&self, ${5:input}: ${1:&str}) -> ${2:bool} {
        self(${5:input})$0
    }
}'''

[[entries]]
name = "extension trait"
keys = ["extension", "trait", "ext", "std", "add", "method", "foreign", "str"]
doc = "Add methods to a foreign type by defining a trait and implementing it for that type."
snippet = '''
trait ${1:StrExt} {
    fn ${2:shout}(&self) -> String;
}

impl ${1:StrExt} for str {
    fn ${2:shout}(&self) -> String {
        ${3:self.to_uppercase()}$0
    }
}'''

[[entries]]
name = "sealed trait"
keys = ["sealed", "trait", "private", "closed", "no", "external", "impl"]
doc = "Prevent downstream crates from implementing a trait via a private supertrait."
snippet = '''
mod private {
    pub trait Sealed {}
}

pub trait ${1:Name}: private::Sealed {
    fn ${2:method}(&self);
}

impl private::Sealed for ${3:Type} {}$0'''

[[entries]]
name = "newtype for foreign trait"
keys = ["newtype", "orphan", "wrapper", "foreign", "impl", "rule", "workaround"]
doc = "Wrap a foreign type in a tuple struct so a foreign trait can be implemented for it."
snippet = '''
struct ${1:Wrapper}(${2:Vec<String>});

impl ${3:std::fmt::Display} for ${1:Wrapper} {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "{}", ${4:self.0.join(", ")})$0
    }
}'''

[[entries]]
name = "associated const in impl"
keys = ["impl", "associated", "const", "constant", "value", "trait"]
doc = "Provide the value of a trait's associated constant."
snippet = '''
impl ${1:Trait} for ${2:Type} {
    const ${3:NAME}: ${4:&'static str} = ${5:"value"};$0
}'''

[[entries]]
name = "impl Trait for enum with match"
keys = ["impl", "enum", "match", "variant", "trait", "dispatch"]
doc = "Implement a trait method for an enum by matching on its variants."
snippet = '''
impl ${1:Trait} for ${2:Enum} {
    fn ${3:method}(&self) -> ${4:String} {
        match self {
            ${2:Enum}::${5:A} => ${6:todo!()},
            ${2:Enum}::${7:B} => $0,
        }
    }
}'''

[[entries]]
name = "static dispatch fn"
keys = ["static", "dispatch", "generic", "monomorphize", "impl", "fn", "fast"]
doc = "Function taking any implementor as a generic, compiled once per concrete type."
snippet = '''
fn ${1:run}<T: ${2:Trait}>(${3:value}: &T) {
    ${3:value}.${4:method}();$0
}'''

[[entries]]
name = "dynamic dispatch fn"
keys = ["dynamic", "dispatch", "dyn", "vtable", "runtime", "fn", "object"]
doc = "Function taking a trait object, one compiled body dispatching through a vtable."
snippet = '''
fn ${1:run}(${2:value}: &dyn ${3:Trait}) {
    ${2:value}.${4:method}();$0
}'''

[[entries]]
name = "factory returning Box<dyn Trait>"
keys = ["factory", "box", "dyn", "return", "trait", "object", "match", "create"]
doc = "Choose a concrete implementor at runtime and return it boxed."
snippet = '''
fn ${1:make}(${2:kind}: &str) -> Box<dyn ${3:Trait}> {
    match ${2:kind} {
        ${4:"a"} => Box::new(${5:A}),
        _ => Box::new(${6:B}),$0
    }
}'''

[[entries]]
name = "trait objects need object safety"
keys = ["object", "safe", "dyn", "compatible", "generic", "self", "sized"]
doc = "A trait usable as dyn must avoid generic methods and returning Self, or gate them with Self: Sized."
snippet = '''
trait ${1:Name} {
    fn ${2:method}(&self);
    fn ${3:make}() -> Self
    where
        Self: Sized;$0
}'''

[[entries]]
name = "generic struct holding T: Trait"
keys = ["struct", "generic", "bound", "field", "trait", "hold", "static"]
doc = "Store any implementor in a struct by making the struct generic."
snippet = '''
struct ${1:Holder}<T: ${2:Trait}> {
    ${3:inner}: T,$0
}'''
