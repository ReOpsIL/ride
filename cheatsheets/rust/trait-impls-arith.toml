[[entries]]
name = "impl Index<Range>"
keys = ["impl", "index", "range", "slice", "brackets", "subrange", "operator"]
doc = "Support slicing syntax on the type by indexing with a range."
snippet = '''
impl std::ops::Index<std::ops::Range<usize>> for ${1:Type} {
    type Output = [${2:T}];

    fn index(&self, range: std::ops::Range<usize>) -> &[${2:T}] {
        &self.${3:items}[range]$0
    }
}'''

[[entries]]
name = "impl IndexMut"
keys = ["impl", "indexmut", "index", "mutable", "brackets", "assign", "operator"]
doc = "Allow assignment through the indexing operator; requires an Index impl."
snippet = '''
impl std::ops::IndexMut<${1:usize}> for ${2:Type} {
    fn index_mut(&mut self, ${3:i}: ${1:usize}) -> &mut Self::Output {
        &mut self.${4:items}[${3:i}]$0
    }
}'''

[[entries]]
name = "impl Index with 2D key"
keys = ["impl", "index", "tuple", "grid", "matrix", "row", "col", "2d"]
doc = "Index a grid type with a (row, col) tuple."
snippet = '''
impl std::ops::Index<(usize, usize)> for ${1:Grid} {
    type Output = ${2:f64};

    fn index(&self, (${3:row}, ${4:col}): (usize, usize)) -> &${2:f64} {
        &self.${5:cells}[${3:row} * self.${6:width} + ${4:col}]$0
    }
}'''
