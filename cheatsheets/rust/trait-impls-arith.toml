title = "Standard trait impls: arithmetic operators"
contexts = ["item"]

[[entries]]
name = "impl Add"
keys = ["impl", "add", "plus", "operator", "overload", "sum", "vector"]
doc = "Overload + for two values of the type."
snippet = '''
impl std::ops::Add for ${1:Vec2} {
    type Output = Self;

    fn add(self, rhs: Self) -> Self {
        Self { ${2:x}: self.${2:x} + rhs.${2:x}, ${3:y}: self.${3:y} + rhs.${3:y} }$0
    }
}'''

