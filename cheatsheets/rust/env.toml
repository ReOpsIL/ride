title = "Environment and arguments"
contexts = ["statement", "expression"]

[[entries]]
name = "env::args"
keys = ["env", "args", "argv", "arguments", "cli", "collect", "vec", "command", "line"]
doc = "Collect command line arguments, the first being the program name."
snippet = '''
let ${1:args}: Vec<String> = std::env::args().collect();$0'''

[[entries]]
name = "env::args skip program name"
keys = ["env", "args", "skip", "first", "cli", "program", "name", "rest"]
doc = "Collect only the real arguments, skipping the program name."
snippet = '''
let ${1:args}: Vec<String> = std::env::args().skip(1).collect();$0'''

[[entries]]
name = "env::args nth"
keys = ["env", "args", "nth", "first", "cli", "one", "single", "required"]
doc = "Take the first real command line argument."
snippet = '''
let ${1:arg} = std::env::args().nth(${2:1}).${3:expect("usage: prog <arg>")};$0'''

[[entries]]
name = "args with default"
keys = ["args", "default", "optional", "unwrap_or", "nth", "cli", "fallback"]
doc = "Read an optional argument with a fallback value."
snippet = '''
let ${1:arg} = std::env::args().nth(${2:1}).unwrap_or_else(|| "${3:default}".to_string());$0'''

[[entries]]
name = "args slice pattern"
keys = ["args", "slice", "pattern", "match", "usage", "let", "else", "destructure"]
doc = "Destructure the arguments with a slice pattern and print usage otherwise."
snippet = '''
let args: Vec<String> = std::env::args().collect();
let [_, ${1:input}, ${2:output}] = args.as_slice() else {
    eprintln!("usage: {} ${3:<input> <output>}", args[0]);
    std::process::exit(2);
};$0'''

[[entries]]
name = "parse flags loop"
keys = ["args", "flags", "loop", "match", "parse", "options", "cli", "while", "manual"]
doc = "Hand-parse flags and positional arguments with a match loop."
snippet = '''
let mut ${1:args} = std::env::args().skip(1);
while let Some(arg) = ${1:args}.next() {
    match arg.as_str() {
        "-v" | "--verbose" => ${2:verbose = true},
        "-o" | "--output" => ${3:output = args.next()},
        _ => ${4:inputs.push(arg)},
    }
}$0'''

[[entries]]
name = "parse numeric argument"
keys = ["args", "parse", "number", "int", "cli", "usize", "argument", "convert"]
doc = "Parse an argument as a number with an error on bad input."
snippet = '''
let ${1:n}: ${2:usize} = std::env::args().nth(${3:1}).ok_or("${4:missing n}")?.parse()?;$0'''

[[entries]]
name = "env::args_os"
keys = ["args_os", "osstring", "args", "non", "utf8", "path", "raw"]
doc = "Read arguments as OsString so non-UTF-8 paths do not panic."
snippet = '''
let ${1:path} = std::path::PathBuf::from(std::env::args_os().nth(${2:1}).ok_or("${3:usage}")?);$0'''

[[entries]]
name = "clap derive"
keys = ["clap", "derive", "parser", "cli", "args", "struct", "options", "crate"]
doc = "Declare a command line interface as a struct with clap's derive."
snippet = '''
#[derive(clap::Parser)]
struct ${1:Cli} {
    ${2:input}: std::path::PathBuf,
    #[arg(short, long)]
    ${3:verbose}: bool,$0
}
let ${4:cli} = <${1:Cli} as clap::Parser>::parse();'''

[[entries]]
name = "env::var"
keys = ["env", "var", "environment", "variable", "getenv", "read", "string"]
doc = "Read an environment variable at runtime."
snippet = '''
let ${1:value} = std::env::var("${2:NAME}")${3:.unwrap_or_default()};$0'''

[[entries]]
name = "env::var with default"
keys = ["env", "var", "default", "fallback", "unwrap_or_else", "config", "port"]
doc = "Read a variable and fall back to a default when it is unset."
snippet = '''
let ${1:port} = std::env::var("${2:PORT}").unwrap_or_else(|_| "${3:8080}".to_string());$0'''

[[entries]]
name = "env::var parsed"
keys = ["env", "var", "parse", "number", "ok", "and_then", "config", "u16"]
doc = "Read a variable and parse it, ignoring unset or invalid values."
snippet = '''
let ${1:n}: ${2:u16} = std::env::var("${3:NAME}").ok().and_then(|v| v.parse().ok()).unwrap_or(${4:8080});$0'''

[[entries]]
name = "env::var match"
keys = ["env", "var", "match", "ok", "err", "notpresent", "unicode", "handle"]
doc = "Distinguish an unset variable from one with invalid unicode."
snippet = '''
match std::env::var("${1:NAME}") {
    Ok(${2:v}) => $0,
    Err(std::env::VarError::NotPresent) => {}
    Err(std::env::VarError::NotUnicode(_)) => {}
}'''

[[entries]]
name = "env::var_os"
keys = ["env", "var_os", "osstring", "path", "environment", "is_some", "set"]
doc = "Read a variable as OsString, or just test whether it is set."
snippet = '''
std::env::var_os("${1:NAME}")${2:.is_some()}$0'''

[[entries]]
name = "env::set_var"
keys = ["env", "set_var", "environment", "setenv", "set", "unsafe"]
doc = "Set an environment variable for this process, unsafe in edition 2024."
snippet = '''
unsafe { std::env::set_var("${1:NAME}", ${2:"value"}) };$0'''

[[entries]]
name = "env::remove_var"
keys = ["env", "remove_var", "unset", "environment", "delete", "unsafe"]
doc = "Remove an environment variable from this process."
snippet = '''
unsafe { std::env::remove_var("${1:NAME}") };$0'''

[[entries]]
name = "env::vars iterate"
keys = ["env", "vars", "iterate", "all", "environment", "list", "print", "for"]
doc = "Iterate over every environment variable."
snippet = '''
for (${1:key}, ${2:value}) in std::env::vars() {
    $0
}'''

[[entries]]
name = "env::current_dir"
keys = ["env", "current_dir", "cwd", "pwd", "directory", "working"]
doc = "Get the current working directory."
snippet = '''
std::env::current_dir()?$0'''

[[entries]]
name = "env::set_current_dir"
keys = ["env", "set_current_dir", "chdir", "cd", "change", "directory"]
doc = "Change the process working directory."
snippet = '''
std::env::set_current_dir(${1:path})?;$0'''

[[entries]]
name = "env::current_exe"
keys = ["env", "current_exe", "executable", "binary", "path", "self", "location"]
doc = "Path of the running executable, useful to find sibling files."
snippet = '''
let ${1:exe_dir} = std::env::current_exe()?.parent().map(|p| p.to_path_buf());$0'''

[[entries]]
name = "env::temp_dir"
keys = ["env", "temp_dir", "tmp", "temporary", "directory", "scratch"]
doc = "The system temporary directory."
snippet = '''
std::env::temp_dir()$0'''

[[entries]]
name = "home directory"
keys = ["home", "directory", "env", "user", "config", "dotfile", "userprofile"]
doc = "Locate the home directory from HOME, or USERPROFILE on Windows."
snippet = '''
let ${1:home} = std::env::var_os("HOME").or_else(|| std::env::var_os("USERPROFILE")).map(std::path::PathBuf::from).ok_or("${2:no home}")?;$0'''

[[entries]]
name = "env::consts OS / ARCH"
keys = ["env", "consts", "os", "arch", "platform", "target", "family", "detect"]
doc = "Compile-time constants naming the OS and architecture."
snippet = '''
std::env::consts::${1:OS}$0'''

[[entries]]
name = "compile-time env!"
keys = ["env", "macro", "compile", "time", "cargo", "version", "manifest", "pkg"]
doc = "Read a cargo-provided variable at compile time, such as the crate version."
snippet = '''
env!("${1:CARGO_PKG_VERSION}")$0'''
