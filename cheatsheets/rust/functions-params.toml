title = "Function parameters"
contexts = ["item", "body"]

[[entries]]
name = "pub(crate) fn"
keys = ["pub", "crate", "fn", "function", "internal", "visibility"]
doc = "Define a function callable anywhere in the crate but hidden from its users."
snippet = '''
pub(crate) fn ${1:name}(${2:arg}: ${3:Type}) -> ${4:ReturnType} {
    $0
}'''

[[entries]]
name = "fn borrowed args"
keys = ["fn", "str", "slice", "borrow", "reference", "argument", "idiomatic"]
doc = "Take borrowed views so callers can pass a String, Vec, array or literal without moving."
snippet = '''
fn ${1:name}(${2:text}: &str, ${3:items}: &[${4:i32}]) -> ${5:usize} {
    $0
}'''

[[entries]]
name = "fn taking ownership"
keys = ["fn", "own", "move", "string", "vec", "consume", "argument"]
doc = "Take an owned value that the function keeps or transforms, moving it from the caller."
snippet = '''
fn ${1:name}(${2:text}: String) -> ${3:String} {
    $0
}'''

[[entries]]
name = "fn &mut argument"
keys = ["fn", "mut", "reference", "modify", "inplace", "argument", "out"]
doc = "Take a mutable reference to modify the caller's value in place."
snippet = '''
fn ${1:name}(${2:items}: &mut Vec<${3:i32}>) {
    ${2:items}.push($0);
}'''

[[entries]]
name = "fn mut parameter"
keys = ["fn", "mut", "parameter", "local", "reassign", "argument"]
doc = "Declare a by-value parameter mutable so the body can reassign it."
snippet = '''
fn ${1:name}(mut ${2:count}: ${3:u32}) -> ${3:u32} {
    ${2:count} += ${4:1};
    ${2:count}$0
}'''

[[entries]]
name = "fn optional argument"
keys = ["fn", "option", "optional", "default", "argument", "none", "unwrap_or"]
doc = "Emulate a default argument by taking an Option and filling in the fallback."
snippet = '''
fn ${1:name}(${2:value}: ${3:i32}, ${4:limit}: Option<${5:usize}>) {
    let ${4:limit} = ${4:limit}.unwrap_or(${6:10});
    $0
}'''

[[entries]]
name = "fn tuple parameter"
keys = ["fn", "tuple", "destructure", "pattern", "parameter", "pair"]
doc = "Destructure a tuple argument directly in the parameter list."
snippet = '''
fn ${1:name}((${2:x}, ${3:y}): (${4:i32}, ${4:i32})) -> ${4:i32} {
    $0
}'''

[[entries]]
name = "fn struct parameter destructured"
keys = ["fn", "struct", "destructure", "pattern", "parameter", "fields"]
doc = "Destructure a struct argument into its fields in the parameter list."
snippet = '''
fn ${1:name}(&${2:Point} { ${3:x}, ${4:y} }: &${2:Point}) -> ${5:f64} {
    $0
}'''

[[entries]]
name = "fn generic multiple bounds"
keys = ["fn", "generic", "bound", "plus", "multiple", "traits", "debug", "clone"]
doc = "Require several traits on one generic parameter with a plus sign."
snippet = '''
fn ${1:name}<T: ${2:Clone} + ${3:std::fmt::Debug}>(${4:value}: &T) -> ${5:T} {
    $0
}'''

[[entries]]
name = "fn two generic parameters"
keys = ["fn", "generic", "two", "multiple", "t", "u", "parameters"]
doc = "Define a function generic over two independent types."
snippet = '''
fn ${1:name}<T, U>(${2:a}: T, ${3:b}: U) -> (T, U) {
    (${2:a}, ${3:b})$0
}'''

[[entries]]
name = "fn const generic"
keys = ["fn", "const", "generic", "array", "n", "size", "length"]
doc = "Accept arrays of any fixed length through a const generic parameter."
snippet = '''
fn ${1:name}<const ${2:N}: usize>(${3:items}: [${4:i32}; ${2:N}]) -> ${5:usize} {
    $0
}'''

[[entries]]
name = "fn lifetime and generic"
keys = ["fn", "lifetime", "generic", "borrow", "slice", "t", "reference"]
doc = "Combine a lifetime and a type parameter, listing the lifetime first."
snippet = '''
fn ${1:name}<'a, T>(${2:items}: &'a [T]) -> Option<&'a T> {
    $0
}'''

[[entries]]
name = "fn impl Into<String> arg"
keys = ["fn", "into", "string", "impl", "argument", "flexible", "generic"]
doc = "Accept both &str and String by converting the argument on entry."
snippet = '''
fn ${1:name}(${2:name}: impl Into<String>) -> ${3:Self} {
    let ${2:name} = ${2:name}.into();
    $0
}'''

[[entries]]
name = "fn impl AsRef<Path> arg"
keys = ["fn", "asref", "path", "str", "impl", "argument", "generic", "file"]
doc = "Accept anything that can be viewed as a Path, such as &str, String or PathBuf."
snippet = '''
fn ${1:name}(${2:path}: impl AsRef<std::path::Path>) -> std::io::Result<${3:String}> {
    let ${2:path} = ${2:path}.as_ref();
    $0
}'''

[[entries]]
name = "fn impl FnMut arg"
keys = ["fn", "fnmut", "closure", "callback", "impl", "mutable", "argument"]
doc = "Accept a closure that may mutate its captures, calling it repeatedly."
snippet = '''
fn ${1:name}(mut ${2:f}: impl FnMut(${3:i32})) {
    for ${4:i} in ${5:0..10} {
        ${2:f}(${4:i});$0
    }
}'''

[[entries]]
name = "fn boxed closure arg"
keys = ["fn", "box", "dyn", "closure", "callback", "argument", "stored"]
doc = "Take an owned boxed closure, typically to store it in a struct."
snippet = '''
fn ${1:name}(${2:callback}: Box<dyn Fn(${3:&str}) ${4:+ Send}>) {
    $0
}'''

[[entries]]
name = "fn 'static bound"
keys = ["fn", "static", "bound", "send", "thread", "spawn", "generic"]
doc = "Require a generic argument to own its data and be sendable, as thread spawning does."
snippet = '''
fn ${1:name}<T: ${2:Send} + 'static>(${3:value}: T) {
    $0
}'''

[[entries]]
name = "fn ?Sized bound"
keys = ["fn", "sized", "unsized", "dyn", "str", "generic", "bound"]
doc = "Allow unsized types such as str or dyn Trait behind a reference."
snippet = '''
fn ${1:name}<T: ${2:std::fmt::Display} + ?Sized>(${3:value}: &T) {
    $0
}'''

[[entries]]
name = "fn with attributes"
keys = ["fn", "inline", "must_use", "attribute", "annotate"]
doc = "Annotate a function so its result must be used and it is inlined."
snippet = '''
#[inline]
#[must_use]
pub fn ${1:name}(${2:args}) -> ${3:ReturnType} {
    $0
}'''

[[entries]]
name = "fn with doc comment"
keys = ["fn", "doc", "comment", "documentation", "rustdoc", "example"]
doc = "Document a public function with a summary line and an example block."
snippet = '''
/// ${1:One-line summary.}
///
/// # Examples
///
/// ```
/// ${2:assert_eq!(name(1), 2);}
/// ```
pub fn ${3:name}(${4:args}) -> ${5:ReturnType} {
    $0
}'''
