title = "Types: std utilities, time, paths and I/O"
contexts = ["type"]

[[entries]]
name = "OnceCell<T>"
keys = ["oncecell", "once", "lazy", "init", "cell", "single", "cache"]
doc = "Single-threaded cell written at most once, for lazy initialization."
snippet = '''
std::cell::OnceCell<${1:T}>$0'''

[[entries]]
name = "OnceLock<T>"
keys = ["oncelock", "once", "lazy", "static", "global", "thread", "init"]
doc = "Thread-safe cell written at most once, the usual type of a lazily set static."
snippet = '''
std::sync::OnceLock<${1:T}>$0'''

[[entries]]
name = "LazyLock<T>"
keys = ["lazylock", "lazy", "static", "global", "init", "thread", "closure"]
doc = "Thread-safe value computed on first access from a closure given at definition."
snippet = '''
std::sync::LazyLock<${1:T}>$0'''

[[entries]]
name = "Pin<&mut T>"
keys = ["pin", "mut", "future", "poll", "async", "self"]
doc = "Pinned exclusive reference, the receiver type of Future::poll."
snippet = '''
Pin<&mut ${1:Self}>$0'''

[[entries]]
name = "Pin<Box<T>>"
keys = ["pin", "box", "heap", "future", "async", "selfref"]
doc = "Heap value that promises never to move, produced by Box::pin."
snippet = '''
Pin<Box<${1:T}>>$0'''

[[entries]]
name = "MaybeUninit<T>"
keys = ["maybeuninit", "uninit", "uninitialized", "unsafe", "buffer", "ffi"]
doc = "Storage for a T that may not be initialized yet, for FFI and manual init."
snippet = '''
std::mem::MaybeUninit<${1:T}>$0'''

[[entries]]
name = "ManuallyDrop<T>"
keys = ["manuallydrop", "drop", "leak", "manual", "destructor", "unsafe"]
doc = "Wrapper that suppresses the automatic destructor of its contents."
snippet = '''
std::mem::ManuallyDrop<${1:T}>$0'''

[[entries]]
name = "NonZeroU32 and friends"
keys = ["nonzero", "nonzerou32", "nonzerousize", "niche", "option", "zero"]
doc = "Integer that is never zero, letting Option of it stay the same size."
