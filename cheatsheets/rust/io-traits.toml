title = "Read and Write traits, binary and text parsing"
contexts = ["statement", "expression", "item"]

[[entries]]
name = "fn taking impl Read"
keys = ["read", "impl", "generic", "reader", "parameter", "fn", "arg", "any"]
doc = "Accept any reader, so the function works on files, stdin and buffers."
snippet = '''
fn ${1:parse}<R: std::io::Read>(mut ${2:reader}: R) -> std::io::Result<${3:T}> {
    $0
}'''

[[entries]]
name = "fn taking impl BufRead"
keys = ["bufread", "impl", "lines", "reader", "parameter", "fn", "generic"]
doc = "Accept a buffered reader so lines and read_line are available."
snippet = '''
fn ${1:parse}(${2:reader}: impl std::io::BufRead) -> std::io::Result<${3:T}> {
    for line in ${2:reader}.lines() {
        let line = line?;
        $0
    }
}'''

[[entries]]
name = "fn taking impl Write"
keys = ["write", "impl", "writer", "parameter", "fn", "generic", "output", "render"]
doc = "Write output to any writer, so tests can capture it in a Vec."
snippet = '''
fn ${1:render}(${2:out}: &mut impl std::io::Write) -> std::io::Result<()> {
    writeln!(${2:out}, "${3:text}")?;
    Ok(())
}'''

[[entries]]
name = "fn taking &mut dyn Write"
keys = ["dyn", "write", "writer", "trait", "object", "parameter", "fn"]
doc = "Take a writer as a trait object to avoid a generic."
snippet = '''
fn ${1:render}(${2:out}: &mut dyn std::io::Write) -> std::io::Result<()> {
    $0
}'''

[[entries]]
name = "impl Read"
keys = ["impl", "read", "trait", "reader", "custom", "source", "struct"]
doc = "Implement Read for a type by filling the caller's buffer."
snippet = '''
impl std::io::Read for ${1:Type} {
    fn read(&mut self, buf: &mut [u8]) -> std::io::Result<usize> {
        $0
    }
}'''

[[entries]]
name = "impl Write"
keys = ["impl", "write", "trait", "writer", "custom", "sink", "struct", "flush"]
doc = "Implement Write for a type with write and flush."
snippet = '''
impl std::io::Write for ${1:Type} {
    fn write(&mut self, buf: &[u8]) -> std::io::Result<usize> {
        $0
        Ok(buf.len())
    }

    fn flush(&mut self) -> std::io::Result<()> {
        Ok(())
    }
}'''

