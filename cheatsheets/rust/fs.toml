[[entries]]
name = "copy directory recursively"
keys = ["copy", "directory", "recursive", "tree", "cp", "clone", "folder"]
doc = "Copy a directory tree by recursing over its entries."
snippet = '''
fn ${1:copy_dir}(from: &std::path::Path, to: &std::path::Path) -> std::io::Result<()> {
    std::fs::create_dir_all(to)?;
    for entry in std::fs::read_dir(from)? {
        let entry = entry?;
        let target = to.join(entry.file_name());
        if entry.file_type()?.is_dir() {
            ${1:copy_dir}(&entry.path(), &target)?;
        } else {
            std::fs::copy(entry.path(), target)?;$0
        }
    }
    Ok(())
}'''

