for entry in std::fs::read_dir(${1:dir})? {
    let ${2:path} = entry?.path();
    $0
}'''

[[entries]]
name = "read_dir filter by extension"
keys = ["read_dir", "filter", "extension", "files", "only", "glob", "list", "rs"]
doc = "List files in a directory with a given extension."
snippet = '''
let ${1:files}: Vec<std::path::PathBuf> = std::fs::read_dir(${2:dir})?
    .filter_map(Result::ok)
    .map(|e| e.path())
    .filter(|p| p.extension().is_some_and(|e| e == "${3:rs}"))
    .collect();$0'''

[[entries]]
name = "recursive directory walk"
keys = ["walk", "recursive", "directory", "tree", "visit", "read_dir", "subdirs", "find"]
doc = "Visit every file under a directory recursively."
snippet = '''
fn ${1:walk}(dir: &std::path::Path, ${2:out}: &mut Vec<std::path::PathBuf>) -> std::io::Result<()> {
    for entry in std::fs::read_dir(dir)? {
        let path = entry?.path();
        if path.is_dir() {
            ${1:walk}(&path, ${2:out})?;
        } else {
            ${2:out}.push(path);$0
        }
    }
    Ok(())
}'''

