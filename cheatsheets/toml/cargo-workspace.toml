title = "Workspace"
contexts = ["table", "key"]

[[entries]]
name = "[workspace]"
keys = ["workspace", "members", "resolver"]
doc = "A virtual or root workspace listing member packages."
snippet = '''
[workspace]
members = ["${1:crates/*}"]
resolver = "${2:3}"
$0'''

[[entries]]
name = "members"
keys = ["members", "crates", "packages", "glob"]
doc = "Package directories in this workspace; globs are allowed."
snippet = '''
members = ["${1:crates/*}"]$0'''

[[entries]]
name = "exclude"
keys = ["exclude", "skip", "members"]
doc = "Paths matched by members that should not be packages."
snippet = '''
exclude = ["${1:crates/skip}"]$0'''

[[entries]]
name = "resolver"
keys = ["resolver", "edition", "features", "v2", "v3"]
doc = "Feature resolver version; 3 is the default for the 2024 edition."
snippet = '''
resolver = "${1:3}"$0'''

[[entries]]
name = "[workspace.package]"
keys = ["workspace", "package", "inherit", "edition"]
doc = "Shared package fields that members inherit with key.workspace = true."
snippet = '''
[workspace.package]
edition = "${1:2024}"
license = "${2:MIT OR Apache-2.0}"
rust-version = "${3:1.85}"
$0'''

[[entries]]
name = "[workspace.dependencies]"
keys = ["workspace", "dependencies", "shared", "inherit"]
doc = "Shared dependency specs that members inherit with crate.workspace = true."
snippet = '''
[workspace.dependencies]
${1:crate} = "${2:1.0}"
$0'''

[[entries]]
name = "[workspace.lints]"
keys = ["workspace", "lints", "clippy", "rust"]
doc = "Shared lint levels that members inherit with lints.workspace = true."
snippet = '''
[workspace.lints.rust]
${1:unsafe_code} = "${2:forbid}"
$0'''

[[entries]]
name = "workspace = true"
keys = ["workspace", "inherit", "package"]
doc = "Inherit this field from [workspace.package] or [workspace.dependencies]."
snippet = '''
${1:edition}.workspace = true$0'''

[[entries]]
name = "lints.workspace"
keys = ["lints", "workspace", "inherit"]
doc = "Inherit lint tables from [workspace.lints]."
snippet = '''
[lints]
workspace = true
$0'''
