title = "Ranges"
contexts = ["statement", "expression"]

[[entries]]
name = "ranges::sort"
keys = ["sort", "ranges", "std::ranges"]
doc = "C++20 sort taking the whole range."
snippet = """
std::ranges::sort(${1:v});$0"""

[[entries]]
name = "ranges::sort by projection"
keys = ["sort", "ranges", "projection", "member"]
doc = "Sort by a member using a projection."
