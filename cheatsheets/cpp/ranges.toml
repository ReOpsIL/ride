title = "Range algorithms"
contexts = ["statement", "expression"]

[[entries]]
name = "ranges::sort"
keys = ["sort", "ranges", "std::ranges", "order", "whole"]
doc = "C++20 sort taking the whole range instead of an iterator pair."
snippet = '''
std::ranges::sort(${1:v});$0'''

[[entries]]
name = "ranges::sort descending"
keys = ["sort", "ranges", "descending", "greater", "reverse", "comparator"]
doc = "Sort a whole range from largest to smallest."
snippet = '''
std::ranges::sort(${1:v}, std::ranges::greater());$0'''

[[entries]]
name = "ranges::sort by projection"
keys = ["sort", "ranges", "projection", "member", "by", "field", "key"]
doc = "Sort by a member using a projection instead of a comparator lambda."
snippet = '''
std::ranges::sort(${1:v}, {}, &${2:Type}::${3:member});$0'''

[[entries]]
name = "ranges::find"
keys = ["find", "ranges", "std::ranges", "search", "value", "locate"]
doc = "Find a value in a whole range."
snippet = '''
auto ${1:it} = std::ranges::find(${2:v}, ${3:value});$0'''

[[entries]]
name = "ranges::find by projection"
keys = ["find", "ranges", "projection", "member", "by", "field", "id"]
doc = "Find the element whose projected member equals a value."
snippet = '''
auto ${1:it} = std::ranges::find(${2:v}, ${3:value}, &${4:Type}::${5:member});$0'''

[[entries]]
name = "ranges::find_if"
keys = ["find_if", "ranges", "predicate", "first", "matching", "lambda"]
doc = "Find the first element matching a predicate."
snippet = '''
auto ${1:it} = std::ranges::find_if(${2:v}, [](${3:const auto &x}) { return ${4:cond}; });$0'''

[[entries]]
name = "ranges::contains"
keys = ["contains", "ranges", "exists", "has", "in", "member", "c++23"]
doc = "C++23 membership test on any range."
snippet = '''
std::ranges::contains(${1:v}, ${2:value})$0'''

[[entries]]
name = "ranges::for_each"
keys = ["for_each", "ranges", "each", "apply", "visit", "lambda"]
doc = "Call a function on every element of a range."
snippet = '''
std::ranges::for_each(${1:v}, [](${2:auto &x}) { $0 });'''

[[entries]]
name = "ranges::transform"
keys = ["transform", "ranges", "map", "apply", "convert", "output"]
doc = "Apply a function to a whole range, writing to an output iterator."
snippet = '''
std::ranges::transform(${1:v}, ${2:out}.begin(), [](${3:const auto &x}) { return ${4:x}; });$0'''

[[entries]]
name = "ranges::count / count_if"
keys = ["count", "count_if", "ranges", "occurrences", "how many", "predicate"]
doc = "Count elements equal to a value or matching a predicate."
snippet = '''
std::ranges::count_if(${1:v}, [](${2:const auto &x}) { return ${3:cond}; })$0'''

[[entries]]
name = "ranges::any_of"
keys = ["any_of", "all_of", "none_of", "ranges", "predicate", "every", "some"]
doc = "Test a predicate over a whole range."
snippet = '''
std::ranges::${1:any_of}(${2:v}, [](${3:const auto &x}) { return ${4:cond}; })$0'''

[[entries]]
name = "ranges::max_element"
keys = ["max_element", "min_element", "ranges", "largest", "smallest", "iterator"]
doc = "Iterator to the largest (or smallest) element of a range."
snippet = '''
auto ${1:it} = std::ranges::${2:max_element}(${3:v});$0'''

[[entries]]
name = "ranges::max / min value"
keys = ["max", "min", "ranges", "value", "largest", "smallest", "projection"]
doc = "Largest or smallest value of a range, optionally by projection."
snippet = '''
auto ${1:best} = std::ranges::${2:max}(${3:v}, {}, &${4:Type}::${5:member});$0'''

[[entries]]
name = "ranges::minmax"
keys = ["minmax", "ranges", "min", "max", "both", "extremes"]
doc = "Both the smallest and largest values of a range."
snippet = '''
auto [${1:lo}, ${2:hi}] = std::ranges::minmax(${3:v});$0'''

[[entries]]
name = "ranges::copy"
keys = ["copy", "ranges", "back_inserter", "clone", "append"]
doc = "Copy a whole range into a container."
snippet = '''
std::ranges::copy(${1:src}, std::back_inserter(${2:dst}));$0'''

[[entries]]
name = "ranges::copy_if"
keys = ["copy_if", "ranges", "filter", "select", "back_inserter"]
doc = "Copy the elements matching a predicate."
snippet = '''
std::ranges::copy_if(${1:src}, std::back_inserter(${2:dst}), [](${3:const auto &x}) { return ${4:cond}; });$0'''

[[entries]]
name = "ranges::fill / reverse / unique"
keys = ["fill", "reverse", "unique", "ranges", "shuffle", "rotate", "in place"]
doc = "In-place range versions of the classic modifying algorithms."
snippet = '''
std::ranges::${1:reverse}(${2:v});$0'''

[[entries]]
name = "ranges::equal"
keys = ["equal", "ranges", "compare", "same", "identical"]
doc = "Test whether two ranges hold equal elements."
snippet = '''
std::ranges::equal(${1:a}, ${2:b})$0'''

[[entries]]
name = "ranges::binary_search / lower_bound"
keys = ["binary_search", "lower_bound", "upper_bound", "ranges", "sorted", "search"]
doc = "Binary search helpers over a whole sorted range."
snippet = '''
std::ranges::${1:lower_bound}(${2:v}, ${3:value})$0'''

[[entries]]
name = "ranges::fold_left"
keys = ["fold_left", "fold", "ranges", "accumulate", "sum", "reduce", "c++23"]
doc = "C++23 left fold over a range, like accumulate."
snippet = '''
std::ranges::fold_left(${1:v}, ${2:0}, std::plus<>())$0'''

[[entries]]
name = "ranges::distance / size"
keys = ["distance", "size", "ranges", "count", "length", "begin", "end"]
doc = "Customization-point access to a range's size, iterators or distance."
snippet = '''
std::ranges::${1:size}(${2:v})$0'''

[[entries]]
name = "ranges::subrange"
keys = ["subrange", "ranges", "iterator", "pair", "slice", "view"]
doc = "Range built from an iterator pair so it can be piped or iterated."
snippet = '''
std::ranges::subrange(${1:first}, ${2:last})$0'''

[[entries]]
name = "ranges::to"
keys = ["to", "ranges", "collect", "vector", "materialize", "c++23", "convert"]
doc = "C++23 materialize a view into a container."
snippet = '''
auto ${1:out} = ${2:view} | std::ranges::to<std::vector>();$0'''

[[entries]]
name = "vector from view (pre-C++23)"
keys = ["vector", "view", "collect", "materialize", "begin", "end", "c++20"]
doc = "Build a vector from a view with the iterator-pair constructor."
snippet = '''
auto ${1:common} = ${2:view} | std::views::common;
std::vector<${3:int}> ${4:out}(${1:common}.begin(), ${1:common}.end());$0'''

[[entries]]
name = "dangling result"
keys = ["dangling", "ranges", "temporary", "rvalue", "borrowed", "caveat", "iterator"]
doc = "Range algorithms on a temporary return ranges::dangling, so keep the container in a variable first."
snippet = '''
auto ${1:v} = ${2:make_vector()};
auto ${3:it} = std::ranges::find(${1:v}, ${4:value});$0'''
