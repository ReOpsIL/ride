title = "Smart pointers: unique_ptr"
contexts = ["statement", "expression"]

[[entries]]
name = "unique_ptr"
keys = ["unique_ptr", "ptr", "make_unique", "owner", "new", "heap", "allocate"]
doc = "Sole-owner pointer created with make_unique, freed automatically."
snippet = """
auto ${1:p} = std::make_unique<${2:T}>(${3:});$0"""

[[entries]]
name = "unique_ptr declaration"
keys = ["unique_ptr", "ptr", "declare", "empty", "null", "member"]
doc = "Declare an empty unique_ptr, e.g. as a class member."
snippet = """
std::unique_ptr<${1:T}> ${2:p};$0"""

[[entries]]
name = "unique_ptr from new"
keys = ["unique_ptr", "new", "adopt", "wrap", "raw", "take"]
doc = "Take ownership of a raw pointer from new (prefer make_unique)."
snippet = """
std::unique_ptr<${1:T}> ${2:p}(new ${1:T}(${3:}));$0"""

[[entries]]
name = "unique_ptr typed"
keys = ["unique_ptr", "ptr", "typed", "explicit", "make_unique", "declare"]
doc = "unique_ptr with the type written out instead of auto."
snippet = """
std::unique_ptr<${1:T}> ${2:p} = std::make_unique<${1:T}>(${3:});$0"""

[[entries]]
name = "unique_ptr to base"
keys = ["unique_ptr", "base", "derived", "polymorphic", "virtual", "interface"]
doc = "Own a derived object through a pointer to its base."
snippet = """
std::unique_ptr<${1:Base}> ${2:p} = std::make_unique<${3:Derived}>(${4:});$0"""

[[entries]]
name = "unique_ptr array"
keys = ["unique_ptr", "array", "make_unique", "buffer", "[]", "dynamic"]
doc = "Owning pointer to a dynamically sized array (prefer std::vector)."
snippet = """
auto ${1:buf} = std::make_unique<${2:int}[]>(${3:n});$0"""

[[entries]]
name = "make_unique_for_overwrite"
keys = ["make_unique_for_overwrite", "unique_ptr", "uninitialized", "buffer", "array", "c++20"]
doc = "C++20 allocate without value-initializing, for buffers filled later."
snippet = """
auto ${1:buf} = std::make_unique_for_overwrite<${2:char}[]>(${3:n});$0"""

[[entries]]
name = "unique_ptr dereference"
keys = ["unique_ptr", "deref", "*", "->", "access", "member", "use"]
doc = "Use the object through * or -> like a raw pointer."
snippet = """
${1:p}->${2:method}()$0"""

[[entries]]
name = "unique_ptr null check"
keys = ["unique_ptr", "null", "check", "if", "empty", "bool", "has"]
doc = "A smart pointer converts to bool: true when it owns an object."
snippet = """
if (${1:p}) {
    $0
}"""

[[entries]]
name = "release"
keys = ["release", "unique_ptr", "raw", "give up", "detach", "ownership"]
doc = "Give up ownership and return the raw pointer, which must then be freed manually."
snippet = """
${1:T} *${2:raw} = ${3:p}.release();$0"""

[[entries]]
name = "reset"
keys = ["reset", "unique_ptr", "shared_ptr", "replace", "delete", "free", "null"]
doc = "Replace the managed object, destroying the old one; no argument frees it."
snippet = """
${1:p}.reset(${2:});$0"""

[[entries]]
name = "get"
keys = ["get", "raw", "pointer", "borrow", "non-owning", "c api"]
doc = "Raw pointer without transferring ownership, for APIs that take T*."
snippet = """
${1:p}.get()$0"""

[[entries]]
name = "swap smart pointers"
keys = ["swap", "unique_ptr", "shared_ptr", "exchange", "ptr"]
doc = "Exchange the objects owned by two pointers."
snippet = """
${1:a}.swap(${2:b});$0"""

[[entries]]
name = "move ownership"
keys = ["move", "unique_ptr", "transfer", "give", "std::move", "ownership"]
doc = "Transfer a unique_ptr to another owner; the source becomes null."
snippet = """
auto ${1:dst} = std::move(${2:src});$0"""

[[entries]]
name = "unique_ptr pass by reference"
keys = ["unique_ptr", "pass", "reference", "parameter", "function", "borrow"]
doc = "Function that may reseat the pointer takes it by non-const reference."
snippet = """
void ${1:name}(std::unique_ptr<${2:T}> &${3:p}) {
    $0
}"""

[[entries]]
name = "unique_ptr pass by value (sink)"
keys = ["unique_ptr", "sink", "take", "ownership", "parameter", "move", "pass"]
doc = "Function that takes ownership receives the unique_ptr by value; call it with std::move."
snippet = """
void ${1:take}(std::unique_ptr<${2:T}> ${3:p}) {
    $0
}"""

[[entries]]
name = "pass raw pointer or reference"
keys = ["raw", "pointer", "reference", "borrow", "non-owning", "parameter", "when"]
doc = "Functions that only use the object take T& or T* and get p.get() or *p."
snippet = """
void ${1:use}(${2:const T &}${3:value}) {
    $0
}"""

[[entries]]
name = "return unique_ptr"
keys = ["unique_ptr", "return", "factory", "function", "create", "make"]
doc = "Factory function returning ownership; no std::move needed on return."
snippet = """
std::unique_ptr<${1:T}> ${2:create}(${3:}) {
    return std::make_unique<${1:T}>(${4:});
}$0"""

[[entries]]
name = "unique_ptr in vector"
keys = ["unique_ptr", "vector", "container", "push_back", "emplace_back", "list", "owning"]
doc = "Vector of owning pointers; insert with make_unique or std::move."
snippet = """
std::vector<std::unique_ptr<${1:T}>> ${2:items};
${2:items}.push_back(std::make_unique<${1:T}>(${3:}));$0"""

[[entries]]
name = "custom deleter"
keys = ["unique_ptr", "deleter", "fclose", "free", "c api", "handle", "resource"]
doc = "unique_ptr that calls a custom function to release the resource."
snippet = """
std::unique_ptr<${1:FILE}, decltype(&${2:fclose})> ${3:p}(${4:fopen(path, "r")}, &${2:fclose});$0"""

[[entries]]
name = "custom deleter lambda"
keys = ["unique_ptr", "deleter", "lambda", "release", "handle", "resource"]
doc = "unique_ptr with a lambda deleter."
snippet = """
auto ${1:del} = [](${2:T} *p) { ${3:release(p)}; };
std::unique_ptr<${2:T}, decltype(${1:del})> ${4:p}(${5:acquire()}, ${1:del});$0"""

[[entries]]
name = "custom deleter struct"
keys = ["unique_ptr", "deleter", "struct", "functor", "alias", "handle", "reusable"]
doc = "Reusable deleter type so the pointer type stays nameable."
snippet = """
struct ${1:Deleter} {
    void operator()(${2:T} *p) const { ${3:release(p)}; }
};
using ${4:Handle} = std::unique_ptr<${2:T}, ${1:Deleter}>;$0"""

[[entries]]
name = "pimpl idiom"
keys = ["pimpl", "impl", "unique_ptr", "hide", "private", "implementation", "header"]
doc = "Hide implementation details behind a unique_ptr to a forward-declared struct."
snippet = """
class ${1:Widget} {
public:
    ${1:Widget}();
    ~${1:Widget}();
    $0
private:
    struct Impl;
    std::unique_ptr<Impl> impl_;
};"""
