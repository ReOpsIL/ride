title = "Mutexes and condition variables"
contexts = ["statement"]

[[entries]]
name = "std::mutex"
keys = ["mutex", "lock", "sync", "mutual", "exclusion", "guard", "declare"]
doc = "Mutual exclusion lock, usually a class member next to the data it guards."
snippet = '''
std::mutex ${1:mtx};$0'''

[[entries]]
name = "lock_guard"
keys = ["lock_guard", "mutex", "lock", "raii", "scope", "critical", "section"]
doc = "Lock a mutex for the rest of the scope."
snippet = '''
std::lock_guard<std::mutex> ${1:lock}(${2:mtx});$0'''

[[entries]]
name = "critical section block"
keys = ["lock", "block", "scope", "critical", "section", "braces", "lock_guard", "mutex"]
doc = "Hold the lock only for the braces, then release before continuing."
snippet = '''
{
    std::lock_guard<std::mutex> ${1:lock}(${2:mtx});
    $0
}'''

[[entries]]
name = "unique_lock"
keys = ["unique_lock", "mutex", "lock", "condition", "movable", "unlock", "flexible"]
doc = "Movable lock that can be unlocked early or used with a condition variable."
snippet = '''
std::unique_lock<std::mutex> ${1:lock}(${2:mtx});$0'''

[[entries]]
name = "unique_lock unlock / relock"
keys = ["unique_lock", "unlock", "lock", "early", "release", "manual", "reacquire"]
doc = "Release a unique_lock early and take it again later."
snippet = '''
${1:lock}.unlock();
$0
${1:lock}.lock();'''

[[entries]]
name = "scoped_lock"
keys = ["scoped_lock", "mutex", "lock", "deadlock", "several", "multiple", "two", "c++17"]
doc = "Lock several mutexes at once in a deadlock-free order."
snippet = '''
std::scoped_lock ${1:lock}(${2:mtx1}, ${3:mtx2});$0'''

[[entries]]
name = "std::lock with defer_lock"
keys = ["std::lock", "defer_lock", "unique_lock", "deadlock", "two", "mutexes", "ordering"]
doc = "Lock two mutexes without deadlock using deferred unique_locks."
snippet = '''
std::unique_lock<std::mutex> ${1:a}(${2:mtx1}, std::defer_lock);
std::unique_lock<std::mutex> ${3:b}(${4:mtx2}, std::defer_lock);
std::lock(${1:a}, ${3:b});$0'''

[[entries]]
name = "try_lock"
keys = ["try_lock", "mutex", "lock", "non-blocking", "attempt", "busy"]
doc = "Attempt to lock without blocking."
snippet = '''
if (std::unique_lock<std::mutex> ${1:lock}(${2:mtx}, std::try_to_lock); ${1:lock}) {
    $0
}'''

[[entries]]
name = "recursive_mutex"
keys = ["recursive_mutex", "recursive", "reentrant", "mutex", "same thread", "nested"]
doc = "Mutex the same thread may lock repeatedly, e.g. from nested member calls."
snippet = '''
std::recursive_mutex ${1:mtx};$0'''

[[entries]]
name = "timed_mutex try_lock_for"
keys = ["timed_mutex", "try_lock_for", "try_lock_until", "timeout", "mutex", "wait"]
doc = "Wait for a mutex at most a duration."
snippet = '''
std::timed_mutex ${1:mtx};
if (${1:mtx}.try_lock_for(${2:std::chrono::milliseconds(50)})) {
    $0
    ${1:mtx}.unlock();
}'''

[[entries]]
name = "shared_mutex"
keys = ["shared_mutex", "rwlock", "reader", "writer", "read write", "lock"]
doc = "Reader/writer lock allowing many readers or one writer."
snippet = '''
mutable std::shared_mutex ${1:rw};$0'''

[[entries]]
name = "shared_lock"
keys = ["shared_lock", "shared_mutex", "reader", "read", "lock"]
doc = "Take a shared (read) lock on a shared_mutex."
snippet = '''
std::shared_lock ${1:lock}(${2:rw});$0'''

[[entries]]
name = "exclusive lock on shared_mutex"
keys = ["unique_lock", "shared_mutex", "writer", "write", "exclusive", "lock"]
doc = "Take the exclusive (write) lock on a shared_mutex."
snippet = '''
std::unique_lock ${1:lock}(${2:rw});$0'''

[[entries]]
name = "condition_variable"
keys = ["condition_variable", "cv", "wait", "notify", "declare", "signal"]
doc = "Condition variable, paired with a mutex and a boolean or queue."
snippet = '''
std::condition_variable ${1:cv};$0'''

[[entries]]
name = "condition_variable wait"
keys = ["condition_variable", "cv", "wait", "predicate", "until", "ready", "block"]
doc = "Wait until a predicate becomes true; the predicate guards against spurious wakeups."
snippet = '''
std::unique_lock<std::mutex> ${1:lock}(${2:mtx});
${3:cv}.wait(${1:lock}, [&] { return ${4:ready}; });$0'''

[[entries]]
name = "condition_variable notify"
keys = ["notify_one", "notify_all", "condition_variable", "cv", "signal", "wake"]
doc = "Wake waiting threads after changing state under the lock."
snippet = '''
{
    std::lock_guard<std::mutex> ${1:lock}(${2:mtx});
    ${3:ready = true;}
}
${4:cv}.notify_${5:one}();$0'''

[[entries]]
name = "condition_variable wait_for"
keys = ["wait_for", "condition_variable", "timeout", "cv", "duration", "expire"]
doc = "Wait for a predicate with a timeout; false means it timed out."
snippet = '''
if (${1:cv}.wait_for(${2:lock}, ${3:std::chrono::seconds(1)}, [&] { return ${4:ready}; })) {
    $0
}'''

[[entries]]
name = "condition_variable wait_until"
keys = ["wait_until", "condition_variable", "deadline", "cv", "time point"]
doc = "Wait for a predicate until a deadline."
snippet = '''
if (${1:cv}.wait_until(${2:lock}, ${3:deadline}, [&] { return ${4:ready}; })) {
    $0
}'''

[[entries]]
name = "condition_variable_any with stop_token"
keys = ["condition_variable_any", "stop_token", "wait", "cancel", "jthread", "interruptible"]
doc = "C++20 wait that also wakes when a stop is requested."
snippet = '''
${1:cv}.wait(${2:lock}, ${3:stop_token}, [&] { return ${4:ready}; });$0'''
