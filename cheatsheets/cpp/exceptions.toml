title = "Exceptions and errors"
contexts = ["statement"]

[[entries]]
name = "try catch"
keys = ["try", "catch", "exception"]
doc = "Handle exceptions caught by const reference."
snippet = """
try {
    $0
} catch (const ${1:std::exception} &${2:e}) {
    ${3:std::cerr << e.what() << '\\n';}
}"""

[[entries]]
name = "try catch all"
keys = ["try", "catch", "all", "..."]
doc = "Catch any exception."
snippet = """
try {
    $0
} catch (...) {
    ${1:}
}"""

[[entries]]
name = "try catch multiple"
keys = ["try", "catch", "multiple"]
doc = "Catch specific exceptions before the general case."
snippet = """
try {
    $0
} catch (const ${1:std::out_of_range} &${2:e}) {
    ${3:}
} catch (const std::exception &e) {
    ${4:std::cerr << e.what() << '\\n';}
}"""

[[entries]]
name = "catch"
keys = ["catch", "exception"]
doc = "Additional handler after a try block."
snippet = """
catch (const ${1:std::exception} &${2:e}) {
    $0
}"""

[[entries]]
name = "throw"
keys = ["throw", "raise", "runtime_error"]
doc = "Throw an exception object."
snippet = """
throw ${1:std::runtime_error}("${2:message}");$0"""

[[entries]]
name = "rethrow"
keys = ["throw", "rethrow"]
doc = "Rethrow the exception currently being handled."
snippet = """
throw;$0"""

[[entries]]
name = "standard exceptions"
keys = ["runtime_error", "logic_error", "invalid_argument", "out_of_range", "exception"]
doc = "Common std exceptions: runtime_error, logic_error, invalid_argument, out_of_range, length_error, domain_error."
snippet = """
std::${1:invalid_argument}("${2:message}")$0"""

[[entries]]
name = "custom exception class"
keys = ["exception", "class", "custom", "runtime_error"]
doc = "Exception type derived from std::runtime_error."
snippet = """
class ${1:MyError} : public std::runtime_error {
public:
    using std::runtime_error::runtime_error;
    $0
};"""

[[entries]]
name = "custom exception with what"
keys = ["exception", "class", "what", "custom"]
doc = "Exception type that overrides what()."
snippet = """
class ${1:MyError} : public std::exception {
public:
    const char *what() const noexcept override { return "${2:message}"; }
    $0
};"""

[[entries]]
name = "noexcept"
keys = ["noexcept", "nothrow"]
doc = "Mark a function as never throwing."
snippet = """
noexcept$0"""

[[entries]]
name = "noexcept conditional"
keys = ["noexcept", "conditional", "trait"]
doc = "noexcept that depends on a compile-time condition."
snippet = """
noexcept(${1:std::is_nothrow_move_constructible_v<T>})$0"""

[[entries]]
name = "std::expected"
keys = ["expected", "result", "error", "unexpected"]
doc = "C++23 return a value or an error without exceptions."
snippet = """
std::expected<${1:int}, ${2:std::string}> ${3:result} = ${4:compute()};
if (!${3:result}) {
    ${5:return std::unexpected(result.error());}
}
$0"""

[[entries]]
name = "std::unexpected"
keys = ["unexpected", "expected", "error", "return"]
doc = "Return the error alternative of std::expected."
snippet = """
return std::unexpected(${1:error});$0"""

[[entries]]
name = "expected function"
keys = ["expected", "function", "result", "fn"]
doc = "Function returning std::expected."
snippet = """
std::expected<${1:int}, ${2:std::string}> ${3:name}(${4:}) {
    $0
}"""

[[entries]]
name = "optional error return"
keys = ["optional", "nullopt", "error", "return"]
doc = "Return nullopt to signal absence."
snippet = """
return std::nullopt;$0"""

[[entries]]
name = "std::error_code"
keys = ["error_code", "errc", "system_error"]
doc = "Portable error code with a category."
snippet = """
std::error_code ${1:ec} = std::make_error_code(std::errc::${2:invalid_argument});$0"""

[[entries]]
name = "std::system_error"
keys = ["system_error", "errno", "throw"]
doc = "Throw an exception carrying errno."
snippet = """
throw std::system_error(errno, std::generic_category(), "${1:message}");$0"""

[[entries]]
name = "assert"
keys = ["assert", "cassert", "check"]
doc = "Abort in debug builds when a condition is false."
snippet = """
assert(${1:condition} && "${2:message}");$0"""

[[entries]]
name = "std::terminate"
keys = ["terminate", "abort", "exit"]
doc = "Abort the program immediately."
snippet = """
std::terminate();$0"""

[[entries]]
name = "std::exit"
keys = ["exit", "quit", "exit_failure"]
doc = "Exit the program with a status code."
snippet = """
std::exit(${1:EXIT_FAILURE});$0"""

[[entries]]
name = "RAII cleanup in exceptions"
keys = ["raii", "cleanup", "exception", "guard"]
doc = "Hold resources in objects so unwinding releases them."
snippet = """
{
    ${1:std::lock_guard<std::mutex> lock(mtx);}
    $0
}"""

[[entries]]
name = "std::nested_exception"
keys = ["throw_with_nested", "rethrow_if_nested", "nested"]
doc = "Wrap the current exception inside a new one."
snippet = """
std::throw_with_nested(${1:std::runtime_error}("${2:context}"));$0"""

[[entries]]
name = "std::current_exception"
keys = ["current_exception", "exception_ptr", "rethrow_exception"]
doc = "Capture the in-flight exception to rethrow later."
snippet = """
std::exception_ptr ${1:eptr} = std::current_exception();$0"""

[[entries]]
name = "[[unlikely]] error path"
keys = ["unlikely", "likely", "attribute", "branch"]
doc = "C++20 hint that a branch is rarely taken."
snippet = """
if (${1:error}) [[unlikely]] {
    $0
}"""
