title = "Exceptions"
contexts = ["statement"]

[[entries]]
name = "try catch"
keys = ["try", "catch", "exception", "handle", "error", "const ref"]
doc = "Handle exceptions caught by const reference."
snippet = """
try {
    $0
} catch (const ${1:std::exception} &${2:e}) {
    ${3:std::cerr << e.what() << '\\n';}
}"""

[[entries]]
name = "try catch all"
keys = ["try", "catch", "all", "...", "any", "everything"]
doc = "Catch any exception, including non-std types."
snippet = """
try {
    $0
} catch (...) {
    ${1:}
}"""

[[entries]]
name = "try catch multiple"
keys = ["try", "catch", "multiple", "several", "specific", "order"]
doc = "Catch specific exceptions before the general case; the first matching handler runs."
snippet = """
try {
    $0
} catch (const ${1:std::out_of_range} &${2:e}) {
    ${3:}
} catch (const std::exception &e) {
    ${4:std::cerr << e.what() << '\\n';}
}"""

[[entries]]
name = "try catch by value"
keys = ["try", "catch", "value", "copy", "beginner", "slice"]
doc = "Catch by value copies and slices the exception; prefer const reference."
snippet = """
try {
    $0
} catch (${1:std::exception} ${2:e}) {
    ${3:}
}"""

[[entries]]
name = "catch"
keys = ["catch", "exception", "handler", "another"]
doc = "Additional handler after a try block."
snippet = """
catch (const ${1:std::exception} &${2:e}) {
    $0
}"""

[[entries]]
name = "catch and rethrow"
keys = ["catch", "rethrow", "throw", "cleanup", "log", "propagate"]
doc = "Do something with the exception, then let it continue upward."
snippet = """
catch (const ${1:std::exception} &${2:e}) {
    ${3:log(e.what());}
    throw;$0
}"""

[[entries]]
name = "throw"
keys = ["throw", "raise", "runtime_error", "error", "fail"]
doc = "Throw an exception object; the stack unwinds to the nearest matching catch."
snippet = """
throw ${1:std::runtime_error}("${2:message}");$0"""

[[entries]]
name = "throw with formatted message"
keys = ["throw", "format", "message", "string", "runtime_error", "detail"]
doc = "Throw with a message built from values."
snippet = """
throw ${1:std::runtime_error}(std::format("${2:bad value {\\}}", ${3:value}));$0"""

[[entries]]
name = "throw if"
keys = ["throw", "if", "check", "validate", "guard", "argument"]
doc = "Validate an argument and throw on failure."
snippet = """
if (${1:condition}) {
    throw ${2:std::invalid_argument}("${3:message}");
}$0"""

[[entries]]
name = "rethrow"
keys = ["throw", "rethrow", "propagate", "again", "current"]
doc = "Rethrow the exception currently being handled without copying it."
snippet = """
throw;$0"""

[[entries]]
name = "standard exceptions"
keys = ["runtime_error", "logic_error", "invalid_argument", "out_of_range", "length_error", "domain_error", "exception"]
doc = "Common std exceptions: runtime_error, logic_error, invalid_argument, out_of_range, length_error, domain_error, overflow_error, bad_alloc, bad_cast."
snippet = """
std::${1:invalid_argument}("${2:message}")$0"""

[[entries]]
name = "catch std::bad_alloc"
keys = ["bad_alloc", "bad_cast", "bad_variant_access", "bad_optional_access", "catch", "std"]
doc = "Library-thrown exceptions: bad_alloc, bad_cast, bad_variant_access, bad_optional_access, bad_function_call."
snippet = """
catch (const std::${1:bad_alloc} &${2:e}) {
    $0
}"""

[[entries]]
name = "what()"
keys = ["what", "message", "exception", "text", "describe"]
doc = "Message carried by a std::exception."
snippet = """
${1:e}.what()$0"""

[[entries]]
name = "noexcept"
keys = ["noexcept", "nothrow", "never", "throw", "spec"]
doc = "Mark a function as never throwing; throwing from it calls std::terminate."
snippet = """
noexcept$0"""

[[entries]]
name = "noexcept conditional"
keys = ["noexcept", "conditional", "trait", "depends", "move"]
doc = "noexcept that depends on a compile-time condition."
snippet = """
noexcept(${1:std::is_nothrow_move_constructible_v<T>})$0"""

[[entries]]
name = "noexcept operator"
keys = ["noexcept", "operator", "check", "expression", "bool", "query"]
doc = "Ask at compile time whether an expression can throw."
snippet = """
noexcept(${1:expr})$0"""

[[entries]]
name = "RAII cleanup in exceptions"
keys = ["raii", "cleanup", "exception", "guard", "unwinding", "release"]
doc = "Hold resources in objects so stack unwinding releases them automatically."
snippet = """
{
    ${1:std::lock_guard<std::mutex> lock(mtx);}
    $0
}"""

[[entries]]
name = "std::terminate"
keys = ["terminate", "abort", "exit", "crash", "fatal"]
doc = "Abort the program immediately, as an uncaught exception does."
snippet = """
std::terminate();$0"""
