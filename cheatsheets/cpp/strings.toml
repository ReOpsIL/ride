title = "Strings"
contexts = ["statement", "expression"]

[[entries]]
name = "string"
keys = ["string", "str", "std::string", "text", "declare", "literal"]
doc = "Owning string initialized from a literal."
snippet = '''
std::string ${1:s} = "${2:}";$0'''

[[entries]]
name = "empty string"
keys = ["string", "empty", "declare", "blank", "default"]
doc = "Empty string to be filled later."
snippet = '''
std::string ${1:s};$0'''

[[entries]]
name = "string of n chars"
keys = ["string", "repeat", "fill", "count", "n", "chars", "constructor"]
doc = "String made of n copies of one character."
snippet = '''
std::string ${1:s}(${2:n}, ${3:'-'});$0'''

[[entries]]
name = "string from substring"
keys = ["string", "substring", "constructor", "pos", "len", "copy", "part"]
doc = "String copied from part of another string."
snippet = '''
std::string ${1:s}(${2:other}, ${3:pos}, ${4:len});$0'''

[[entries]]
name = "string from char pointer"
keys = ["string", "char*", "c string", "convert", "constructor", "cstr", "buffer"]
doc = "String copied from a null-terminated char array or the first n bytes of a buffer."
snippet = '''
std::string ${1:s}(${2:cstr}${3:, len});$0'''

[[entries]]
name = "string from iterator range"
keys = ["string", "range", "iterator", "constructor", "begin", "end", "chars", "vector"]
doc = "String built from a range of characters."
snippet = '''
std::string ${1:s}(${2:first}, ${3:last});$0'''

[[entries]]
name = "string from string_view"
keys = ["string", "string_view", "convert", "copy", "own", "sv"]
doc = "Owning copy of a string_view."
snippet = '''
std::string ${1:s}(${2:sv});$0'''

[[entries]]
name = "raw string"
keys = ["raw", "string", "literal", "R\"", "regex", "path", "backslash", "multiline"]
doc = "Raw string literal in which backslashes and quotes are literal."
snippet = '''
R"(${1:text})"$0'''

[[entries]]
name = "assign"
keys = ["assign", "string", "set", "overwrite", "replace", "="]
doc = "Replace the contents of a string."
snippet = '''
${1:s}.assign(${2:"text"});$0'''

[[entries]]
name = "append"
keys = ["append", "concat", "+=", "add", "string", "push"]
doc = "Append to the end of a string with +=."
snippet = '''
${1:s} += ${2:"more"};$0'''

[[entries]]
name = "append method"
keys = ["append", "concat", "add", "string", "n", "substring", "chars"]
doc = "Append a string, n copies of a char, or part of another string."
snippet = '''
${1:s}.append(${2:"more"});$0'''

[[entries]]
name = "concatenate with +"
keys = ["+", "concat", "concatenate", "join", "string", "combine", "plus"]
doc = "Build a new string from pieces; at least one operand must be std::string."
snippet = '''
std::string ${1:result} = ${2:a} + ${3:" "} + ${4:b};$0'''

[[entries]]
name = "push_back / pop_back"
keys = ["push_back", "pop_back", "char", "append", "remove", "last", "string"]
doc = "Append or remove a single character at the end."
snippet = '''
${1:s}.${2:push_back}(${3:c});$0'''

[[entries]]
name = "insert"
keys = ["insert", "string", "position", "middle", "add"]
doc = "Insert a string at a position."
snippet = '''
${1:s}.insert(${2:pos}, ${3:"text"});$0'''

[[entries]]
name = "erase"
keys = ["erase", "remove", "string", "delete", "cut", "pos", "len"]
doc = "Erase len characters starting at pos (omit len to erase to the end)."
snippet = '''
${1:s}.erase(${2:pos}, ${3:len});$0'''

[[entries]]
name = "erase char at"
keys = ["erase", "char", "one", "remove", "index", "string", "iterator"]
doc = "Erase a single character by iterator position."
snippet = '''
${1:s}.erase(${1:s}.begin() + ${2:i});$0'''

[[entries]]
name = "replace"
keys = ["replace", "substitute", "string", "pos", "len", "overwrite"]
doc = "Replace len characters at pos with another string."
snippet = '''
${1:s}.replace(${2:pos}, ${3:len}, ${4:"new"});$0'''

[[entries]]
name = "substr"
keys = ["substr", "substring", "slice", "part", "cut", "string"]
doc = "Copy of a substring starting at pos with len characters."
snippet = '''
${1:s}.substr(${2:pos}, ${3:len})$0'''

[[entries]]
name = "substr to end"
keys = ["substr", "substring", "rest", "tail", "from", "end", "suffix"]
doc = "Copy of everything from pos to the end."
snippet = '''
${1:s}.substr(${2:pos})$0'''

[[entries]]
name = "at / operator[]"
keys = ["at", "[]", "index", "char", "character", "access", "nth", "string"]
doc = "Character at an index; at() is bounds-checked, [] is not."
snippet = '''
${1:s}[${2:i}]$0'''

[[entries]]
name = "front / back"
keys = ["front", "back", "first", "last", "char", "character", "string"]
doc = "First or last character."
snippet = '''
${1:s}.${2:back}()$0'''

[[entries]]
name = "length / empty"
keys = ["length", "size", "empty", "count", "len", "string"]
doc = "Number of characters (size and length are identical), or whether there are none."
snippet = '''
${1:s}.${2:size}()$0'''

[[entries]]
name = "clear"
keys = ["clear", "string", "empty", "reset", "erase"]
doc = "Make the string empty."
snippet = '''
${1:s}.clear();$0'''

[[entries]]
name = "resize / reserve"
keys = ["resize", "reserve", "capacity", "string", "grow", "truncate", "shrink"]
doc = "Change the length (padding with a char) or reserve capacity."
snippet = '''
${1:s}.${2:reserve}(${3:n});$0'''

[[entries]]
name = "c_str / data"
keys = ["c_str", "data", "cstring", "char*", "pointer", "c", "api"]
doc = "Null-terminated const char pointer for C APIs."
snippet = '''
${1:s}.c_str()$0'''

[[entries]]
name = "iterate chars"
keys = ["loop", "chars", "each", "character", "for", "iterate", "string"]
doc = "Loop over every character by reference."
snippet = '''
for (char ${1:c} : ${2:s}) {
    $0
}'''

[[entries]]
name = "iterate chars by index"
keys = ["loop", "index", "chars", "for", "i", "size", "string", "beginner"]
doc = "Index loop over a string using size_t."
snippet = '''
for (std::size_t ${1:i} = 0; ${1:i} < ${2:s}.size(); ++${1:i}) {
    ${3:char c = s[i];}
    $0
}'''

[[entries]]
name = "swap strings"
keys = ["swap", "string", "exchange", "std::swap"]
doc = "Swap two strings in O(1)."
snippet = '''
${1:a}.swap(${2:b});$0'''
