title = "For loops"
contexts = ["statement"]

[[entries]]
name = "for"
keys = ["for", "loop", "index", "count", "counted", "times", "i"]
doc = "Counted loop with an index."
snippet = """
for (${1:int} ${2:i} = ${3:0}; ${2:i} < ${4:n}; ++${2:i}) {
    $0
}"""

[[entries]]
name = "for reverse"
keys = ["for", "loop", "reverse", "down", "backwards", "countdown"]
doc = "Counted loop from n-1 down to 0."
snippet = """
for (${1:int} ${2:i} = ${3:n} - 1; ${2:i} >= 0; --${2:i}) {
    $0
}"""

[[entries]]
name = "for with step"
keys = ["for", "loop", "step", "stride", "+=", "every", "skip"]
doc = "Counted loop advancing by a step."
snippet = """
for (${1:int} ${2:i} = ${3:0}; ${2:i} < ${4:n}; ${2:i} += ${5:2}) {
    $0
}"""

[[entries]]
name = "for over vector by index"
keys = ["for", "loop", "index", "vector", "size", "size_t", "position"]
doc = "Index loop over a container using its size."
snippet = """
for (std::size_t ${1:i} = 0; ${1:i} < ${2:v}.size(); ++${1:i}) {
    $0
}"""

[[entries]]
name = "for over C array"
keys = ["for", "loop", "array", "size", "length", "std::size", "c"]
doc = "Index loop over a built-in array using std::size."
snippet = """
for (std::size_t ${1:i} = 0; ${1:i} < std::size(${2:arr}); ++${1:i}) {
    $0
}"""

[[entries]]
name = "nested for"
keys = ["for", "loop", "nested", "2d", "grid", "matrix", "rows", "columns"]
doc = "Two nested counted loops over rows and columns."
snippet = """
for (${1:int} ${2:i} = 0; ${2:i} < ${3:rows}; ++${2:i}) {
    for (${1:int} ${4:j} = 0; ${4:j} < ${5:cols}; ++${4:j}) {
        $0
    }
}"""

[[entries]]
name = "range for"
keys = ["for", "range", "foreach", "loop", "each", "elements", "const"]
doc = "Loop over every element of a range by const reference."
snippet = """
for (${1:const auto &}${2:item} : ${3:container}) {
    $0
}"""

[[entries]]
name = "range for by value"
keys = ["for", "range", "foreach", "value", "copy", "int", "each"]
doc = "Loop over copies of the elements; fine for small types."
snippet = """
for (${1:int} ${2:item} : ${3:container}) {
    $0
}"""

[[entries]]
name = "range for by reference"
keys = ["for", "range", "foreach", "ref", "modify", "mutable", "&"]
doc = "Loop over the elements by reference to modify them in place."
snippet = """
for (auto &${1:item} : ${2:container}) {
    $0
}"""

[[entries]]
name = "range for with auto&&"
keys = ["for", "range", "foreach", "forwarding", "&&", "proxy", "generic"]
doc = "Forwarding reference that also works with proxy elements such as vector<bool>."
snippet = """
for (auto &&${1:item} : ${2:container}) {
    $0
}"""

[[entries]]
name = "range for over string"
keys = ["for", "range", "string", "char", "characters", "letters", "each"]
doc = "Loop over the characters of a string."
snippet = """
for (char ${1:c} : ${2:text}) {
    $0
}"""

[[entries]]
name = "range for over map"
keys = ["for", "range", "foreach", "binding", "map", "pair", "key", "value"]
doc = "Loop over key/value pairs of a map with structured bindings."
snippet = """
for (const auto &[${1:key}, ${2:value}] : ${3:map}) {
    $0
}"""

[[entries]]
name = "range for over braced list"
keys = ["for", "range", "list", "braces", "values", "literal"]
doc = "Loop over a few literal values."
snippet = """
for (${1:int} ${2:x} : {${3:1, 2, 3}}) {
    $0
}"""

[[entries]]
name = "range for with initializer"
keys = ["for", "range", "init", "scoped", ";"]
doc = "C++20 range for with a scoped initializer."
snippet = """
for (${1:auto data = get()}; ${2:const auto &item} : ${3:data}) {
    $0
}"""

[[entries]]
name = "range for with index"
keys = ["for", "range", "index", "enumerate", "position", "counter"]
doc = "Range loop that also tracks the element index."
snippet = """
std::size_t ${1:i} = 0;
for (const auto &${2:item} : ${3:container}) {
    $0
    ++${1:i};
}"""

[[entries]]
name = "range for with enumerate"
keys = ["for", "range", "enumerate", "index", "views", "c++23"]
doc = "C++23 std::views::enumerate yields index and element."
snippet = """
for (auto [${1:i}, ${2:item}] : std::views::enumerate(${3:container})) {
    $0
}"""

[[entries]]
name = "range for reverse"
keys = ["for", "range", "reverse", "backwards", "views", "rbegin"]
doc = "Loop over a range from the back with std::views::reverse."
snippet = """
for (const auto &${1:item} : std::views::reverse(${2:container})) {
    $0
}"""

[[entries]]
name = "for with iterator"
keys = ["for", "iterator", "begin", "end", "loop", "it"]
doc = "Loop with an explicit iterator."
snippet = """
for (auto ${1:it} = ${2:v}.begin(); ${1:it} != ${2:v}.end(); ++${1:it}) {
    $0
}"""

[[entries]]
name = "for with reverse iterator"
keys = ["for", "iterator", "rbegin", "rend", "reverse", "backwards"]
doc = "Loop from the back with reverse iterators."
snippet = """
for (auto ${1:it} = ${2:v}.rbegin(); ${1:it} != ${2:v}.rend(); ++${1:it}) {
    $0
}"""

[[entries]]
name = "for erasing while iterating"
keys = ["for", "erase", "iterator", "remove", "while", "loop"]
doc = "Erase elements during iteration using the iterator erase returns."
snippet = """
for (auto ${1:it} = ${2:v}.begin(); ${1:it} != ${2:v}.end();) {
    if (${3:condition}) {
        ${1:it} = ${2:v}.erase(${1:it});
    } else {
        ++${1:it};
    }$0
}"""

[[entries]]
name = "for over two containers"
keys = ["for", "zip", "two", "parallel", "views", "pair"]
doc = "C++23 loop over two ranges side by side with std::views::zip."
snippet = """
for (auto [${1:a}, ${2:b}] : std::views::zip(${3:xs}, ${4:ys})) {
    $0
}"""

[[entries]]
name = "for over iota range"
keys = ["for", "iota", "range", "views", "numbers", "0..n"]
doc = "Loop over the integers 0 to n-1 without a raw counter."
snippet = """
for (int ${1:i} : std::views::iota(${2:0}, ${3:n})) {
    $0
}"""
