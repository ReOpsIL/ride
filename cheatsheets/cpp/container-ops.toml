title = "Vector operations"
contexts = ["statement", "expression"]

[[entries]]
name = "push_back"
keys = ["push_back", "push", "append", "add", "insert", "end"]
doc = "Append a copy of a value to the end."
snippet = '''
${1:v}.push_back(${2:value});$0'''

[[entries]]
name = "emplace_back"
keys = ["emplace_back", "emplace", "push", "construct", "append", "add"]
doc = "Construct an element in place at the end from constructor arguments."
snippet = '''
${1:v}.emplace_back(${2:args});$0'''

[[entries]]
name = "pop_back"
keys = ["pop_back", "pop", "remove", "last", "delete"]
doc = "Remove the last element; undefined on an empty vector."
snippet = '''
${1:v}.pop_back();$0'''

[[entries]]
name = "insert"
keys = ["insert", "add", "position", "middle", "iterator"]
doc = "Insert a value before an iterator position."
snippet = '''
${1:v}.insert(${1:v}.begin() + ${2:i}, ${3:value});$0'''

[[entries]]
name = "insert at front"
keys = ["insert", "front", "begin", "prepend", "first", "push_front"]
doc = "Insert at the beginning, shifting every element."
snippet = '''
${1:v}.insert(${1:v}.begin(), ${2:value});$0'''

[[entries]]
name = "insert range"
keys = ["insert", "range", "append", "concat", "extend", "merge", "begin", "end"]
doc = "Insert all elements of another range at a position."
snippet = '''
${1:v}.insert(${1:v}.end(), ${2:other}.begin(), ${2:other}.end());$0'''

[[entries]]
name = "insert n copies"
keys = ["insert", "copies", "fill", "repeat", "count"]
doc = "Insert n copies of a value at a position."
snippet = '''
${1:v}.insert(${1:v}.begin() + ${2:i}, ${3:n}, ${4:value});$0'''

[[entries]]
name = "insert initializer list"
keys = ["insert", "braces", "list", "several", "multiple", "append"]
doc = "Insert several literal values at once."
snippet = '''
${1:v}.insert(${1:v}.end(), {${2:1, 2, 3}});$0'''

[[entries]]
name = "emplace"
keys = ["emplace", "insert", "construct", "position", "iterator"]
doc = "Construct an element in place before an iterator position."
snippet = '''
${1:v}.emplace(${1:v}.begin() + ${2:i}, ${3:args});$0'''

[[entries]]
name = "erase at"
keys = ["erase", "remove", "delete", "index", "iterator", "position"]
doc = "Erase the element at an iterator position."
snippet = '''
${1:v}.erase(${1:v}.begin() + ${2:i});$0'''

[[entries]]
name = "erase range"
keys = ["erase", "remove", "range", "delete", "slice"]
doc = "Erase elements in [first, last)."
snippet = '''
${1:v}.erase(${1:v}.begin() + ${2:from}, ${1:v}.begin() + ${3:to});$0'''

[[entries]]
name = "erase while iterating"
keys = ["erase", "loop", "iterator", "while", "invalidate", "remove", "delete"]
doc = "Erase during a loop by advancing with the iterator erase returns."
snippet = '''
for (auto ${1:it} = ${2:v}.begin(); ${1:it} != ${2:v}.end();) {
    if (${3:cond}) {
        ${1:it} = ${2:v}.erase(${1:it});
    } else {
        ++${1:it};
    }
}$0'''

[[entries]]
name = "erase-remove idiom"
keys = ["erase", "remove", "remove_if", "idiom", "filter", "delete", "matching"]
doc = "Remove every element matching a predicate (pre-C++20 idiom)."
snippet = '''
${1:v}.erase(std::remove_if(${1:v}.begin(), ${1:v}.end(), [](${2:const auto &x}) { return ${3:cond}; }), ${1:v}.end());$0'''

[[entries]]
name = "std::erase_if"
keys = ["erase_if", "erase", "remove", "filter", "delete", "predicate"]
doc = "C++20 one-call removal of elements matching a predicate."
snippet = '''
std::erase_if(${1:v}, [](${2:const auto &x}) { return ${3:cond}; });$0'''

[[entries]]
name = "std::erase value"
keys = ["erase", "remove", "value", "delete", "all", "equal"]
doc = "C++20 remove every element equal to a value."
snippet = '''
std::erase(${1:v}, ${2:value});$0'''

[[entries]]
name = "at"
keys = ["at", "index", "bounds", "checked", "access", "get"]
doc = "Bounds-checked element access that throws std::out_of_range."
snippet = '''
${1:v}.at(${2:i})$0'''

[[entries]]
name = "operator[]"
keys = ["index", "subscript", "[]", "access", "get", "element"]
doc = "Unchecked element access; out-of-range is undefined behaviour."
snippet = '''
${1:v}[${2:i}]$0'''

[[entries]]
name = "front / back"
keys = ["front", "back", "first", "last", "element"]
doc = "First or last element; undefined on an empty vector."
snippet = '''
${1:v}.${2:back}()$0'''

[[entries]]
name = "size"
keys = ["size", "length", "count", "len", "number"]
doc = "Number of elements as size_t."
snippet = '''
${1:v}.size()$0'''

[[entries]]
name = "std::ssize"
keys = ["ssize", "size", "signed", "length", "int"]
doc = "C++20 signed element count for arithmetic with ints."
snippet = '''
std::ssize(${1:v})$0'''

[[entries]]
name = "empty"
keys = ["empty", "size", "none", "zero", "check"]
doc = "True when the container has no elements."
snippet = '''
${1:v}.empty()$0'''

[[entries]]
name = "clear"
keys = ["clear", "reset", "empty", "remove", "all"]
doc = "Remove all elements, keeping capacity."
snippet = '''
${1:v}.clear();$0'''

[[entries]]
name = "reserve"
keys = ["reserve", "capacity", "preallocate", "grow"]
doc = "Reserve capacity to avoid reallocations; size stays unchanged."
snippet = '''
${1:v}.reserve(${2:n});$0'''

[[entries]]
name = "resize"
keys = ["resize", "size", "grow", "shrink", "truncate"]
doc = "Change the element count, value-initializing new elements."
snippet = '''
${1:v}.resize(${2:n});$0'''

[[entries]]
name = "resize with value"
keys = ["resize", "size", "grow", "fill", "value", "default"]
doc = "Grow to n elements, filling new slots with a value."
snippet = '''
${1:v}.resize(${2:n}, ${3:value});$0'''

[[entries]]
name = "capacity / shrink_to_fit"
keys = ["capacity", "shrink_to_fit", "memory", "allocated", "free", "trim"]
doc = "Allocated slots, or release unused capacity."
snippet = '''
${1:v}.${2:shrink_to_fit}()$0'''

[[entries]]
name = "data"
keys = ["data", "pointer", "raw", "buffer", "c", "array"]
doc = "Pointer to the underlying contiguous storage for C APIs."
snippet = '''
${1:v}.data()$0'''

[[entries]]
name = "swap"
keys = ["swap", "exchange", "std::swap"]
doc = "Swap two values or containers in O(1)."
snippet = '''
std::swap(${1:a}, ${2:b});$0'''

[[entries]]
name = "assign"
keys = ["assign", "replace", "fill", "overwrite", "range", "copies"]
doc = "Replace contents with a range, n copies or a braced list."
snippet = '''
${1:v}.assign(${2:first}, ${3:last});$0'''

[[entries]]
name = "vector equality"
keys = ["equal", "==", "compare", "vector", "same", "lexicographic"]
doc = "Containers compare element-wise with == and lexicographically with <."
snippet = '''
${1:a} == ${2:b}$0'''
