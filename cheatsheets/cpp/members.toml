title = "Data members"
contexts = ["fields"]

[[entries]]
name = "member"
keys = ["member", "field", "data", "variable", "attribute", "property"]
doc = "Plain data member."
snippet = """
${1:int} ${2:value_};$0"""

[[entries]]
name = "member with default initializer"
keys = ["member", "field", "init", "default", "=", "{}"]
doc = "Data member with an in-class default value."
snippet = """
${1:int} ${2:value_}{${3:0}};$0"""

[[entries]]
name = "member with = initializer"
keys = ["member", "field", "init", "default", "=", "equals"]
doc = "Data member defaulted with = syntax."
snippet = """
${1:int} ${2:value_} = ${3:0};$0"""

[[entries]]
name = "string member"
keys = ["member", "field", "string", "name", "text"]
doc = "Owning string data member."
snippet = """
std::string ${1:name_};$0"""

[[entries]]
name = "container member"
keys = ["member", "field", "vector", "list", "container", "map"]
doc = "Data member holding a standard container."
snippet = """
std::vector<${1:int}> ${2:items_};$0"""

[[entries]]
name = "unique_ptr member"
keys = ["member", "field", "unique_ptr", "owning", "pointer", "heap"]
doc = "Owning pointer member that frees itself in the destructor."
snippet = """
std::unique_ptr<${1:Type}> ${2:ptr_};$0"""

[[entries]]
name = "raw pointer member"
keys = ["member", "field", "pointer", "*", "non-owning", "observer"]
doc = "Non-owning pointer member initialized to null."
snippet = """
${1:Type} *${2:ptr_} = nullptr;$0"""

[[entries]]
name = "reference member"
keys = ["member", "field", "reference", "&", "alias", "dependency"]
doc = "Reference member that must be set in every constructor and disables assignment."
snippet = """
${1:Type} &${2:ref_};$0"""

[[entries]]
name = "const member"
keys = ["member", "field", "const", "immutable", "readonly"]
doc = "Member fixed at construction; disables copy assignment."
snippet = """
const ${1:int} ${2:id_};$0"""

[[entries]]
name = "mutable member"
keys = ["member", "field", "mutable", "cache", "const", "mutex"]
doc = "Member that const member functions may still modify, such as a cache or mutex."
snippet = """
mutable ${1:std::mutex} ${2:mutex_};$0"""

[[entries]]
name = "array member"
keys = ["member", "field", "array", "fixed", "buffer", "std::array"]
doc = "Fixed-size array data member."
snippet = """
std::array<${1:int}, ${2:N}> ${3:data_}{};$0"""

[[entries]]
name = "C array member"
keys = ["member", "field", "array", "c", "buffer", "raw"]
doc = "Built-in array data member zero-initialized."
snippet = """
${1:char} ${2:buffer_}[${3:64}] = {};$0"""

[[entries]]
name = "static member"
keys = ["static", "member", "field", "shared", "class", "count"]
doc = "Data member shared by all instances, defined inline."
snippet = """
static inline ${1:int} ${2:count} = ${3:0};$0"""

[[entries]]
name = "static member declaration"
keys = ["static", "member", "field", "declare", "outside", "cpp"]
doc = "Static data member declared here and defined once in a .cpp file."
snippet = """
static ${1:int} ${2:count};$0"""

[[entries]]
name = "static const member"
keys = ["static", "const", "member", "constant", "class"]
doc = "Integral class constant initialized in the class."
snippet = """
static const ${1:int} ${2:kMax} = ${3:100};$0"""

[[entries]]
name = "static constexpr member"
keys = ["static", "constexpr", "member", "constant", "class", "compile"]
doc = "Compile-time class constant, implicitly inline."
snippet = """
static constexpr ${1:int} ${2:kMax} = ${3:100};$0"""

[[entries]]
name = "bit field"
keys = ["bit", "field", "bitfield", "bits", "pack", "flag"]
doc = "Member that occupies a fixed number of bits."
snippet = """
${1:unsigned} ${2:flag} : ${3:1};$0"""

[[entries]]
name = "access specifier"
keys = ["public", "private", "protected", "access", "section", "visibility"]
doc = "Change member access for the members that follow."
snippet = """
${1:private}:
    $0"""

[[entries]]
name = "enum inside class"
keys = ["enum", "class", "nested", "kind", "state", "inner"]
doc = "Scoped enum declared inside the class."
snippet = """
enum class ${1:Kind} {
    ${2:First},
    $0
};"""

[[entries]]
name = "nested class"
keys = ["class", "nested", "inner", "member", "type"]
doc = "Class defined inside another class."
snippet = """
class ${1:Inner} {
public:
    $0
};"""

[[entries]]
name = "nested struct"
keys = ["struct", "nested", "inner", "member", "type", "node"]
doc = "Struct defined inside a class, such as a node type."
snippet = """
struct ${1:Node} {
    ${2:int} ${3:value};
    $0
};"""

[[entries]]
name = "type alias in class"
keys = ["using", "alias", "type", "value_type", "nested", "typedef"]
doc = "Member type alias such as value_type or iterator."
snippet = """
using ${1:value_type} = ${2:T};$0"""

[[entries]]
name = "friend function"
keys = ["friend", "fn", "access", "private", "free"]
doc = "Grant a free function access to private members."
snippet = """
friend ${1:void} ${2:name}(${3:const Name &obj});$0"""

[[entries]]
name = "friend class"
keys = ["friend", "class", "access", "private"]
doc = "Grant another class access to private members."
snippet = """
friend class ${1:Other};$0"""

[[entries]]
name = "using base constructors"
keys = ["using", "inherit", "constructor", "ctor", "base"]
doc = "Inherit the base class constructors."
snippet = """
using ${1:Base}::${1:Base};$0"""

[[entries]]
name = "using base member"
keys = ["using", "base", "member", "expose", "hidden", "overload"]
doc = "Bring a base member into scope, exposing it or un-hiding overloads."
snippet = """
using ${1:Base}::${2:method};$0"""

[[entries]]
name = "static_assert in class"
keys = ["static_assert", "assert", "compile", "class", "template", "check"]
doc = "Compile-time check on a template parameter inside a class."
snippet = """
static_assert(${1:std::is_integral_v<T>}, "${2:T must be integral}");$0"""
