[[entries]]
name = "simple thread pool"
keys = ["thread pool", "pool", "workers", "queue", "tasks", "condition_variable", "executor", "class"]
doc = "Minimal thread pool: a task queue drained by jthread workers."
snippet = '''
class ${1:ThreadPool} {
public:
    explicit ${1:ThreadPool}(unsigned n) {
        for (unsigned i = 0; i < n; ++i) {
            workers_.emplace_back([this](std::stop_token st) { run(st); });
        }
    }
    void submit(std::function<void()> task) {
        {
            std::lock_guard<std::mutex> lock(mtx_);
            tasks_.push(std::move(task));
        }
        cv_.notify_one();
    }
private:
    void run(std::stop_token st) {
        while (true) {
            std::function<void()> task;
            {
                std::unique_lock<std::mutex> lock(mtx_);
                cv_.wait(lock, st, [&] { return !tasks_.empty(); });
                if (st.stop_requested() && tasks_.empty()) return;
                task = std::move(tasks_.front());
                tasks_.pop();
            }
            task();
        }
    }
    std::mutex mtx_;
    std::condition_variable_any cv_;
    std::queue<std::function<void()>> tasks_;
    std::vector<std::jthread> workers_;
};$0'''
