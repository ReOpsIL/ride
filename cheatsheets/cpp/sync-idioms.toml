title = "Concurrency idioms"
contexts = ["item", "statement"]

[[entries]]
name = "producer-consumer queue"
keys = ["producer", "consumer", "queue", "condition_variable", "mutex", "worker", "idiom", "channel"]
doc = "Thread-safe queue: push under the lock and notify, pop waits for an item or shutdown."
snippet = '''
template <typename T>
class ${1:BlockingQueue} {
public:
    void push(T value) {
        {
            std::lock_guard<std::mutex> lock(mtx_);
            items_.push(std::move(value));
        }
        cv_.notify_one();
    }
    std::optional<T> pop() {
        std::unique_lock<std::mutex> lock(mtx_);
        cv_.wait(lock, [&] { return !items_.empty() || closed_; });
        if (items_.empty()) return std::nullopt;
        T value = std::move(items_.front());
        items_.pop();
        return value;
    }
    void close() {
        {
            std::lock_guard<std::mutex> lock(mtx_);
            closed_ = true;
        }
        cv_.notify_all();
    }
private:
    std::mutex mtx_;
    std::condition_variable cv_;
    std::queue<T> items_;
    bool closed_ = false;
};$0'''

