[[entries]]
name = "mutex-guarded member"
keys = ["guarded", "member", "class", "mutex", "mutable", "thread-safe", "encapsulate"]
doc = "Keep the mutex private next to the data and lock in every accessor."
snippet = '''
class ${1:Counter} {
public:
    void add(${2:int} n) {
        std::lock_guard<std::mutex> lock(mtx_);
        value_ += n;
    }
    ${2:int} get() const {
        std::lock_guard<std::mutex> lock(mtx_);
        return value_;
    }
private:
    mutable std::mutex mtx_;
    ${2:int} value_ = 0;
};$0'''

