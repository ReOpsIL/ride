title = "Numeric algorithms"
contexts = ["statement", "expression"]

[[entries]]
name = "accumulate"
keys = ["accumulate", "sum", "fold", "numeric", "total", "add", "reduce"]
doc = "Sum a range starting from an initial value, whose type fixes the result type."
snippet = '''
std::accumulate(${1:v}.begin(), ${1:v}.end(), ${2:0})$0'''

[[entries]]
name = "accumulate with lambda"
keys = ["accumulate", "fold", "lambda", "product", "custom", "reduce", "combine"]
doc = "Fold a range with a binary operation, e.g. a product."
snippet = '''
std::accumulate(${1:v}.begin(), ${1:v}.end(), ${2:1}, [](${3:auto acc}, ${4:const auto &x}) { return ${5:acc * x}; })$0'''

[[entries]]
name = "accumulate doubles"
keys = ["accumulate", "sum", "double", "average", "mean", "float"]
doc = "Sum as double by passing 0.0 as the initial value; divide by size for the mean."
snippet = '''
double ${1:mean} = std::accumulate(${2:v}.begin(), ${2:v}.end(), 0.0) / ${2:v}.size();$0'''

[[entries]]
name = "reduce"
keys = ["reduce", "sum", "fold", "parallel", "numeric", "total"]
doc = "Unordered fold that may run in parallel with an execution policy."
snippet = '''
std::reduce(${1:v}.begin(), ${1:v}.end(), ${2:0})$0'''

[[entries]]
name = "transform_reduce"
keys = ["transform_reduce", "map", "reduce", "sum", "squares", "dot", "numeric"]
doc = "Transform each element then fold, e.g. a sum of squares."
snippet = '''
std::transform_reduce(${1:v}.begin(), ${1:v}.end(), ${2:0}, std::plus<>(), [](${3:const auto &x}) { return ${4:x * x}; })$0'''

[[entries]]
name = "inner_product"
keys = ["inner_product", "dot", "product", "scalar", "numeric", "vectors"]
doc = "Dot product of two ranges."
snippet = '''
std::inner_product(${1:a}.begin(), ${1:a}.end(), ${2:b}.begin(), ${3:0})$0'''

[[entries]]
name = "partial_sum"
keys = ["partial_sum", "prefix", "sum", "running", "cumulative", "numeric"]
doc = "Running totals written to an output range."
snippet = '''
std::partial_sum(${1:v}.begin(), ${1:v}.end(), std::back_inserter(${2:prefix}));$0'''

[[entries]]
name = "inclusive_scan / exclusive_scan"
keys = ["inclusive_scan", "exclusive_scan", "scan", "prefix", "sum", "parallel", "numeric"]
doc = "Prefix sums including or excluding the current element."
snippet = '''
std::${1:inclusive_scan}(${2:v}.begin(), ${2:v}.end(), std::back_inserter(${3:out}));$0'''

[[entries]]
name = "adjacent_difference"
keys = ["adjacent_difference", "difference", "delta", "diff", "consecutive", "numeric"]
doc = "Differences between consecutive elements."
snippet = '''
std::adjacent_difference(${1:v}.begin(), ${1:v}.end(), std::back_inserter(${2:deltas}));$0'''

[[entries]]
name = "iota"
keys = ["iota", "sequence", "numeric", "range", "fill", "increasing", "indices"]
doc = "Fill a range with consecutive values starting at a seed."
snippet = '''
std::iota(${1:v}.begin(), ${1:v}.end(), ${2:0});$0'''

[[entries]]
name = "gcd / lcm"
keys = ["gcd", "lcm", "divisor", "multiple", "numeric", "math"]
doc = "Greatest common divisor or least common multiple."
snippet = '''
std::${1:gcd}(${2:a}, ${3:b})$0'''

[[entries]]
name = "midpoint"
keys = ["midpoint", "middle", "average", "half", "overflow", "numeric"]
doc = "Midpoint of two values without overflow."
snippet = '''
std::midpoint(${1:a}, ${2:b})$0'''

[[entries]]
name = "std::abs / std::pow / std::sqrt"
keys = ["abs", "pow", "sqrt", "cmath", "math", "power", "root"]
doc = "Common <cmath> functions."
snippet = '''
std::${1:sqrt}(${2:x})$0'''

[[entries]]
name = "std::round / floor / ceil"
keys = ["round", "floor", "ceil", "trunc", "cmath", "math", "integer"]
doc = "Rounding functions from <cmath>."
snippet = '''
std::${1:round}(${2:x})$0'''

[[entries]]
name = "sum with range for"
keys = ["sum", "loop", "total", "for", "add", "beginner"]
doc = "Beginner-style running sum with a range for loop."
snippet = '''
${1:int} ${2:sum} = 0;
for (const auto &${3:x} : ${4:v}) {
    ${2:sum} += ${3:x};
}$0'''

[[entries]]
name = "random integer"
keys = ["random", "rand", "mt19937", "uniform_int_distribution", "dice", "range", "number"]
doc = "Uniform random integer in [lo, hi] with <random>."
snippet = '''
static std::mt19937 ${1:rng}(std::random_device{}());
std::uniform_int_distribution<${2:int}> ${3:dist}(${4:lo}, ${5:hi});
auto ${6:n} = ${3:dist}(${1:rng});$0'''

[[entries]]
name = "random double"
keys = ["random", "double", "uniform_real_distribution", "float", "probability", "number"]
doc = "Uniform random double in [lo, hi)."
snippet = '''
static std::mt19937 ${1:rng}(std::random_device{}());
std::uniform_real_distribution<double> ${2:dist}(${3:0.0}, ${4:1.0});
auto ${5:x} = ${2:dist}(${1:rng});$0'''

[[entries]]
name = "execution policy"
keys = ["execution", "par", "parallel", "policy", "par_unseq", "seq", "sort"]
doc = "Run an algorithm in parallel with an execution policy from <execution>."
snippet = '''
std::${1:sort}(std::execution::${2:par}, ${3:v}.begin(), ${3:v}.end());$0'''
