title = "Range views"
contexts = ["statement", "expression"]

[[entries]]
name = "views::filter"
keys = ["filter", "views", "std::views", "where", "select", "predicate", "lazy"]
doc = "Lazy view of elements matching a predicate."
snippet = '''
${1:v} | std::views::filter([](${2:const auto &x}) { return ${3:cond}; })$0'''

