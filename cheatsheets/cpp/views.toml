}'''

[[entries]]
name = "stored view"
keys = ["view", "auto", "variable", "store", "lazy", "pipeline", "reuse"]
doc = "Keep a lazy view in a variable; it re-evaluates each time it is iterated."
snippet = '''
auto ${1:evens} = ${2:v} | std::views::filter([](${3:const auto &x}) { return ${4:x % 2 == 0}; });$0'''

[[entries]]
name = "range for over view"
keys = ["for", "loop", "view", "range", "iterate", "each"]
