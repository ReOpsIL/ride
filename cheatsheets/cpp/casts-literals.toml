title = "Casts and conversions"
contexts = ["expression"]

[[entries]]
name = "static_cast"
keys = ["static_cast", "cast", "convert", "conversion", "to"]
doc = "Checked compile-time conversion between related types."
snippet = """
static_cast<${1:int}>(${2:value})$0"""

[[entries]]
name = "int to double"
keys = ["static_cast", "double", "float", "int", "division", "convert"]
doc = "Convert an integer to floating point, for example before dividing."
snippet = """
static_cast<double>(${1:value})$0"""

[[entries]]
name = "double to int"
keys = ["static_cast", "int", "double", "truncate", "convert", "round"]
doc = "Truncate a floating value toward zero; use std::lround to round."
snippet = """
static_cast<int>(${1:value})$0"""

[[entries]]
name = "enum to int"
keys = ["static_cast", "enum", "int", "underlying", "convert", "number"]
doc = "Convert a scoped enumerator to its integer value."
snippet = """
static_cast<int>(${1:Color::Red})$0"""

[[entries]]
name = "int to enum"
keys = ["static_cast", "enum", "int", "from", "convert"]
doc = "Convert an integer to a scoped enum without validation."
snippet = """
static_cast<${1:Color}>(${2:value})$0"""

[[entries]]
name = "to size_t"
keys = ["static_cast", "size_t", "unsigned", "signed", "index", "warning"]
doc = "Convert a signed index to size_t to silence sign comparison warnings."
snippet = """
static_cast<std::size_t>(${1:i})$0"""

[[entries]]
name = "char to digit"
keys = ["char", "digit", "int", "'0'", "convert", "number"]
doc = "Digit character to its numeric value."
snippet = """
${1:c} - '0'$0"""

[[entries]]
name = "digit to char"
keys = ["char", "digit", "int", "'0'", "convert", "character"]
doc = "Numeric value 0-9 to its digit character."
snippet = """
static_cast<char>('0' + ${1:d})$0"""

[[entries]]
name = "to bool"
keys = ["bool", "convert", "truthy", "!!", "static_cast"]
doc = "Convert a value or pointer to bool explicitly."
snippet = """
static_cast<bool>(${1:value})$0"""

[[entries]]
name = "implicit conversion"
keys = ["implicit", "convert", "promotion", "widen", "assign"]
doc = "Assign between compatible types; narrowing happens silently."
snippet = """
${1:double} ${2:d} = ${3:i};$0"""

[[entries]]
name = "dynamic_cast"
keys = ["dynamic_cast", "cast", "downcast", "rtti", "derived", "pointer"]
doc = "Runtime-checked downcast that yields nullptr on failure."
snippet = """
dynamic_cast<${1:Derived} *>(${2:base})$0"""

[[entries]]
name = "dynamic_cast check"
keys = ["dynamic_cast", "if", "downcast", "check", "type", "is"]
doc = "Downcast and branch when it succeeds."
snippet = """
if (auto *${1:d} = dynamic_cast<${2:Derived} *>(${3:base})) {
    $0
}"""

[[entries]]
name = "dynamic_cast reference"
keys = ["dynamic_cast", "reference", "&", "downcast", "throw", "bad_cast"]
doc = "Reference downcast that throws std::bad_cast on failure."
snippet = """
dynamic_cast<${1:Derived} &>(${2:base})$0"""

[[entries]]
name = "upcast"
keys = ["upcast", "base", "derived", "pointer", "implicit", "polymorphism"]
doc = "Derived pointer converts to base pointer implicitly."
snippet = """
${1:Base} *${2:b} = ${3:&derived};$0"""

[[entries]]
name = "const_cast"
keys = ["const_cast", "cast", "const", "remove", "mutable"]
doc = "Remove or add const."
snippet = """
const_cast<${1:T} *>(${2:ptr})$0"""

[[entries]]
name = "reinterpret_cast"
keys = ["reinterpret_cast", "cast", "bits", "pointer", "address", "integer"]
doc = "Reinterpret the bit pattern as another pointer or integer type."
snippet = """
reinterpret_cast<${1:std::uintptr_t}>(${2:ptr})$0"""

[[entries]]
name = "reinterpret_cast to bytes"
keys = ["reinterpret_cast", "bytes", "char", "buffer", "binary", "write"]
doc = "View an object as raw bytes for binary I/O."
snippet = """
reinterpret_cast<const char *>(&${1:value})$0"""

[[entries]]
name = "C-style cast"
keys = ["cast", "c", "()", "legacy", "parentheses"]
doc = "Legacy cast (prefer the named casts)."
snippet = """
(${1:int})${2:value}$0"""

[[entries]]
name = "functional cast"
keys = ["cast", "functional", "construct", "()", "convert"]
doc = "Construct a value of a type from an argument."
snippet = """
${1:int}(${2:value})$0"""

[[entries]]
name = "brace conversion"
keys = ["cast", "brace", "{}", "narrowing", "safe", "convert"]
doc = "Conversion with braces that rejects narrowing."
snippet = """
${1:int}{${2:value}}$0"""

[[entries]]
name = "std::bit_cast"
keys = ["bit_cast", "cast", "bits", "punning", "float", "reinterpret"]
doc = "C++20 reinterpret the object representation safely."
snippet = """
std::bit_cast<${1:std::uint32_t}>(${2:value})$0"""

[[entries]]
name = "std::to_underlying"
keys = ["to_underlying", "enum", "underlying_type", "int", "c++23"]
doc = "C++23 convert an enum to its underlying integer."
snippet = """
std::to_underlying(${1:value})$0"""

[[entries]]
name = "std::static_pointer_cast"
keys = ["static_pointer_cast", "dynamic_pointer_cast", "shared_ptr", "cast", "smart"]
doc = "Cast a shared_ptr to another element type."
snippet = """
std::${1:static_pointer_cast}<${2:Derived}>(${3:ptr})$0"""

[[entries]]
name = "duration_cast"
keys = ["duration_cast", "chrono", "milliseconds", "convert", "time"]
doc = "Convert between chrono duration units."
snippet = """
std::chrono::duration_cast<std::chrono::${1:milliseconds}>(${2:elapsed})$0"""

[[entries]]
name = "number to string"
keys = ["to_string", "string", "convert", "number", "int", "format"]
doc = "Convert a number to std::string."
snippet = """
std::to_string(${1:value})$0"""

[[entries]]
name = "string to number"
keys = ["stoi", "stod", "stol", "string", "convert", "parse", "number"]
doc = "Parse a number from a string; throws on bad input."
snippet = """
std::${1:stoi}(${2:text})$0"""
