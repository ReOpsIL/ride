title = "Fundamental and compound types"
contexts = ["type"]

[[entries]]
name = "fundamental types"
keys = ["int", "char", "bool", "double", "float", "long", "short", "void"]
doc = "Built-in types: bool, char, int, long, long long, float, double, void."
snippet = """
${1:int}$0"""

[[entries]]
name = "unsigned integer"
keys = ["unsigned", "uint", "positive", "size", "int"]
doc = "Unsigned variant of an integer type."
snippet = """
unsigned ${1:int}$0"""

[[entries]]
name = "long long"
keys = ["long", "int64", "big", "large", "integer"]
doc = "At least 64-bit signed integer."
snippet = """
long long$0"""

[[entries]]
name = "long double"
keys = ["long", "double", "extended", "precision", "float"]
doc = "Extended precision floating type."
snippet = """
long double$0"""

[[entries]]
name = "character types"
keys = ["char", "wchar_t", "char8_t", "char16_t", "char32_t", "unicode", "wide"]
doc = "Character types: char, signed char, unsigned char, wchar_t, char8_t, char16_t, char32_t."
snippet = """
${1:char}$0"""

[[entries]]
name = "fixed-width integer"
keys = ["int32_t", "int64_t", "uint8_t", "uint32_t", "uint64_t", "cstdint", "std::", "width"]
doc = "Integer of exact width from <cstdint>."
snippet = """
std::${1:int32_t}$0"""

[[entries]]
name = "size_t"
keys = ["size_t", "size", "index", "length", "std::", "unsigned"]
doc = "Unsigned type for sizes and indices."
snippet = """
std::size_t$0"""

[[entries]]
name = "ptrdiff_t"
keys = ["ptrdiff_t", "difference", "signed", "distance", "std::"]
doc = "Signed type for pointer differences and signed sizes."
snippet = """
std::ptrdiff_t$0"""

[[entries]]
name = "std::byte"
keys = ["byte", "raw", "memory", "binary", "std::"]
doc = "Raw byte type that is not an integer or character."
snippet = """
std::byte$0"""

[[entries]]
name = "std::nullptr_t"
keys = ["nullptr_t", "null", "type", "std::"]
doc = "Type of nullptr, for overloading on null."
snippet = """
std::nullptr_t$0"""

[[entries]]
name = "const type"
keys = ["const", "readonly", "immutable", "constant"]
doc = "Read-only qualified type."
snippet = """
const ${1:T}$0"""

[[entries]]
name = "reference"
keys = ["ref", "reference", "&", "alias", "mutable"]
doc = "Mutable reference type, for in-out parameters."
snippet = """
${1:T} &$0"""

[[entries]]
name = "const reference"
keys = ["const", "ref", "&", "reference", "readonly", "param"]
doc = "Read-only reference parameter."
snippet = """
const ${1:T} &$0"""

[[entries]]
name = "rvalue reference"
keys = ["rvalue", "ref", "&&", "move", "temporary"]
doc = "Reference that binds to temporaries."
snippet = """
${1:T} &&$0"""

[[entries]]
name = "forwarding reference"
keys = ["forwarding", "universal", "&&", "template", "perfect"]
doc = "T&& on a deduced template parameter binds to anything."
snippet = """
${1:T} &&$0"""

[[entries]]
name = "pointer"
keys = ["ptr", "pointer", "*", "address"]
doc = "Pointer type."
snippet = """
${1:T} *$0"""

[[entries]]
name = "pointer to const"
keys = ["ptr", "pointer", "const", "*", "readonly", "pointee"]
doc = "Pointer to a read-only object."
snippet = """
const ${1:T} *$0"""

[[entries]]
name = "const pointer"
keys = ["ptr", "pointer", "const", "*const", "fixed"]
doc = "Pointer that cannot be reseated."
snippet = """
${1:T} *const$0"""

[[entries]]
name = "pointer to pointer"
keys = ["ptr", "pointer", "**", "double", "indirect"]
doc = "Pointer to a pointer."
snippet = """
${1:T} **$0"""

[[entries]]
name = "const char pointer"
keys = ["char", "string", "c", "literal", "const", "*"]
doc = "C string type."
snippet = """
const char *$0"""

[[entries]]
name = "void pointer"
keys = ["void", "pointer", "generic", "raw", "*"]
doc = "Untyped pointer."
snippet = """
void *$0"""

[[entries]]
name = "array type"
keys = ["array", "[]", "fixed", "c", "brackets"]
doc = "Built-in array type in a declaration or alias."
snippet = """
${1:int}[${2:N}]$0"""

[[entries]]
name = "auto"
keys = ["auto", "deduce", "infer"]
doc = "Deduced type (also usable in C++20 function parameters)."
snippet = """
auto$0"""

[[entries]]
name = "const auto&"
keys = ["auto", "const", "ref", "&", "deduce"]
doc = "Deduced read-only reference."
snippet = """
const auto &$0"""

[[entries]]
name = "decltype(auto)"
keys = ["decltype", "auto", "forward", "exact", "return"]
doc = "Return type that preserves references and const."
snippet = """
decltype(auto)$0"""

[[entries]]
name = "decltype"
keys = ["decltype", "type", "of", "expression"]
doc = "Type of an expression."
snippet = """
decltype(${1:expr})$0"""

[[entries]]
name = "function pointer"
keys = ["function", "pointer", "fnptr", "callback", "(*)"]
doc = "Pointer to a free function."
snippet = """
${1:void} (*${2:fn})(${3:int})$0"""

[[entries]]
name = "function type"
keys = ["function", "type", "signature", "std::function", "template"]
doc = "Function type as used inside std::function or as a template argument."
snippet = """
${1:void}(${2:int})$0"""

[[entries]]
name = "member function pointer"
keys = ["member", "pointer", "method", "::*"]
doc = "Pointer to a member function."
snippet = """
${1:void} (${2:Class}::*${3:fn})(${4:int})$0"""

[[entries]]
name = "member pointer"
keys = ["member", "pointer", "data", "field", "::*"]
doc = "Pointer to a data member."
snippet = """
${1:int} ${2:Class}::*$0"""
