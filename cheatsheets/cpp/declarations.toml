title = "Variables"
contexts = ["statement"]

[[entries]]
name = "variable"
keys = ["var", "let", "int", "declare", "define", "local", "="]
doc = "Declare and initialize a local variable."
snippet = """
${1:int} ${2:name} = ${3:0};$0"""

[[entries]]
name = "variable with braces"
keys = ["var", "int", "declare", "brace", "{}", "uniform", "narrowing"]
doc = "Declare with brace initialization, which rejects narrowing conversions."
snippet = """
${1:int} ${2:name}{${3:0}};$0"""

[[entries]]
name = "uninitialized variable"
keys = ["var", "int", "declare", "uninitialized", "later", "assign"]
doc = "Declare without a value; read it only after assigning (prefer initializing)."
snippet = """
${1:int} ${2:name};$0"""

[[entries]]
name = "several variables"
keys = ["var", "int", "declare", "multiple", "several", "comma", "two"]
doc = "Declare several variables of one type in a single statement."
snippet = """
${1:int} ${2:a} = ${3:0}, ${4:b} = ${5:0};$0"""

[[entries]]
name = "auto"
keys = ["auto", "var", "let", "deduce", "infer", "type"]
doc = "Variable whose type is deduced from its initializer."
snippet = """
auto ${1:name} = ${2:value};$0"""

[[entries]]
name = "auto with braces"
keys = ["auto", "var", "brace", "{}", "deduce"]
doc = "Deduced variable with brace initialization (auto x{1} is int, not a list)."
snippet = """
auto ${1:name}{${2:value}};$0"""

[[entries]]
name = "const auto"
keys = ["auto", "const", "var", "immutable", "readonly"]
doc = "Deduced constant."
snippet = """
const auto ${1:name} = ${2:value};$0"""

[[entries]]
name = "const auto&"
keys = ["auto", "const", "ref", "reference", "alias", "no", "copy"]
doc = "Reference to an existing value without copying."
snippet = """
const auto &${1:name} = ${2:expr};$0"""

[[entries]]
name = "auto&"
keys = ["auto", "ref", "reference", "modify", "alias", "&"]
doc = "Mutable reference with a deduced type."
snippet = """
auto &${1:name} = ${2:expr};$0"""

[[entries]]
name = "auto*"
keys = ["auto", "pointer", "ptr", "*", "deduce"]
doc = "Deduced pointer that makes the pointer-ness explicit."
snippet = """
auto *${1:ptr} = ${2:&value};$0"""

[[entries]]
name = "auto&&"
keys = ["auto", "forwarding", "&&", "universal", "temporary", "reference"]
doc = "Forwarding reference that binds to anything, extending temporaries."
snippet = """
auto &&${1:name} = ${2:expr};$0"""

[[entries]]
name = "const"
keys = ["const", "constant", "immutable", "readonly", "fixed"]
doc = "Variable that cannot be modified after initialization."
snippet = """
const ${1:int} ${2:name} = ${3:0};$0"""

[[entries]]
name = "constexpr"
keys = ["constexpr", "constant", "compile", "time", "literal"]
doc = "Compile-time constant."
snippet = """
constexpr ${1:int} ${2:name} = ${3:0};$0"""

[[entries]]
name = "static constexpr local"
keys = ["static", "constexpr", "local", "table", "constant", "function"]
doc = "Function-local compile-time constant, useful for lookup tables."
snippet = """
static constexpr ${1:int} ${2:kName} = ${3:0};$0"""

[[entries]]
name = "constinit"
keys = ["constinit", "static", "init", "compile", "c++20"]
doc = "C++20 static variable that must be constant-initialized."
snippet = """
constinit static ${1:int} ${2:name} = ${3:0};$0"""

[[entries]]
name = "static local"
keys = ["static", "local", "once", "persist", "counter", "keep"]
doc = "Local variable initialized once and kept across calls."
snippet = """
static ${1:int} ${2:name} = ${3:0};$0"""

[[entries]]
name = "thread_local"
keys = ["thread_local", "thread", "static", "per"]
doc = "Variable with one instance per thread."
snippet = """
thread_local ${1:int} ${2:name} = ${3:0};$0"""

[[entries]]
name = "volatile"
keys = ["volatile", "hardware", "register", "memory", "mapped"]
doc = "Variable whose every access is performed as written."
snippet = """
volatile ${1:int} ${2:name} = ${3:0};$0"""

[[entries]]
name = "variable from cast"
keys = ["var", "cast", "static_cast", "convert", "auto"]
doc = "Initialize from an explicit conversion."
snippet = """
auto ${1:n} = static_cast<${2:int}>(${3:value});$0"""

[[entries]]
name = "decltype"
keys = ["decltype", "type", "same", "as", "expression"]
doc = "Declare a variable with the type of an expression."
snippet = """
decltype(${1:expr}) ${2:name} = ${3:expr};$0"""

[[entries]]
name = "using alias (local)"
keys = ["using", "alias", "type", "typedef", "local", "shorten"]
doc = "Local type alias."
snippet = """
using ${1:Alias} = ${2:type};$0"""

[[entries]]
name = "typedef (local)"
keys = ["typedef", "alias", "type", "local", "c"]
doc = "C-style local type alias."
snippet = """
typedef ${1:unsigned long} ${2:ulong};$0"""

[[entries]]
name = "local enum"
keys = ["enum", "local", "class", "state", "function"]
doc = "Scoped enum declared inside a function."
snippet = """
enum class ${1:State} { ${2:Idle}, ${3:Running} };$0"""

[[entries]]
name = "local struct"
keys = ["struct", "local", "function", "helper", "record"]
doc = "Struct declared inside a function for local grouping."
snippet = """
struct ${1:Entry} {
    ${2:int} ${3:value};
    $0
};"""
