title = "Console I/O and formatting"
contexts = ["statement", "expression"]

[[entries]]
name = "cout"
keys = ["cout", "print", "output", "<<", "write", "display", "show"]
doc = "Write to standard output with a newline."
snippet = '''
std::cout << ${1:value} << '\n';$0'''

[[entries]]
name = "cout several values"
keys = ["cout", "print", "multiple", "several", "chain", "<<", "label"]
doc = "Chain several values and labels in one statement."
snippet = '''
std::cout << "${1:x = }" << ${2:x} << ", ${3:y = }" << ${4:y} << '\n';$0'''

[[entries]]
name = "cerr"
keys = ["cerr", "error", "stderr", "print", "warning"]
doc = "Write to unbuffered standard error."
snippet = '''
std::cerr << ${1:"error: "} << ${2:msg} << '\n';$0'''

[[entries]]
name = "clog"
keys = ["clog", "log", "stderr", "buffered", "diagnostic"]
doc = "Buffered logging to standard error."
snippet = '''
std::clog << ${1:msg} << '\n';$0'''

[[entries]]
name = "std::endl"
keys = ["endl", "newline", "flush", "line", "end"]
doc = "Newline plus flush; prefer '\\n' when flushing is not needed."
snippet = '''
std::endl$0'''

[[entries]]
name = "flush"
keys = ["flush", "cout", "buffer", "force", "output", "prompt"]
doc = "Force buffered output to appear, e.g. before reading input."
snippet = '''
std::cout << std::flush;$0'''

[[entries]]
name = "std::print / println"
keys = ["print", "println", "format", "output", "c++23", "fmt"]
doc = "C++23 formatted print to stdout, println adds a newline."
snippet = '''
std::println("{}", ${1:value});$0'''

[[entries]]
name = "print to stream"
keys = ["print", "println", "stream", "cerr", "file", "format", "c++23"]
doc = "C++23 formatted print to any ostream."
snippet = '''
std::println(${1:std::cerr}, "{}", ${2:value});$0'''

[[entries]]
name = "cin"
keys = ["cin", "read", "input", ">>", "scan", "enter"]
doc = "Read a whitespace-separated value from standard input."
snippet = '''
std::cin >> ${1:value};$0'''

[[entries]]
name = "cin several values"
keys = ["cin", "read", "multiple", "several", "two", "chain", ">>"]
doc = "Read several values in one statement."
snippet = '''
std::cin >> ${1:a} >> ${2:b};$0'''

[[entries]]
name = "prompt and read"
keys = ["prompt", "cin", "cout", "ask", "input", "read", "enter"]
doc = "Print a prompt then read the answer."
snippet = '''
std::cout << "${1:Enter a number: }";
${2:int} ${3:value};
std::cin >> ${3:value};$0'''

[[entries]]
name = "getline"
keys = ["getline", "read", "line", "input", "whole", "spaces", "string"]
doc = "Read a whole line, including spaces, into a string."
snippet = '''
std::string ${1:line};
std::getline(${2:std::cin}, ${1:line});$0'''

[[entries]]
name = "read all lines"
keys = ["getline", "while", "lines", "loop", "each", "read", "until eof"]
doc = "Loop over every line of a stream until EOF."
snippet = '''
for (std::string ${1:line}; std::getline(${2:in}, ${1:line});) {
    $0
}'''

[[entries]]
name = "read values until EOF"
keys = ["cin", "while", "loop", "eof", "read", "all", "numbers", "until"]
doc = "Read values until input ends or fails, without testing eof() first."
snippet = '''
for (${1:int} ${2:x}; ${3:std::cin} >> ${2:x};) {
    $0
}'''

[[entries]]
name = "read n values into vector"
keys = ["cin", "vector", "read", "n", "loop", "input", "numbers"]
doc = "Read a count then that many values."
snippet = '''
${1:int} ${2:n};
std::cin >> ${2:n};
std::vector<${3:int}> ${4:v}(${2:n});
for (auto &${5:x} : ${4:v}) {
    std::cin >> ${5:x};
}$0'''

[[entries]]
name = "cin fail handling"
keys = ["cin", "fail", "clear", "ignore", "invalid", "input", "retry", "validate"]
doc = "Recover from bad input by clearing the error state and discarding the line."
snippet = '''
if (!(std::cin >> ${1:value})) {
    std::cin.clear();
    std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\n');
    $0
}'''

[[entries]]
name = "cin ignore rest of line"
keys = ["ignore", "cin", "newline", "getline", "after", "mixing", "discard"]
doc = "Discard the newline left after >> before calling getline."
snippet = '''
std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\n');$0'''

[[entries]]
name = "read loop with validation"
keys = ["while", "input", "validate", "loop", "retry", "until", "valid", "cin"]
doc = "Keep asking until a valid value is entered."
snippet = '''
${1:int} ${2:value};
while (!(std::cin >> ${2:value})) {
    std::cin.clear();
    std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\n');
    std::cout << "${3:Try again: }";
}$0'''

[[entries]]
name = "sync_with_stdio"
keys = ["sync_with_stdio", "tie", "fast", "io", "speed", "competitive", "performance"]
doc = "Speed up iostreams by unsyncing from C stdio and untying cin from cout."
snippet = '''
std::ios::sync_with_stdio(false);
std::cin.tie(nullptr);$0'''
