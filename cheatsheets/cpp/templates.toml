title = "Templates"
contexts = ["item"]

[[entries]]
name = "function template"
keys = ["template", "fn", "function", "generic", "typename", "def"]
doc = "Function parameterized on a type, deduced from the arguments at the call."
snippet = """
template <typename ${1:T}>
${2:T} ${3:name}(${4:const T &value}) {
    $0
}"""

[[entries]]
name = "function template with class keyword"
keys = ["template", "class", "fn", "function", "generic", "old"]
doc = "Same as typename; class is the older spelling of a type parameter."
snippet = """
template <class ${1:T}>
${2:T} ${3:name}(${4:T value}) {
    $0
}"""

[[entries]]
name = "function template two parameters"
keys = ["template", "fn", "function", "generic", "two", "multiple", "pair"]
doc = "Function template with two independent type parameters."
snippet = """
template <typename ${1:T}, typename ${2:U}>
${3:auto} ${4:name}(${1:T} ${5:a}, ${2:U} ${6:b}) {
    $0
}"""

[[entries]]
name = "function template declaration"
keys = ["template", "fn", "function", "declare", "prototype", "header"]
doc = "Declare a function template; the definition must be visible where it is used."
snippet = """
template <typename ${1:T}>
${2:T} ${3:name}(${4:T value});$0"""

[[entries]]
name = "class template"
keys = ["template", "class", "generic", "container", "typename"]
doc = "Class parameterized on a type."
snippet = """
template <typename ${1:T}>
class ${2:Name} {
public:
    $0
};"""

[[entries]]
name = "struct template"
keys = ["template", "struct", "generic", "typename", "pod"]
doc = "Struct parameterized on a type."
snippet = """
template <typename ${1:T}>
struct ${2:Name} {
    $0
};"""

[[entries]]
name = "class template two parameters"
keys = ["template", "class", "generic", "key", "value", "map", "pair"]
doc = "Class template with two type parameters such as a key and a value."
snippet = """
template <typename ${1:K}, typename ${2:V}>
class ${3:Name} {
public:
    $0
};"""

[[entries]]
name = "class template with size"
keys = ["template", "class", "array", "size", "fixed", "nttp", "value"]
doc = "Class template with a type and a compile-time size parameter."
snippet = """
template <typename ${1:T}, std::size_t ${2:N}>
struct ${3:Array} {
    ${1:T} data[${2:N}];
    $0
};"""

[[entries]]
name = "member template"
keys = ["template", "member", "method", "generic", "class"]
doc = "Template member function inside a class."
snippet = """
template <typename ${1:U}>
${2:void} ${3:name}(${4:U &&value}) {
    $0
}"""

[[entries]]
name = "class template member out of line"
keys = ["template", "member", "method", "outline", "define", "definition", "cpp"]
doc = "Define a member of a class template outside the class body."
snippet = """
template <typename ${1:T}>
${2:void} ${3:Name}<${1:T}>::${4:method}(${5:}) {
    $0
}"""

[[entries]]
name = "class template static member"
keys = ["template", "static", "member", "define", "class", "count"]
doc = "Define a static data member of a class template."
snippet = """
template <typename ${1:T}>
${2:int} ${3:Name}<${1:T}>::${4:count} = ${5:0};$0"""

[[entries]]
name = "non-type template parameter"
keys = ["template", "non-type", "nttp", "value", "size", "int", "constant"]
doc = "Template parameterized on a compile-time value."
snippet = """
template <${1:std::size_t} ${2:N}>
${3:struct} ${4:Name} {
    $0
};"""

[[entries]]
name = "auto template parameter"
keys = ["template", "auto", "nttp", "value", "deduced", "constant"]
doc = "C++17 non-type parameter whose type is deduced from the argument."
snippet = """
template <auto ${1:V}>
${2:struct} ${3:Name} {
    $0
};"""

[[entries]]
name = "template template parameter"
keys = ["template", "template template", "container", "nested", "policy"]
doc = "Template parameter that is itself a template."
snippet = """
template <template <typename...> class ${1:Container}, typename ${2:T}>
${3:void} ${4:name}(const ${1:Container}<${2:T}> &${5:c}) {
    $0
}"""

[[entries]]
name = "default template argument"
keys = ["template", "default", "argument", "optional", "fallback"]
doc = "Template parameter with a default type or value, e.g. std::size_t N = 16."
snippet = """
template <typename ${1:T} = ${2:int}>
${3:struct} ${4:Name} {
    $0
};"""

[[entries]]
name = "template specialization"
keys = ["template", "specialization", "full", "explicit", "override", "specific"]
doc = "Full specialization of a class template for one type."
snippet = """
template <>
${1:struct} ${2:Name}<${3:int}> {
    $0
};"""

[[entries]]
name = "partial specialization"
keys = ["template", "specialization", "partial", "pointer", "family"]
doc = "Specialization for a family of types such as pointers."
snippet = """
template <typename ${1:T}>
struct ${2:Name}<${1:T} ${3:*}> {
    $0
};"""

[[entries]]
name = "function template specialization"
keys = ["template", "specialization", "function", "fn", "full", "overload"]
doc = "Full specialization of a function template (an overload is usually better)."
snippet = """
template <>
${1:void} ${2:name}<${3:int}>(${3:int} ${4:value}) {
    $0
}"""

[[entries]]
name = "alias template"
keys = ["using", "alias", "template", "typedef", "shorthand"]
doc = "Parameterized type alias."
snippet = """
template <typename ${1:T}>
using ${2:Vec} = ${3:std::vector<T>};$0"""

[[entries]]
name = "variable template"
keys = ["template", "variable", "constexpr", "_v", "constant", "value"]
doc = "Parameterized constexpr variable."
snippet = """
template <typename ${1:T}>
constexpr ${2:bool} ${3:is_small_v} = ${4:sizeof(T) <= 8};$0"""

[[entries]]
name = "explicit instantiation"
keys = ["template", "instantiation", "explicit", "instantiate", "cpp", "force"]
doc = "Force instantiation of a template for one type in this translation unit."
snippet = """
template ${1:class} ${2:Name}<${3:int}>;$0"""

[[entries]]
name = "extern template"
keys = ["template", "extern", "instantiation", "suppress", "header", "link"]
doc = "Suppress instantiation here; another translation unit provides it."
snippet = """
extern template ${1:class} ${2:Name}<${3:int}>;$0"""
