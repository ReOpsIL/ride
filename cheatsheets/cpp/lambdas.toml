title = "Lambdas and captures"
contexts = ["expression", "statement"]

[[entries]]
name = "lambda"
keys = ["lambda", "closure", "fn", "[]", "anonymous", "function", "inline"]
doc = "Anonymous function object; the brackets list what it captures."
snippet = """
[${1:}](${2:}) {
    $0
}"""

[[entries]]
name = "lambda one-liner"
keys = ["lambda", "closure", "inline", "short", "return", "expression"]
doc = "Single-expression lambda with a deduced return type."
snippet = """
[${1:}](${2:auto x}) { return ${3:x}; }$0"""

[[entries]]
name = "lambda stored in auto"
keys = ["lambda", "auto", "variable", "store", "assign", "named", "local"]
doc = "Keep a lambda in a local variable and call it by name."
snippet = """
auto ${1:name} = [${2:}](${3:int x}) {
    $0
};"""

[[entries]]
name = "lambda with return type"
keys = ["lambda", "return", "arrow", "type", "explicit", "->"]
doc = "Lambda with an explicit return type after an arrow."
snippet = """
[${1:}](${2:}) -> ${3:int} {
    $0
}"""

[[entries]]
name = "lambda no capture"
keys = ["lambda", "capture", "none", "empty", "stateless", "[]", "pure"]
doc = "Lambda that uses no locals; convertible to a plain function pointer."
snippet = """
[](${1:}) {
    $0
}"""

[[entries]]
name = "lambda capture by value"
keys = ["lambda", "capture", "value", "=", "copy", "all", "default"]
doc = "Copy every used local into the closure (this is no longer implied in C++20)."
snippet = """
[=](${1:}) {
    $0
}"""

[[entries]]
name = "lambda capture by reference"
keys = ["lambda", "capture", "reference", "&", "all", "default", "borrow"]
doc = "Refer to every used local by reference; the lambda must not outlive them."
snippet = """
[&](${1:}) {
    $0
}"""

[[entries]]
name = "lambda capture one by value"
keys = ["lambda", "capture", "value", "copy", "one", "named", "explicit"]
doc = "Copy one named local into the closure."
snippet = """
[${1:x}](${2:}) {
    $0
}"""

[[entries]]
name = "lambda capture one by reference"
keys = ["lambda", "capture", "reference", "&x", "one", "named", "explicit"]
doc = "Refer to one named local by reference."
snippet = """
[&${1:x}](${2:}) {
    $0
}"""

[[entries]]
name = "lambda capture list"
keys = ["lambda", "capture", "list", "several", "multiple", "mixed", "comma"]
doc = "Capture several locals, each by value or by reference."
snippet = """
[${1:a}, &${2:b}](${3:}) {
    $0
}"""

[[entries]]
name = "lambda capture default with exceptions"
keys = ["lambda", "capture", "mixed", "default", "except", "=, &", "&, ="]
doc = "Default capture with named exceptions, e.g. everything by value but one by reference."
snippet = """
[${1:=}, ${2:&out}](${3:}) {
    $0
}"""

[[entries]]
name = "lambda capture this"
keys = ["lambda", "capture", "this", "member", "method", "class", "self"]
doc = "Capture the enclosing object pointer so members are usable inside."
snippet = """
[this](${1:}) {
    $0
}"""

[[entries]]
name = "lambda capture *this"
keys = ["lambda", "capture", "*this", "copy", "object", "member", "async"]
doc = "C++17 copy the whole enclosing object into the closure, safe after it dies."
snippet = """
[*this](${1:}) {
    $0
}"""

[[entries]]
name = "lambda init capture"
keys = ["lambda", "capture", "init", "expression", "new", "named", "="]
doc = "Capture a new name initialized from any expression."
snippet = """
[${1:total} = ${2:compute()}](${3:}) {
    $0
}"""

[[entries]]
name = "lambda move capture"
keys = ["lambda", "capture", "move", "unique_ptr", "init", "ownership", "transfer"]
doc = "Move a local such as a unique_ptr into the closure."
snippet = """
[${1:p} = std::move(${2:p})](${3:}) {
    $0
}"""

[[entries]]
name = "lambda capture reference by init"
keys = ["lambda", "capture", "init", "reference", "alias", "&name"]
doc = "Init capture that binds a reference under a new name."
snippet = """
[&${1:ref} = ${2:object}](${3:}) {
    $0
}"""

[[entries]]
name = "lambda capture in member function"
keys = ["lambda", "member", "this", "method", "callback", "class", "field"]
doc = "Lambda inside a member function that uses fields through this."
snippet = """
auto ${1:callback} = [this](${2:int value}) {
    ${3:total_} += ${4:value};$0
};"""

[[entries]]
name = "mutable lambda"
keys = ["lambda", "mutable", "state", "counter", "modify", "capture"]
doc = "Lambda that may modify its by-value captures between calls."
snippet = """
[${1:count} = ${2:0}](${3:}) mutable {
    $0
}"""

[[entries]]
name = "lambda with default argument"
keys = ["lambda", "default", "argument", "parameter", "optional"]
doc = "Lambda parameter with a default value."
snippet = """
[](${1:int x}, ${2:int step = 1}) {
    $0
}"""

[[entries]]
name = "lambda returning lambda"
keys = ["lambda", "factory", "closure", "return", "nested", "curry", "adder"]
doc = "Function or lambda that builds and returns another closure."
snippet = """
auto ${1:make_adder} = [](${2:int n}) {
    return [${3:n}](${4:int x}) { return ${5:x + n}; };
};$0"""

[[entries]]
name = "lambda called immediately"
keys = ["lambda", "call", "invoke", "immediately", "()", "run"]
doc = "Define a lambda and call it in the same expression."
snippet = """
[${1:&}](${2:}) {
    $0
}(${3:});"""
