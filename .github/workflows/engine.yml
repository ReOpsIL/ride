name: engine

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  xcframework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: build-engine
        run: bash scripts/build-engine.sh
      - name: lipo-info
        run: |
          info=$(lipo -info app/RideEngine.xcframework/*/libride_engine.a)
          echo "$info"
          echo "$info" | grep -q x86_64
          echo "$info" | grep -q arm64

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: build-engine
        run: bash scripts/build-engine.sh
      - name: xcodebuild
        run: |
          xcodebuild -project app/Ride.xcodeproj -scheme Ride -configuration Debug \
            -derivedDataPath target/xcode -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO build test
